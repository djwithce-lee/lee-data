name: 식물노트 사진 받기

on:
  workflow_dispatch:
  push:
    paths:
      - "plantnote/index.html"
      - "plantnote/tools/fetch-photos.mjs"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: iNaturalist에서 사진 받기
        run: node plantnote/tools/fetch-photos.mjs
      - name: 받은 사진 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantnote/photos
          git diff --cached --quiet || git commit -m "식물노트 사진 업데이트"
          git push
