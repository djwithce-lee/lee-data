name: 식물노트 사진 받기

on:
  workflow_dispatch:
  push:
    paths:
      - "plantnote/index.html"
      - "plantnote/tools/fetch-photos.mjs"

permissions:
  contents: write
  actions: write

# 한 번에 하나씩만 돌려서 사진 저장이 겹치지 않게 해요
concurrency:
  group: plantnote-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: iNaturalist에서 사진 받기
        id: fetch
        run: node plantnote/tools/fetch-photos.mjs
        env:
          MAX_MINUTES: "100"
      - name: 받은 사진 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantnote/photos
          git diff --cached --quiet || git commit -m "식물노트 사진 업데이트"
          git pull --rebase origin main
          git push
      - name: 남은 사진 이어 받기
        if: steps.fetch.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run plantnote-photos.yml --ref main -R ${{ github.repository }}
