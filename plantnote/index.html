<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body>
<title>식물노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6b4f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling card list, fixed bottom tab bar */
:root {
  --bg: #f3f6f2;
  --surface: #ffffff;
  --fg: #1d2a22;
  --muted: #5f6f65;
  --line: #d9e2da;
  --leaf: #2f6b4f;
  --leaf-soft: #e1eee5;
  --water: #1f6fb2;
  --water-soft: #e2eef8;
  --due: #c2410c;
  --due-soft: #fde9dd;
  --sun: #b7791f;
  --cold: #4f5bb5;
  --cold-soft: #e8eaf8;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121815; --surface: #1b231f; --fg: #e4ece6; --muted: #9aaba0; --line: #2c3832;
  --leaf: #7cc39c; --leaf-soft: #1f3329; --water: #6fb3ec; --water-soft: #172a3a;
  --due: #fb923c; --due-soft: #3a2216; --sun: #e3b25a; --cold: #a5adf0; --cold-soft: #22253d; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121815; --surface: #1b231f; --fg: #e4ece6; --muted: #9aaba0; --line: #2c3832;
  --leaf: #7cc39c; --leaf-soft: #1f3329; --water: #6fb3ec; --water-soft: #172a3a;
  --due: #fb923c; --due-soft: #3a2216; --sun: #e3b25a; --cold: #a5adf0; --cold-soft: #22253d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 18px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; }
.today { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }

.banner { display: flex; gap: 12px; align-items: center; background: var(--due-soft); color: var(--fg); border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; }
.banner b { color: var(--due); }
.note { background: var(--leaf-soft); border-radius: var(--r); padding: 10px 14px; font-size: .88rem; color: var(--fg); margin-bottom: 14px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.note button { white-space: nowrap; background: none; border: 0; color: var(--leaf); font-weight: 600; padding: 4px; }

.section-label { font-size: .75rem; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.list { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
.card .name { font-weight: 600; font-size: 1.02rem; min-width: 0; }
.card .name small { color: var(--muted); font-weight: 400; font-size: .82rem; margin-left: 6px; }
.card .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.card .open { background: none; border: 0; padding: 0; text-align: left; color: inherit; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.chip.light { color: var(--sun); }
.chip.temp { color: var(--cold); background: var(--cold-soft); }
.banner.cold { background: var(--cold-soft); }
.banner.cold b { color: var(--cold); }
.fact.cold { background: var(--cold-soft); }
.chip.water { color: var(--water); background: var(--water-soft); }
.status { font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.status.ok { background: var(--leaf-soft); color: var(--leaf); }
.status.soon { background: var(--water-soft); color: var(--water); }
.status.due { background: var(--due-soft); color: var(--due); }
.water-btn { grid-column: 1 / -1; margin-top: 6px; border: 1px solid var(--water); background: var(--water); color: #fff; border-radius: 10px; padding: 9px; font-weight: 600; }
.water-btn.light { background: transparent; color: var(--water); }
.next { grid-column: 1 / -1; color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: 40px 12px; color: var(--muted); }
.empty h2 { color: var(--fg); margin-bottom: 6px; }
.primary { border: 0; background: var(--leaf); color: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 600; }

.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; }
.filters { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: .85rem; }
.light-filters { margin-top: 2px; }
.light-filters button { font-size: .8rem; padding: 4px 10px; }
.filters button[aria-pressed="true"] { background: var(--leaf); border-color: var(--leaf); color: var(--bg); }
.add-btn { border: 1px solid var(--leaf); color: var(--leaf); background: transparent; border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: .85rem; }
.card.added .open, .card.added .meta { opacity: .45; }
.card.added .add-btn { border-color: var(--line); color: var(--muted); font-weight: 500; opacity: .6; cursor: default; }
.acts { display: flex; gap: 6px; align-items: center; }
.wish-btn { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 10px; padding: 6px 9px; font-size: .85rem; line-height: 1; }
.wish-btn[aria-pressed="true"] { border-color: var(--rose, #d0607a); color: var(--rose, #d0607a); }
.card.added .wish-btn { visibility: hidden; }
.wish-acts { grid-column: 1 / -1; display: flex; gap: 8px; }
.wish-acts .primary { flex: 1; }
.add-btn[disabled] { border-color: var(--line); color: var(--muted); cursor: default; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs button { flex: 1; max-width: 190px; background: none; border: 0; padding: 12px 6px 14px; color: var(--muted); font-size: .85rem; display: flex; flex-direction: column; align-items: center; gap: 3px; }
nav.tabs button[aria-current="page"] { color: var(--leaf); font-weight: 600; }
nav.tabs svg { width: 22px; height: 22px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet .sci { color: var(--muted); font-style: italic; font-size: .88rem; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.fact { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.fact .k { font-size: .74rem; color: var(--muted); letter-spacing: .04em; }
.fact .v { font-weight: 600; margin-top: 2px; }
.meter { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 6px; }
.meter i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.meter.sun i.on { background: var(--sun); }
.meter.drop i.on { background: var(--water); }
.tip { font-size: .92rem; margin: 0 0 14px; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: .82rem; color: var(--muted); }
.field input, .field select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1; }
.ghost { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 10px; padding: 10px 14px; }
.danger { border: 0; background: none; color: var(--due); padding: 10px 0; }
.lookup { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.lookup p { margin: 4px 0 0; color: var(--muted); font-size: .88rem; }
.source-note { font-size: .82rem; color: var(--muted); background: var(--bg); border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; }
.sort-bar { margin: 0 0 12px; }
.card.movable { padding-left: 52px; position: relative; }
.mover { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); display: grid; gap: 6px; }
.mover button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: .8rem; }
.mover button[disabled] { opacity: .3; cursor: default; }
img.thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; vertical-align: middle; margin-right: 10px; }
.photo-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0 4px; }
.auto-gallery { display: grid; gap: 6px; margin: 14px 0 2px; }
.auto-gallery .k { font-size: .8rem; color: var(--muted); text-align: center; }
.auto-cell { aspect-ratio: 1; border-radius: 10px; background: var(--bg); overflow: hidden; position: relative; }
.auto-gallery .auto-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.auto-gallery .auto-cell.none::after { content: "사진 없음"; position: absolute; inset: 0; display: grid; place-items: center; font-size: .75rem; color: var(--muted); }
.slot-btn { position: relative; }
.slot-btn img[data-auto] { position: absolute; inset: 0; opacity: .85; }
.slot.has .slot-label { position: absolute; bottom: 4px; left: 4px; right: 4px; background: rgb(0 0 0 / .5); color: #fff; border-radius: 6px; font-size: .72rem; padding: 2px 4px; }
.credit { font-size: .72rem; color: var(--muted); margin: 4px 0 0; }
.photo-grid .k { font-size: .8rem; color: var(--muted); text-align: center; }
.photo-grid .slot { aspect-ratio: 1; }
.photo-row { display: grid; grid-template-columns: 2.2em repeat(2, minmax(0, 1fr)); gap: 8px; align-items: center; }
.photo-row.j { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.photo-row .k { font-size: .8rem; color: var(--muted); }
.slot { position: relative; aspect-ratio: 4 / 3; max-width: 100%; }
.slot-btn { width: 100%; height: 100%; border: 1px dashed var(--line); border-radius: 12px; background: var(--bg); color: var(--muted); font-size: .82rem; padding: 0; overflow: hidden; display: grid; place-items: center; }
.slot-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot-x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgb(0 0 0 / .55); color: #fff; font-size: .75rem; }
textarea { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; resize: vertical; }
.journal-head { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.entry { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.entry p { margin: 6px 0 0; font-size: .92rem; overflow-wrap: anywhere; }
.entry-top { display: flex; justify-content: space-between; align-items: center; font-variant-numeric: tabular-nums; }
.entry-photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.entry-photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
.link { background: none; border: 0; color: var(--water); padding: 4px; font-size: .85rem; }
.chip.fert { color: var(--leaf); background: var(--leaf-soft); }
.taxline { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.tax { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; background: var(--bg); border-radius: 12px; padding: 10px 12px; margin: 14px 0 0; font-size: .88rem; }
.tax .size-note { color: var(--muted); font-size: .85rem; }
.tax .wide { grid-column: 1 / -1; }
.tax .k { display: block; font-size: .72rem; color: var(--muted); }
.tax i { overflow-wrap: anywhere; }
.fert-box { margin: 4px 0 14px; }
.prop-box { margin: 4px 0 14px; }
.prop-box h3 { font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 6px; }
.prop-box ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.prop-box li b { display: block; font-size: .92rem; }
.prop-box li span { color: var(--muted); font-size: .86rem; }
.fert-box h3 { font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 2px; }
.fert-row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: .88rem; }
.fert-row small { color: var(--muted); font-weight: 400; display: block; font-size: .72rem; }
.fert-row.now { background: var(--leaf-soft); }
.now-tag { display: inline-block; margin-top: 2px; font-size: .68rem; color: var(--leaf); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .88rem; z-index: 30; }
.setting { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 10px; }
.setting p { margin: 4px 0 10px; color: var(--muted); font-size: .88rem; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>

<div class="wrap">
  <header class="top">
    <h1 id="title">내 식물</h1>
    <span class="today" id="today"></span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="화면 이동">
  <button id="tab-home" data-tab="home" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c-4-3-7-6.5-7-10.5C5 6 8 3 12 3s7 3 7 7.5C19 14.5 16 18 12 21z"/><path d="M12 21V9"/></svg>내 식물</button>
  <button id="tab-find" data-tab="find">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>식물 찾기</button>
  <button id="tab-wish" data-tab="wish">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>위시리스트</button>
  <button id="tab-settings" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 7H4c0-1 2-2 2-7z"/><path d="M10 20a2 2 0 004 0"/></svg>알림 설정</button>
</nav>

<script>
// ── 기본 식물 데이터 ──
// light: 1 음지, 2 반음지, 3 양지 / amount: 1 조금, 2 보통, 3 흠뻑
// days: 봄~가을 물주기 간격, winter: 겨울(12~2월) 간격 / pet: true 독성 주의, false 비교적 안전, 없음 = 정보 부족
// temp: 잘 자라는 생장 온도, min: 이 온도 아래로 내려가면 냉해·동사 위험 (화분 기준, 대략값)
const PLANTS = [
  { id:"monstera", name:"몬스테라", alias:["몬스테라 델리시오사"], sci:"Monstera deliciosa", light:2, amount:3, days:7, winter:12, temp:"18~27℃", min:10, pet:true, care:"겉흙이 2~3cm 말랐을 때 화분 밑으로 물이 빠질 만큼 흠뻑 주세요. 직사광선은 잎을 태우니 밝은 간접광이 좋아요." },
  { id:"hime", name:"히메몬스테라", alias:["몬스테라 아단소니","오블리쿠아"], sci:"Monstera adansonii", light:2, amount:2, days:7, winter:10, temp:"18~27℃", min:10, pet:true, care:"겉흙이 마르면 주세요. 습도를 좋아해서 잎에 분무해 주면 잘 자라요." },
  { id:"stucky", name:"스투키", alias:["산세베리아 스투키"], sci:"Sansevieria cylindrica", light:2, amount:1, days:30, winter:45, temp:"15~30℃", min:10, pet:true, care:"흙이 완전히 마른 뒤 한 달에 한 번 정도 주세요. 과습이 가장 큰 적이에요." },
  { id:"sansevieria", name:"산세베리아", alias:["산세비에리아","스네이크플랜트"], sci:"Dracaena trifasciata", light:2, amount:1, days:21, winter:35, temp:"15~30℃", min:10, pet:true, care:"흙 속까지 바짝 마르면 주세요. 어두운 곳도 견디지만 밝은 곳에서 더 튼튼해요." },
  { id:"pothos", name:"스킨답서스", alias:["포토스","스킨"], sci:"Epipremnum aureum", light:1, amount:2, days:7, winter:10, temp:"16~28℃", min:10, pet:true, care:"겉흙이 마르면 주세요. 잎이 처지면 목마르다는 신호예요. 그늘에서도 잘 자라요." },
  { id:"zz", name:"금전수", alias:["돈나무","자미오쿨카스","ZZ플랜트"], sci:"Zamioculcas zamiifolia", light:1, amount:2, days:21, winter:30, temp:"18~26℃", min:10, pet:true, care:"줄기에 물을 저장해서 흙이 완전히 마른 뒤에 주세요. 어두운 실내에서도 잘 버텨요." },
  { id:"rubber", name:"고무나무", alias:["인도고무나무","멜라니고무나무","수채화고무나무","버건디고무나무","티네케"], sci:"Ficus elastica", light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아주면 광합성에 좋아요." },

  { id:"ox_tuberosa", name:"오카 (안데스 사랑초)", alias:["오카", "Oca", "투베로사", "덩이줄기 사랑초", "사랑초", "옥살리스"], sci:"Oxalis tuberosa", cat:"flower", light:3, amount:2, days:5, winter:10, temp:"15~25℃", min:5, pet:true, care:"안데스에서 감자처럼 덩이줄기를 먹는 작물이에요. 해가 짧아지는 가을에 덩이줄기가 굵어지니 서리 전까지 키워 캐세요. 여름에 자라고 겨울에 쉬는 사랑초예요. 겉흙이 마르면 흠뻑 주세요. 잎이 누렇게 지며 쉬기 시작하면 물을 끊고, 새순이 올라오면 다시 주세요.", habitat:"남아메리카 안데스 고원 (페루·볼리비아)" },

  { id:"ox_valdiviensis", name:"발디비엔시스 사랑초", alias:["발디비엔시스", "칠레 노랑사랑초", "사랑초", "옥살리스"], sci:"Oxalis valdiviensis", cat:"flower", light:2, amount:2, days:5, winter:10, temp:"15~25℃", min:5, pet:true, care:"노란 꽃 안쪽에 붉은 줄이 있는 한해살이예요. 여름에 자라고 겨울에 쉬는 사랑초예요. 겉흙이 마르면 흠뻑 주세요. 잎이 누렇게 지며 쉬기 시작하면 물을 끊고, 새순이 올라오면 다시 주세요.", habitat:"칠레 남부" },
  { id:"ox_lobata", name:"로바타 사랑초", alias:["로바타", "가을 노랑사랑초", "사랑초", "옥살리스"], sci:"Oxalis lobata", cat:"flower", light:3, amount:2, days:5, winter:6, temp:"10~22℃", min:3, pet:true, care:"초가을에 싹이 나며 금빛 노란 꽃이 펴요. 가을에 싹이 나 겨울~봄에 꽃 피고 여름에 쉬는 사랑초예요. 9~10월에 구근을 심고 자라는 동안 겉흙이 마르면 주세요. 늦봄에 잎이 지면 물을 끊고 그늘에서 말려 두세요. 햇빛이 부족하면 줄기가 웃자라요.", habitat:"칠레·아르헨티나" },
  { id:"ox_sunset_velvet", name:"선셋 벨벳 사랑초", alias:["Sunset Velvet", "선셋벨벳", "사랑초", "옥살리스"], sci:"Oxalis vulcanicola 'Sunset Velvet'", cat:"flower", light:3, amount:2, days:6, winter:12, temp:"16~26℃", min:8, pet:true, care:"붉은빛이 도는 잎에 노란 꽃이 펴고 늘어져 자라요. 구근이 없어 쉬는 시기가 뚜렷하지 않아요. 겉흙이 마르면 주고, 겨울엔 물을 줄여 밝은 곳에 두세요.", habitat:"중앙아메리카 고산 화산 지대 (원종 기준)" },

  { id:"ficus_triangularis", name:"트라이앵귤라리스 고무나무", alias:["트라이앵귤라리스", "세모잎고무나무"], sci:"Ficus triangularis", cat:"foliage", tree:true, light:3, amount:2, days:7, winter:10, temp:"16~28℃", min:7, pet:true, care:"세모난 작은 잎이 귀여운 고무나무예요. 무늬종도 있어요. 겉흙이 마르면 주세요. 환경이 바뀌면 잎이 떨어질 수 있으니 밝은 곳에 고정해 두세요.", habitat:"열대 아프리카", size:"m" },
  { id:"ficus_audrey", name:"아우드리 고무나무", alias:["아우드리", "Audrey", "벵갈 아우드리"], sci:"Ficus benghalensis 'Audrey'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"벵갈고무나무의 품종으로 잎맥이 연하고 벨벳 같은 잎이 특징이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아 주고, 자리를 자주 옮기면 잎을 떨궈요." },
  { id:"dr_lemonlime", name:"레몬라임 드라세나", alias:["레몬라임", "Lemon Lime"], sci:"Dracaena fragrans 'Lemon Lime'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:10, pet:true, care:"초록 잎에 연두·흰 줄무늬가 선명해요. 흙이 절반쯤 마르면 주세요. 과습에 약하고, 수돗물의 불소에 잎끝이 탈 수 있어 받아둔 물이 좋아요.", size:"m" },
  { id:"dr_janetcraig", name:"자넷크레이그 드라세나", alias:["자넷크레이그", "Janet Craig"], sci:"Dracaena fragrans 'Janet Craig'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:10, pet:true, care:"짙은 초록 잎이 윤기 나는 품종으로 어두운 곳에 강해요. 흙이 절반쯤 마르면 주세요. 과습에 약하고, 수돗물의 불소에 잎끝이 탈 수 있어 받아둔 물이 좋아요." },
  { id:"dr_lisa", name:"리사 드라세나", alias:["리사", "Lisa"], sci:"Dracaena fragrans 'Lisa'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:10, pet:true, care:"짙은 초록 잎이 위로 곧게 자라는 품종이에요. 흙이 절반쯤 마르면 주세요. 과습에 약하고, 수돗물의 불소에 잎끝이 탈 수 있어 받아둔 물이 좋아요." },
  { id:"dr_tricolor", name:"트리컬러 마지나타", alias:["트리컬러", "Tricolor", "드라세나 트리컬러"], sci:"Dracaena marginata 'Tricolor'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:10, pet:true, care:"가는 잎에 초록·크림·붉은 줄이 들어가요. 흙이 절반쯤 마르면 주세요. 과습에 약하고, 수돗물의 불소에 잎끝이 탈 수 있어 받아둔 물이 좋아요." },
  { id:"dr_colorama", name:"콜로라마 마지나타", alias:["콜로라마", "Colorama"], sci:"Dracaena marginata 'Colorama'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:10, pet:true, care:"붉은 빛이 잎 전체에 넓게 도는 품종이에요. 흙이 절반쯤 마르면 주세요. 과습에 약하고, 수돗물의 불소에 잎끝이 탈 수 있어 받아둔 물이 좋아요." },
  { id:"dr_jamaica", name:"송오브자메이카", alias:["송오브자메이카", "Song of Jamaica"], sci:"Dracaena reflexa 'Song of Jamaica'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:10, pet:true, care:"짙은 초록 잎에 연두 줄무늬가 들어가요. 흙이 절반쯤 마르면 주세요. 과습에 약하고, 수돗물의 불소에 잎끝이 탈 수 있어 받아둔 물이 좋아요." },
  { id:"sc_capella", name:"골드카펠라 홍콩야자", alias:["골드카펠라", "Gold Capella", "무늬홍콩야자"], sci:"Schefflera arboricola 'Gold Capella'", cat:"foliage", tree:true, light:2, amount:2, days:7, winter:12, temp:"15~28℃", min:5, pet:true, care:"초록 잎에 노란 무늬가 들어간 홍콩야자예요. 겉흙이 마르면 흠뻑 주세요. 밝은 간접광에서 잎 색이 선명해요.", size:"m" },
  { id:"sc_amate", name:"아마테 쉐플레라", alias:["아마테", "Amate", "쉐플레라"], sci:"Schefflera actinophylla 'Amate'", cat:"foliage", tree:true, light:2, amount:2, days:7, winter:12, temp:"15~28℃", min:5, pet:true, care:"큰 우산 모양 잎이 시원한 대형 쉐플레라예요. 겉흙이 마르면 흠뻑 주세요. 밝은 간접광에서 잎 색이 선명해요.", habitat:"호주 북동부·뉴기니 열대우림" },
  { id:"polyscias", name:"폴리셔스", alias:["폴리시아스", "밍아랄리아", "Ming Aralia"], sci:"Polyscias fruticosa", cat:"foliage", tree:true, light:2, amount:2, days:7, winter:12, temp:"15~28℃", min:12, pet:true, care:"잘게 갈라진 잎이 분재처럼 멋스러워요. 자리 이동과 찬바람에 약해요. 겉흙이 마르면 흠뻑 주세요. 밝은 간접광에서 잎 색이 선명해요." },
  { id:"polyscias_fabian", name:"파비안 폴리셔스", alias:["파비안", "Fabian", "둥근잎 폴리시아스"], sci:"Polyscias scutellaria 'Fabian'", cat:"foliage", tree:true, light:2, amount:2, days:7, winter:12, temp:"15~28℃", min:12, pet:true, care:"둥근 잎 뒷면이 자주빛인 폴리셔스예요. 겉흙이 마르면 흠뻑 주세요. 밝은 간접광에서 잎 색이 선명해요.", size:"m" },
  { id:"laurus", name:"월계수", alias:["월계수나무", "로리에", "베이리프", "Bay Laurel"], sci:"Laurus nobilis", cat:"herb", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:-5, pet:true, care:"잎을 말려 요리에 쓰는 향신 나무예요. 추위에 꽤 강해 남부 지방은 바깥에서도 겨울을 나요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요." },
  { id:"ct_meyer", name:"마이어 레몬", alias:["마이어레몬", "Meyer Lemon"], sci:"Citrus × meyeri", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"레몬과 귤의 교배종으로 껍질이 얇고 덜 시어요. 작게 자라 화분용으로 인기예요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"원예 교배종 (중국 원산)", size:"m" },
  { id:"ct_eureka", name:"유레카 레몬", alias:["유레카", "Eureka"], sci:"Citrus limon 'Eureka'", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"가시가 적고 1년 내내 꽃이 피는 대표 레몬 품종이에요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"원예 품종 · 미국 캘리포니아" },
  { id:"ct_keylime", name:"키라임", alias:["키라임", "멕시칸라임", "Key Lime"], sci:"Citrus × aurantiifolia", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:5, pet:true, care:"작고 향이 진한 라임이에요. 추위에 가장 약한 감귤이라 겨울엔 꼭 실내로 들여요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"동남아시아 (교배종)" },
  { id:"ct_finger", name:"핑거라임", alias:["핑거라임", "캐비어라임", "Finger Lime"], sci:"Citrus australasica", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"손가락 모양 열매 속에 캐비어 같은 알갱이가 들어 있어요. 가시가 많아요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"호주 동부 열대우림", size:"m" },
  { id:"ct_calamansi", name:"칼라만시", alias:["깔라만시", "Calamansi"], sci:"Citrus × microcarpa", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"작은 열매가 많이 달리고 화분에서 잘 자라요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"필리핀·동남아시아", size:"m" },
  { id:"ct_yuja", name:"유자나무", alias:["유자", "Yuzu"], sci:"Citrus junos", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:-7, pet:true, care:"감귤 중 추위에 강한 편이라 남부 지방은 바깥에서 겨울을 나요. 가시가 날카로워요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"중국 양쯔강 유역 (한국 남해안 재배)" },
  { id:"ct_hallabong", name:"한라봉나무", alias:["한라봉", "부지화", "Shiranui"], sci:"Citrus 'Shiranui'", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"꼭지가 볼록 튀어나온 달콤한 만감류예요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"원예 품종 · 일본 개량 (제주 재배)" },
  { id:"ct_redhyang", name:"레드향나무", alias:["레드향","감평"], sci:"Citrus 'Kanpei'", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"껍질이 붉고 과즙이 많은 만감류예요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"원예 품종 · 일본 개량 (제주 재배)" },
  { id:"ct_cheonhye", name:"천혜향나무", alias:["천혜향", "세토카"], sci:"Citrus 'Setoka'", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"향이 진하고 껍질이 얇은 만감류예요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"원예 품종 · 일본 개량 (제주 재배)" },
  { id:"ct_orange", name:"오렌지나무", alias:["오렌지", "발렌시아오렌지", "Orange"], sci:"Citrus × sinensis", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"햇빛을 아주 많이 봐야 열매가 달고 잘 익어요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"중국 남부·동남아시아 (교배종)" },
  { id:"ct_grapefruit", name:"자몽나무", alias:["자몽", "그레이프프루트"], sci:"Citrus × paradisi", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"15~28℃", min:3, pet:true, care:"크게 자라는 감귤이라 넓은 공간이 필요해요. 하루 6시간 이상 햇빛이 필요해요. 겉흙이 마르면 흠뻑 주고, 겨울엔 3℃ 아래로 내려가지 않게 실내로 들여요.", habitat:"카리브해 바베이도스 (교배종)" },
  { id:"fg_violette", name:"바이올렛 드 보르도 무화과", alias:["바이올렛 드 보르도", "Violette de Bordeaux", "네그로네"], sci:"Ficus carica 'Violette de Bordeaux'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:14, temp:"15~30℃", min:-10, pet:true, care:"짙은 보라 열매가 달고 작게 자라 화분용으로 좋아요. 여름엔 물을 많이 먹어 거의 매일 줘야 할 수 있어요. 겨울엔 잎이 지고 쉬니 물을 확 줄여 주세요.", habitat:"원예 품종 · 프랑스", size:"m" },
  { id:"fg_chicago", name:"시카고 하디 무화과", alias:["시카고 하디", "Chicago Hardy"], sci:"Ficus carica 'Chicago Hardy'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:14, temp:"15~30℃", min:-15, pet:true, care:"추위에 매우 강해 땅 위 가지가 얼어도 뿌리에서 다시 나와 열매를 맺어요. 여름엔 물을 많이 먹어 거의 매일 줘야 할 수 있어요. 겨울엔 잎이 지고 쉬니 물을 확 줄여 주세요.", habitat:"원예 품종 · 미국" },
  { id:"fg_celeste", name:"셀레스트 무화과", alias:["셀레스트", "Celeste", "슈가피그"], sci:"Ficus carica 'Celeste'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:14, temp:"15~30℃", min:-10, pet:true, care:"작고 아주 단 열매가 열려요. 추위에 강한 편이에요. 여름엔 물을 많이 먹어 거의 매일 줘야 할 수 있어요. 겨울엔 잎이 지고 쉬니 물을 확 줄여 주세요.", habitat:"원예 품종 · 미국 남부" },
  { id:"fg_lsugold", name:"LSU 골드 무화과", alias:["LSU골드", "LSU Gold"], sci:"Ficus carica 'LSU Gold'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:14, temp:"15~30℃", min:-10, pet:true, care:"크고 노란 열매가 열리는 품종이에요. 여름엔 물을 많이 먹어 거의 매일 줘야 할 수 있어요. 겨울엔 잎이 지고 쉬니 물을 확 줄여 주세요.", habitat:"원예 품종 · 미국 루이지애나" },
  { id:"fg_marseilles", name:"화이트 마르세유 무화과", alias:["화이트 마르세유", "White Marseilles"], sci:"Ficus carica 'White Marseilles'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:14, temp:"15~30℃", min:-10, pet:true, care:"연두색 껍질에 속이 하얀 열매가 열려요. 여름엔 물을 많이 먹어 거의 매일 줘야 할 수 있어요. 겨울엔 잎이 지고 쉬니 물을 확 줄여 주세요.", habitat:"원예 품종 · 프랑스" },
  { id:"fg_bnb", name:"봉판포르 무화과", alias:["봉판포르", "Bonne Bouche", "비올레 솔리에스"], sci:"Ficus carica 'Violette de Solliès'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:14, temp:"15~30℃", min:-10, pet:true, care:"짙은 보라 껍질에 붉은 속살, 늦가을에 익는 맛있는 품종이에요. 여름엔 물을 많이 먹어 거의 매일 줘야 할 수 있어요. 겨울엔 잎이 지고 쉬니 물을 확 줄여 주세요.", habitat:"원예 품종 · 프랑스 프로방스" },
  { id:"bb_duke", name:"듀크 블루베리", alias:["듀크", "Duke"], sci:"Vaccinium corymbosum 'Duke'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:7, temp:"15~25℃", min:-15, pet:false, care:"일찍 익는 하이부시 품종으로 열매가 크고 많이 달려요. 산성 흙(블루베리 전용 흙)에 심고 흙이 마르지 않게 자주 주세요. 겨울에 7℃ 아래 추위를 겪어야 꽃눈이 생겨요. 두 품종 이상 함께 키우면 열매가 더 잘 달려요.", habitat:"원예 품종 · 미국 (원종은 북아메리카 동부)", size:"m" },
  { id:"bb_bluecrop", name:"블루크롭 블루베리", alias:["블루크롭", "Bluecrop"], sci:"Vaccinium corymbosum 'Bluecrop'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:7, temp:"15~25℃", min:-15, pet:false, care:"가장 널리 키우는 하이부시 품종이에요. 추위에 강해요. 산성 흙(블루베리 전용 흙)에 심고 흙이 마르지 않게 자주 주세요. 겨울에 7℃ 아래 추위를 겪어야 꽃눈이 생겨요. 두 품종 이상 함께 키우면 열매가 더 잘 달려요.", habitat:"원예 품종 · 미국 (원종은 북아메리카 동부)", size:"m" },
  { id:"bb_sunshine", name:"선샤인블루 블루베리", alias:["선샤인블루", "Sunshine Blue"], sci:"Vaccinium corymbosum 'Sunshine Blue'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:7, temp:"15~25℃", min:-10, pet:false, care:"작게 자라고 혼자서도 열매가 잘 달려 화분용으로 좋아요. 분홍 꽃이 예뻐요. 산성 흙(블루베리 전용 흙)에 심고 흙이 마르지 않게 자주 주세요. 겨울에 7℃ 아래 추위를 겪어야 꽃눈이 생겨요. 두 품종 이상 함께 키우면 열매가 더 잘 달려요.", habitat:"원예 품종 · 미국", size:"m" },
  { id:"bb_oneal", name:"오닐 블루베리", alias:["오닐", "O'Neal"], sci:"Vaccinium corymbosum 'O'Neal'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:7, temp:"15~25℃", min:-10, pet:false, care:"남부 하이부시 품종으로 겨울 추위를 덜 겪어도 열매가 달려요. 산성 흙(블루베리 전용 흙)에 심고 흙이 마르지 않게 자주 주세요. 겨울에 7℃ 아래 추위를 겪어야 꽃눈이 생겨요. 두 품종 이상 함께 키우면 열매가 더 잘 달려요.", habitat:"원예 품종 · 미국 남부", size:"m" },
  { id:"bb_pink", name:"핑크레모네이드 블루베리", alias:["핑크레모네이드", "Pink Lemonade", "핑크블루베리"], sci:"Vaccinium 'Pink Lemonade'", cat:"fruit", tree:true, light:3, amount:3, days:3, winter:7, temp:"15~25℃", min:-15, pet:false, care:"분홍색으로 익는 특이한 블루베리예요. 산성 흙(블루베리 전용 흙)에 심고 흙이 마르지 않게 자주 주세요. 겨울에 7℃ 아래 추위를 겪어야 꽃눈이 생겨요. 두 품종 이상 함께 키우면 열매가 더 잘 달려요.", habitat:"원예 품종 · 미국", size:"m" },
  { id:"mp_bloodgood", name:"홍단풍 (블러드굿)", alias:["홍단풍", "블러드굿", "Bloodgood", "노무라단풍"], sci:"Acer palmatum 'Bloodgood'", cat:"foliage", tree:true, light:2, amount:3, days:2, winter:7, temp:"10~25℃", min:-20, pet:false, care:"봄부터 가을까지 잎이 붉은 대표 홍단풍이에요. 햇빛을 잘 봐야 붉은색이 진해요. 물을 좋아해서 여름엔 거의 매일 줘요. 한여름 땡볕엔 잎이 타니 반그늘이 좋고, 겨울은 바깥 추위를 겪어야 봄에 잘 나와요." },
  { id:"mp_cheong", name:"청단풍", alias:["청단풍", "초록단풍"], sci:"Acer palmatum", cat:"foliage", tree:true, light:2, amount:3, days:2, winter:7, temp:"10~25℃", min:-20, pet:false, care:"여름엔 초록, 가을엔 붉게 물드는 기본 단풍나무예요. 물을 좋아해서 여름엔 거의 매일 줘요. 한여름 땡볕엔 잎이 타니 반그늘이 좋고, 겨울은 바깥 추위를 겪어야 봄에 잘 나와요." },
  { id:"mp_sangokaku", name:"산고카쿠 단풍", alias:["산고카쿠", "Sango-kaku", "산호각단풍"], sci:"Acer palmatum 'Sango-kaku'", cat:"foliage", tree:true, light:2, amount:3, days:2, winter:7, temp:"10~25℃", min:-20, pet:false, care:"겨울에 어린 가지가 산호처럼 빨갛게 되는 품종이에요. 물을 좋아해서 여름엔 거의 매일 줘요. 한여름 땡볕엔 잎이 타니 반그늘이 좋고, 겨울은 바깥 추위를 겪어야 봄에 잘 나와요." },
  { id:"mp_katsura", name:"카츠라 단풍", alias:["카츠라", "Katsura"], sci:"Acer palmatum 'Katsura'", cat:"foliage", tree:true, light:2, amount:3, days:2, winter:7, temp:"10~25℃", min:-20, pet:false, care:"봄 새잎이 주황·노랑으로 나와 화사해요. 작게 자라요. 물을 좋아해서 여름엔 거의 매일 줘요. 한여름 땡볕엔 잎이 타니 반그늘이 좋고, 겨울은 바깥 추위를 겪어야 봄에 잘 나와요.", size:"m" },
  { id:"mp_shishigashira", name:"사자두 단풍", alias:["시시가시라", "사자두", "Shishigashira"], sci:"Acer palmatum 'Shishigashira'", cat:"foliage", tree:true, light:2, amount:3, days:2, winter:7, temp:"10~25℃", min:-20, pet:false, care:"잎이 오글오글 뭉쳐 나고 천천히 자라 분재로 인기예요. 물을 좋아해서 여름엔 거의 매일 줘요. 한여름 땡볕엔 잎이 타니 반그늘이 좋고, 겨울은 바깥 추위를 겪어야 봄에 잘 나와요.", size:"m" },
  { id:"acer_dang", name:"당단풍나무", alias:["당단풍"], sci:"Acer pseudosieboldianum", cat:"foliage", tree:true, light:2, amount:3, days:2, winter:7, temp:"10~25℃", min:-20, pet:false, care:"잎이 9~11갈래로 갈라지고 가을에 붉게 물드는 우리 산 단풍이에요. 물을 좋아해서 여름엔 거의 매일 줘요. 한여름 땡볕엔 잎이 타니 반그늘이 좋고, 겨울은 바깥 추위를 겪어야 봄에 잘 나와요.", habitat:"한국·중국 동북부 산지 숲" },

  { id:"acer_sugar", name:"설탕단풍", alias:["슈가메이플", "Sugar Maple", "캐나다단풍"], sci:"Acer saccharum", cat:"foliage", tree:true, light:2, amount:3, days:2, winter:7, temp:"10~25℃", min:-20, pet:false, care:"메이플시럽을 얻는 나무로 가을에 주황·빨강으로 물들어요. 물을 좋아해서 여름엔 거의 매일 줘요. 한여름 땡볕엔 잎이 타니 반그늘이 좋고, 겨울은 바깥 추위를 겪어야 봄에 잘 나와요.", habitat:"북아메리카 동북부 (캐나다)" },
  { id:"acer_crimson", name:"크림슨킹 노르웨이단풍", alias:["크림슨킹", "Crimson King"], sci:"Acer platanoides 'Crimson King'", cat:"foliage", tree:true, light:2, amount:3, days:2, winter:7, temp:"10~25℃", min:-20, pet:false, care:"여름 내내 짙은 적자색 잎을 유지하는 큰 단풍나무예요. 물을 좋아해서 여름엔 거의 매일 줘요. 한여름 땡볕엔 잎이 타니 반그늘이 좋고, 겨울은 바깥 추위를 겪어야 봄에 잘 나와요.", habitat:"원예 품종 (원종은 유럽)" },

  { id:"eu_cinerea", name:"은달러 유칼립투스", alias:["시네레아", "실버달러", "Silver Dollar", "은빛유칼립투스"], sci:"Eucalyptus cinerea", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:8, temp:"10~28℃", min:-5, pet:true, care:"동전처럼 둥근 은청색 잎이 특징이라 꽃꽂이 소재로도 인기예요. 햇빛과 바람이 아주 중요해요. 물을 좋아하지만 과습은 싫어하니 겉흙이 마르면 흠뻑 주세요. 한 번 바싹 마르면 회복이 어려워요.", habitat:"호주 남동부" },
  { id:"eu_babyblue", name:"베이비블루 유칼립투스", alias:["베이비블루", "Baby Blue", "풀베룰렌타"], sci:"Eucalyptus pulverulenta 'Baby Blue'", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:8, temp:"10~28℃", min:-5, pet:true, care:"줄기를 감싸듯 둥근 은청색 잎이 촘촘히 달려요. 햇빛과 바람이 아주 중요해요. 물을 좋아하지만 과습은 싫어하니 겉흙이 마르면 흠뻑 주세요. 한 번 바싹 마르면 회복이 어려워요.", habitat:"원예 품종 (원종은 호주 남동부)", size:"m" },
  { id:"eu_globulus", name:"글로불루스 유칼립투스", alias:["글로불루스", "블루검", "Blue Gum"], sci:"Eucalyptus globulus", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:8, temp:"10~28℃", min:-5, pet:true, care:"향이 가장 진한 유칼립투스예요. 어린 잎은 둥글고 다 자라면 길쭉해져요. 햇빛과 바람이 아주 중요해요. 물을 좋아하지만 과습은 싫어하니 겉흙이 마르면 흠뻑 주세요. 한 번 바싹 마르면 회복이 어려워요.", habitat:"호주 태즈메이니아·빅토리아" },
  { id:"cf_gusang", name:"구상나무", alias:["구상나무", "Korean Fir", "한국전나무"], sci:"Abies koreana", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:10, temp:"5~25℃", min:-20, pet:false, care:"크리스마스트리로 세계에 알려진 우리 특산 나무예요. 더위에 약해 여름엔 시원한 반그늘이 좋아요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥이 좋아요.", habitat:"한국 한라산·지리산·덕유산 고산" },

  { id:"cf_bluespruce", name:"블루스프루스", alias:["블루스프루스", "콜로라도 블루스프루스", "Blue Spruce"], sci:"Picea pungens 'Glauca'", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:10, temp:"5~25℃", min:-20, pet:false, care:"잎이 푸른 은빛을 띠는 가문비나무예요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥이 좋아요.", habitat:"북아메리카 로키산맥" },

  { id:"cf_rheingold", name:"라인골드 측백", alias:["라인골드", "Rheingold", "황금측백"], sci:"Thuja occidentalis 'Rheingold'", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:10, temp:"5~25℃", min:-20, pet:false, care:"둥글게 자라고 겨울엔 구릿빛으로 변하는 황금 측백이에요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥이 좋아요.", habitat:"원예 품종 (원종은 북아메리카 동부)", size:"m" },
  { id:"cf_danica", name:"다니카 측백", alias:["다니카", "Danica", "둥근측백"], sci:"Thuja occidentalis 'Danica'", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:10, temp:"5~25℃", min:-20, pet:false, care:"공처럼 동그랗게 자라는 작은 측백이에요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥이 좋아요.", habitat:"원예 품종 (원종은 북아메리카 동부)", size:"m" },
  { id:"fr_apple", name:"사과나무", alias:["사과", "Apple"], sci:"Malus domestica", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-15, pet:false, care:"대부분 다른 품종 꽃가루가 있어야 열매가 달려요. 꽃사과를 수분수로 함께 키우면 좋아요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"중앙아시아 카자흐스탄 톈산산맥" },
  { id:"fr_alps", name:"알프스오토메 미니사과", alias:["알프스오토메", "미니사과", "Alps Otome"], sci:"Malus 'Alps Otome'", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-15, pet:false, care:"탁구공만 한 작은 사과가 많이 달려 화분용으로 인기예요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"원예 품종 · 일본", size:"m" },
  { id:"fr_pear", name:"배나무", alias:["배", "신고배", "Pear"], sci:"Pyrus pyrifolia", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-15, pet:false, care:"다른 품종을 함께 키워야 열매가 잘 달려요. 봄에 흰 꽃이 예뻐요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"한국·중국·일본" },
  { id:"fr_peach", name:"복숭아나무", alias:["복숭아", "Peach"], sci:"Prunus persica", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-15, pet:false, care:"봄에 분홍 꽃이 피고 혼자서도 열매가 달려요. 병충해 관리가 필요해요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"중국 북서부" },
  { id:"fr_plum", name:"자두나무", alias:["자두", "Plum"], sci:"Prunus salicina", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-15, pet:false, care:"봄에 흰 꽃이 피고 여름에 열매가 익어요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"중국" },
  { id:"fr_apricot", name:"살구나무", alias:["살구", "Apricot"], sci:"Prunus armeniaca", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-15, pet:false, care:"이른 봄에 연분홍 꽃이 피고 초여름에 열매가 익어요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"중앙아시아·중국" },
  { id:"fr_cherry", name:"체리나무", alias:["체리", "양벚나무", "Sweet Cherry"], sci:"Prunus avium", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-15, pet:false, care:"대부분 다른 품종 꽃가루가 필요해요. 크게 자라는 나무예요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"유럽·서아시아" },
  { id:"fr_grape", name:"포도나무", alias:["포도", "캠벨얼리", "샤인머스캣", "Grape"], sci:"Vitis vinifera", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-15, pet:false, care:"덩굴로 타고 올라가니 지지대나 시렁이 필요해요. 겨울엔 가지치기를 해 주세요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"서아시아 코카서스·지중해" },
  { id:"fr_kiwi", name:"키위나무", alias:["키위", "참다래", "Kiwi"], sci:"Actinidia deliciosa", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-10, pet:false, care:"암나무와 수나무를 함께 심어야 열매가 달려요. 튼튼한 지지대가 필요한 덩굴이에요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"중국 양쯔강 유역" },
  { id:"fr_loquat", name:"비파나무", alias:["비파", "Loquat"], sci:"Eriobotrya japonica", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-8, pet:false, care:"늦가을에 꽃이 피고 초여름에 노란 열매가 익는 상록수예요. 남부 지방은 바깥에서 자라요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"중국 남동부" },
  { id:"fr_feijoa", name:"페이조아", alias:["피조아", "파인애플구아바", "Feijoa"], sci:"Acca sellowiana", cat:"fruit", tree:true, light:3, amount:2, days:4, winter:14, temp:"15~28℃", min:-8, pet:false, care:"은빛 잎에 빨간 수술이 예쁜 꽃이 피는 상록 과실수예요. 햇빛을 많이 봐야 열매가 달려요. 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 물을 줄여 주세요. 겨울 추위를 겪어야 다음 해 꽃이 펴요.", habitat:"남아메리카 브라질 남부·우루과이" },
  { id:"fr_mango", name:"망고나무", alias:["망고", "Mango"], sci:"Mangifera indica", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"18~30℃", min:10, pet:false, care:"씨앗에서 키워 관엽식물처럼 즐길 수 있어요. 열매를 보려면 아주 따뜻하고 밝아야 해요. 따뜻하고 밝은 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 겨울엔 실내 밝은 창가에서 물을 줄여 주세요.", habitat:"인도·미얀마" },
  { id:"fr_guava", name:"구아바", alias:["구아바나무", "Guava"], sci:"Psidium guajava", cat:"fruit", tree:true, light:3, amount:2, days:5, winter:10, temp:"18~30℃", min:5, pet:false, care:"향긋한 열매가 열리는 열대 과실수로 화분에서도 열매를 볼 수 있어요. 따뜻하고 밝은 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 겨울엔 실내 밝은 창가에서 물을 줄여 주세요.", habitat:"중앙·남아메리카 열대", size:"m" },
  { id:"sh_ilex_crenata", name:"꽝꽝나무", alias:["꽝꽝나무", "Japanese Holly"], sci:"Ilex crenata", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:10, temp:"10~28℃", min:-10, pet:false, care:"작고 두꺼운 잎이 촘촘해 울타리나 토피어리로 다듬기 좋아요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나도 돼요.", habitat:"한국 남부·일본", size:"m" },
  { id:"sh_ilex_cornuta", name:"호랑가시나무", alias:["호랑가시", "Chinese Holly"], sci:"Ilex cornuta", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:10, temp:"10~28℃", min:-10, pet:false, care:"가시 돋은 잎과 겨울의 빨간 열매로 크리스마스 장식에 써요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나도 돼요.", habitat:"한국 남서부 해안·중국", size:"m" },
  { id:"sh_ligustrum", name:"쥐똥나무", alias:["쥐똥나무", "Privet"], sci:"Ligustrum obtusifolium", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:10, temp:"10~28℃", min:-20, pet:false, care:"울타리로 많이 심고 초여름 흰 꽃 향이 좋아요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나도 돼요.", habitat:"한국·일본", size:"m" },
  { id:"sh_pyracantha", name:"피라칸타", alias:["피라칸사스", "Pyracantha"], sci:"Pyracantha angustifolia", cat:"flower", tree:true, light:3, amount:2, days:4, winter:10, temp:"10~28℃", min:-10, pet:false, care:"가을·겨울에 주황·빨간 열매가 가득 달려요. 가지에 가시가 있어요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나도 돼요.", habitat:"중국 남서부", size:"m" },
  { id:"sh_eunmokseo", name:"은목서", alias:["은목서", "Silver Osmanthus"], sci:"Osmanthus fragrans var. latifolius", cat:"flower", tree:true, light:3, amount:2, days:4, winter:10, temp:"10~28℃", min:-8, pet:false, care:"가을에 흰 꽃이 피고 향이 진해요. 금목서보다 추위에 조금 강해요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나도 돼요.", habitat:"중국 남부" },
  // ── 고무나무 품종 ──
  { id:"rb_decora", name:"데코라 고무나무", alias:["데코라", "Decora", "고무나무"], sci:"Ficus elastica 'Decora'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"새잎을 감싼 붉은 덮개가 예쁘고 잎이 넓고 두꺼운 기본 품종이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아 주고, 자리를 자주 옮기면 잎을 떨궈요.", habitat:"인도 북동부·말레이시아의 열대우림 (원종 기준)" },
  { id:"rb_abidjan", name:"아비장 고무나무", alias:["아비장", "Abidjan", "고무나무"], sci:"Ficus elastica 'Abidjan'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"짙은 버건디 잎에 붉은 잎맥이 도드라지는 품종이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아 주고, 자리를 자주 옮기면 잎을 떨궈요.", habitat:"인도 북동부·말레이시아의 열대우림 (원종 기준)" },
  { id:"rb_blackprince", name:"블랙프린스 고무나무", alias:["블랙프린스", "Black Prince", "고무나무"], sci:"Ficus elastica 'Black Prince'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"검붉은 잎이 광택이 나고 버건디보다 잎이 둥글어요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아 주고, 자리를 자주 옮기면 잎을 떨궈요.", habitat:"인도 북동부·말레이시아의 열대우림 (원종 기준)" },
  { id:"rb_melany", name:"멜라니 고무나무", alias:["멜라니", "Melany", "고무나무"], sci:"Ficus elastica 'Melany'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"짙은 잎이 촘촘하게 붙어 작고 단단하게 자라는 품종이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아 주고, 자리를 자주 옮기면 잎을 떨궈요.", habitat:"인도 북동부·말레이시아의 열대우림 (원종 기준)", size:"m" },
  { id:"rb_tricolor", name:"트리컬러 고무나무", alias:["트리컬러 고무", "Tricolor", "고무나무"], sci:"Ficus elastica 'Tricolor'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"초록·크림·분홍 세 가지 색 무늬가 들어가요. 밝은 곳에 둬야 색이 살아요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아 주고, 자리를 자주 옮기면 잎을 떨궈요.", habitat:"인도 북동부·말레이시아의 열대우림 (원종 기준)" },
  { id:"rb_variegata", name:"바리에가타 고무나무", alias:["바리에가타", "무늬고무나무", "Variegata", "고무나무"], sci:"Ficus elastica 'Variegata'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"잎 가장자리에 노란빛 크림 무늬가 들어가는 오래된 무늬 품종이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아 주고, 자리를 자주 옮기면 잎을 떨궈요.", habitat:"인도 북동부·말레이시아의 열대우림 (원종 기준)" },
  { id:"rb_doescheri", name:"도셰리 고무나무", alias:["도셰리", "Doescheri", "고무나무"], sci:"Ficus elastica 'Doescheri'", cat:"foliage", tree:true, light:2, amount:2, days:10, winter:14, temp:"16~28℃", min:5, pet:true, care:"회녹색·크림 무늬에 잎자루와 잎맥이 분홍빛이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 잎 먼지를 가끔 닦아 주고, 자리를 자주 옮기면 잎을 떨궈요.", habitat:"인도 북동부·말레이시아의 열대우림 (원종 기준)" },
  { id:"rb_yellowgem", name:"옐로우젬 알테시마", alias:["옐로우젬", "Yellow Gem", "무늬알테시마", "고무나무"], sci:"Ficus altissima 'Yellow Gem'", cat:"foliage", tree:true, light:3, amount:2, days:7, winter:12, temp:"16~30℃", min:7, pet:true, care:"넓은 잎 가장자리에 연노랑 무늬가 들어간 알테시마예요. 밝은 곳을 좋아해요. 겉흙이 2~3cm 마르면 흠뻑 주고, 겨울엔 물을 줄여 주세요.", habitat:"동남아시아·인도 (원종 기준)" },

  { id:"ficus_retusa", name:"레투사 고무나무", alias:["레투사", "Retusa", "분재 고무나무", "고무나무"], sci:"Ficus retusa", cat:"foliage", tree:true, light:3, amount:2, days:6, winter:10, temp:"16~28℃", min:7, pet:true, care:"작은 잎과 굵은 줄기로 분재에 가장 많이 쓰는 고무나무 중 하나예요. 겉흙이 마르면 흠뻑 주세요. 밝은 곳에서 잎이 촘촘해지고, 가지치기로 모양을 잡기 쉬워요.", habitat:"동남아시아·중국 남부", size:"m" },

  { id:"an_polyschistum", name:"폴리스키스툼", alias:["폴리스키스툼", "Polyschistum", "안스리움", "안슈리움"], sci:"Anthurium polyschistum", cat:"foliage", light:2, amount:2, days:5, winter:8, temp:"20~28℃", min:15, pet:true, care:"작은 잎이 손가락처럼 여러 갈래로 갈라진 덩굴성 안스리움이에요. 잎을 보는 수집용 안스리움이에요. 바크·펄라이트를 섞은 굵은 흙에 심고 겉흙이 마르면 주세요. 습도 70% 이상을 좋아해서 가습기나 온실장이 있으면 잎이 크게 나와요. 직사광선은 잎을 태워요.", habitat:"에콰도르·콜롬비아·페루", size:"s" },
  { id:"an_faustomirandae", name:"파우스토미란다에", alias:["파우스토미란다에", "Faustomirandae", "안스리움", "안슈리움"], sci:"Anthurium faustomirandae", cat:"foliage", light:2, amount:2, days:5, winter:8, temp:"20~28℃", min:15, pet:true, care:"가죽처럼 아주 두꺼운 하트 잎이 크게 자라요. 잎을 보는 수집용 안스리움이에요. 바크·펄라이트를 섞은 굵은 흙에 심고 겉흙이 마르면 주세요. 습도 70% 이상을 좋아해서 가습기나 온실장이 있으면 잎이 크게 나와요. 직사광선은 잎을 태워요.", habitat:"멕시코 치아파스", size:"l" },
  { id:"an_aceofspades", name:"에이스 오브 스페이드", alias:["에이스오브스페이드", "Ace of Spades", "안스리움", "안슈리움"], sci:"Anthurium 'Ace of Spades'", cat:"foliage", light:2, amount:2, days:5, winter:8, temp:"20~28℃", min:15, pet:true, care:"짙은 벨벳 잎이 스페이드 모양으로 길쭉한 교배종이에요. 잎을 보는 수집용 안스리움이에요. 바크·펄라이트를 섞은 굵은 흙에 심고 겉흙이 마르면 주세요. 습도 70% 이상을 좋아해서 가습기나 온실장이 있으면 잎이 크게 나와요. 직사광선은 잎을 태워요.", habitat:"원예 교배종 (원종은 중남미 열대우림)", size:"m" },
  { id:"an_silverblush", name:"실버블러시", alias:["실버블러시", "Silver Blush", "안스리움", "안슈리움"], sci:"Anthurium 'Silver Blush'", cat:"foliage", light:2, amount:2, days:5, winter:8, temp:"20~28℃", min:15, pet:true, care:"크리스탈리눔 교배종으로 잎맥 주변이 은빛으로 넓게 번져요. 잎을 보는 수집용 안스리움이에요. 바크·펄라이트를 섞은 굵은 흙에 심고 겉흙이 마르면 주세요. 습도 70% 이상을 좋아해서 가습기나 온실장이 있으면 잎이 크게 나와요. 직사광선은 잎을 태워요.", habitat:"원예 교배종 (원종은 중남미 열대우림)", size:"m" },
  { id:"an_dorayaki", name:"도라야키", alias:["도라야키", "Dorayaki", "안스리움", "안슈리움"], sci:"Anthurium 'Dorayaki'", cat:"foliage", light:2, amount:2, days:5, winter:8, temp:"20~28℃", min:15, pet:true, care:"둥근 은빛 벨벳 잎이 도라야키처럼 동그란 교배종이에요. 잎을 보는 수집용 안스리움이에요. 바크·펄라이트를 섞은 굵은 흙에 심고 겉흙이 마르면 주세요. 습도 70% 이상을 좋아해서 가습기나 온실장이 있으면 잎이 크게 나와요. 직사광선은 잎을 태워요.", habitat:"원예 교배종 (원종은 중남미 열대우림)", size:"s" },
  // ── 관엽식물 품종 ──
  { id:"sy_whitebutterfly", name:"화이트버터플라이 싱고니움", alias:["화이트버터플라이", "White Butterfly"], sci:"Syngonium podophyllum 'White Butterfly'", cat:"foliage", light:2, amount:2, days:6, winter:10, temp:"18~28℃", min:10, pet:true, care:"연두·크림색이 넓게 퍼진 화살촉 잎이 특징인 가장 흔한 품종이에요. 겉흙이 마르면 흠뻑 주세요. 직사광선은 피하고 밝은 간접광에서 무늬가 선명해요. 자라면 덩굴처럼 늘어지니 지지대를 세우거나 순을 잘라 풍성하게 만들어요." },

  { id:"sy_albo", name:"알보 싱고니움", alias:["알보", "알보 바리에가툼", "Albo Variegatum"], sci:"Syngonium podophyllum 'Albo Variegatum'", cat:"foliage", light:2, amount:2, days:6, winter:10, temp:"18~28℃", min:10, pet:true, care:"초록 잎에 흰 무늬가 반반 또는 조각처럼 들어가는 수집용 무늬종이에요. 흰 부분이 타기 쉬워 직사광선을 피해요. 겉흙이 마르면 흠뻑 주세요. 직사광선은 피하고 밝은 간접광에서 무늬가 선명해요. 자라면 덩굴처럼 늘어지니 지지대를 세우거나 순을 잘라 풍성하게 만들어요." },

  { id:"sy_panda", name:"판다 싱고니움", alias:["판다", "Panda"], sci:"Syngonium podophyllum 'Panda'", cat:"foliage", light:2, amount:2, days:6, winter:10, temp:"18~28℃", min:10, pet:true, care:"초록 잎에 노란 무늬가 크게 들어가요. 겉흙이 마르면 흠뻑 주세요. 직사광선은 피하고 밝은 간접광에서 무늬가 선명해요. 자라면 덩굴처럼 늘어지니 지지대를 세우거나 순을 잘라 풍성하게 만들어요." },
  { id:"sy_aurea", name:"아우레아 싱고니움", alias:["아우레아", "옐로우 싱고니움", "Aurea"], sci:"Syngonium podophyllum 'Aurea'", cat:"foliage", light:2, amount:2, days:6, winter:10, temp:"18~28℃", min:10, pet:true, care:"초록 잎에 노란 무늬가 반반 들어가는 무늬종이에요. 겉흙이 마르면 흠뻑 주세요. 직사광선은 피하고 밝은 간접광에서 무늬가 선명해요. 자라면 덩굴처럼 늘어지니 지지대를 세우거나 순을 잘라 풍성하게 만들어요." },
  { id:"sy_erythro", name:"에리트로필룸 싱고니움", alias:["에리트로필룸", "Llano-Carti Road", "블랙 싱고니움"], sci:"Syngonium erythrophyllum", cat:"foliage", light:2, amount:2, days:6, winter:10, temp:"18~28℃", min:10, pet:true, care:"잎이 거의 검은빛이고 뒷면이 붉은 원종이에요. 작은 잎으로 기어올라요. 겉흙이 마르면 흠뻑 주세요. 직사광선은 피하고 밝은 간접광에서 무늬가 선명해요. 자라면 덩굴처럼 늘어지니 지지대를 세우거나 순을 잘라 풍성하게 만들어요.", size:"s" },
  { id:"sy_wendlandii", name:"웬들란디 싱고니움", alias:["웬들란디", "Wendlandii", "벨벳 싱고니움"], sci:"Syngonium wendlandii", cat:"foliage", light:2, amount:2, days:6, winter:10, temp:"18~28℃", min:10, pet:true, care:"짙은 벨벳 잎에 흰 잎맥이 들어가는 원종이에요. 겉흙이 마르면 흠뻑 주세요. 직사광선은 피하고 밝은 간접광에서 무늬가 선명해요. 자라면 덩굴처럼 늘어지니 지지대를 세우거나 순을 잘라 풍성하게 만들어요." },
  { id:"sy_macro", name:"마크로필룸 싱고니움", alias:["마크로필룸", "Macrophyllum", "프로스티"], sci:"Syngonium macrophyllum", cat:"foliage", light:2, amount:2, days:6, winter:10, temp:"18~28℃", min:10, pet:true, care:"갈라지지 않는 큰 하트 잎이 특징이에요. 겉흙이 마르면 흠뻑 주세요. 직사광선은 피하고 밝은 간접광에서 무늬가 선명해요. 자라면 덩굴처럼 늘어지니 지지대를 세우거나 순을 잘라 풍성하게 만들어요." },
  { id:"mo_thai", name:"타이컨스텔레이션 몬스테라", alias:["타이컨스텔레이션", "Thai Constellation", "무늬몬스테라"], sci:"Monstera deliciosa 'Thai Constellation'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"잎 전체에 크림색 점무늬가 별자리처럼 흩어진 무늬종이에요. 일반 몬스테라보다 천천히 자라요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"l" },
  { id:"mo_albo", name:"알보 몬스테라", alias:["알보몬스테라", "Albo", "보르시기아나 알보"], sci:"Monstera deliciosa 'Albo Variegata'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"잎에 흰 무늬가 조각처럼 들어가는 희귀 무늬종이에요. 흰 잎은 잘 타니 강한 빛은 피하세요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"l" },
  { id:"mo_aurea", name:"아우레아 몬스테라", alias:["옐로우몬스테라", "Aurea"], sci:"Monstera deliciosa 'Aurea'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"노란 무늬가 들어간 희귀 무늬종이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"l" },
  { id:"mo_borsig", name:"보르시기아나 몬스테라", alias:["보르시기아나", "Borsigiana"], sci:"Monstera deliciosa 'Borsigiana'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"일반 몬스테라보다 마디가 길고 잎이 조금 작게 자라요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"l" },
  { id:"mo_mint", name:"민트 몬스테라", alias:["민트몬스테라", "Mint"], sci:"Monstera deliciosa 'Mint'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"연한 민트색 무늬가 넓게 들어가는 희귀종이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"l" },
  { id:"mo_peru", name:"몬스테라 페루", alias:["페루", "카르스테니아눔", "Peru"], sci:"Monstera karstenianum", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"울퉁불퉁하고 두꺼운 작은 잎이 특징이에요. 구멍이 생기지 않아요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"mo_siltepecana", name:"실테페카나 몬스테라", alias:["실테페카나", "Siltepecana"], sci:"Monstera siltepecana", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"어린 잎은 은빛 잎맥이 들어가고 크면 구멍이 생겨요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"mo_standleyana", name:"스탠들리아나 몬스테라", alias:["스탠들리아나", "Standleyana", "무늬 스탠들리아나"], sci:"Monstera standleyana", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"길쭉한 잎에 흰 점이나 줄무늬가 들어가는 덩굴 몬스테라예요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"mo_dubia", name:"두비아 몬스테라", alias:["두비아", "Dubia"], sci:"Monstera dubia", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"어린 잎이 은빛 하트 모양으로 판에 딱 붙어 기어올라요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"mo_obliqua", name:"오블리쿠아 몬스테라", alias:["오블리쿠아", "Obliqua"], sci:"Monstera obliqua", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"잎 면적보다 구멍이 더 넓을 만큼 얇고 구멍이 많은 희귀종이에요. 습도가 아주 높아야 해요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"s" },
  { id:"mo_adansonii_var", name:"무늬 히메몬스테라", alias:["무늬 아단소니", "아단소니 바리에가타"], sci:"Monstera adansonii 'Variegata'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"구멍 난 잎에 흰·노란 무늬가 들어간 히메몬스테라예요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"rhaph_tetra", name:"라피도포라 테트라스페르마", alias:["미니몬스테라", "테트라스페르마", "Mini Monstera"], sci:"Rhaphidophora tetrasperma", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"작은 몬스테라처럼 갈라진 잎이 빨리 자라 위로 타고 올라가요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"rhaph_decursiva", name:"라피도포라 데쿠르시바", alias:["데쿠르시바", "Decursiva", "드래곤테일"], sci:"Rhaphidophora decursiva", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"크게 자라면 잎이 깃털처럼 깊게 갈라져요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"l" },
  { id:"ph_birkin", name:"필로덴드론 버킨", alias:["버킨", "Birkin"], sci:"Philodendron 'Birkin'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"짙은 초록 잎에 흰 줄무늬가 가늘게 들어가요. 곧게 서서 자라요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ph_pinkprincess", name:"핑크프린세스 필로덴드론", alias:["핑크프린세스", "Pink Princess"], sci:"Philodendron erubescens 'Pink Princess'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"짙은 자주 잎에 분홍 무늬가 들어가는 인기 무늬종이에요. 밝은 곳에서 분홍이 유지돼요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ph_brasil", name:"필로덴드론 브라질", alias:["브라질", "Brasil"], sci:"Philodendron hederaceum 'Brasil'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"하트 잎 가운데 연두·노란 줄무늬가 들어가는 덩굴이에요. 키우기 아주 쉬워요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ph_heartleaf", name:"하트잎 필로덴드론", alias:["하트잎", "헤데라케움", "옥시카르디움", "Heartleaf"], sci:"Philodendron hederaceum", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"초록 하트 잎이 길게 늘어지는 기본 덩굴 필로덴드론이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ph_micans", name:"미칸스 필로덴드론", alias:["미칸스", "Micans", "벨벳 필로"], sci:"Philodendron hederaceum var. hederaceum 'Micans'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"벨벳 같은 자줏빛 하트 잎이 늘어지는 덩굴이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ph_lemonlime", name:"레몬라임 필로덴드론", alias:["레몬라임 필로", "Lemon Lime"], sci:"Philodendron hederaceum 'Lemon Lime'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"밝은 연두색 하트 잎이 늘어져요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ph_princeorange", name:"프린스오브오렌지 필로덴드론", alias:["프린스오브오렌지", "Prince of Orange"], sci:"Philodendron 'Prince of Orange'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"새잎이 주황색으로 나와 점점 초록으로 변해요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ph_congorojo", name:"콩고로조 필로덴드론", alias:["콩고로조", "Congo Rojo", "레드콩고"], sci:"Philodendron 'Congo Rojo'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"크고 넓은 잎이 적갈색으로 나와 짙은 녹색이 돼요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"l" },
  { id:"ph_imperialgreen", name:"임페리얼그린 필로덴드론", alias:["임페리얼그린", "Imperial Green"], sci:"Philodendron 'Imperial Green'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"광택 나는 넓은 초록 잎이 둥글게 퍼져요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"l" },
  { id:"ph_xanadu", name:"제나두 필로덴드론", alias:["제나두", "재너두", "Xanadu"], sci:"Thaumatophyllum xanadu", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"깊게 갈라진 잎이 둥글게 퍼지는 셀렘의 작은 친척이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ph_gloriosum", name:"글로리오섬 필로덴드론", alias:["글로리오섬", "Gloriosum"], sci:"Philodendron gloriosum", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"큰 벨벳 하트 잎에 흰 잎맥이 들어가요. 땅을 기며 자라니 넓고 얕은 화분이 좋아요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ph_melano", name:"멜라노크리섬 필로덴드론", alias:["멜라노크리섬", "Melanochrysum", "블랙골드"], sci:"Philodendron melanochrysum", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"길쭉한 검은빛 벨벳 잎에 금빛 반짝임이 있는 희귀종이에요. 습도를 높게 해 주세요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"l" },
  { id:"ph_verrucosum", name:"베루코섬 필로덴드론", alias:["베루코섬", "Verrucosum"], sci:"Philodendron verrucosum", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"벨벳 잎에 연두 잎맥, 털이 난 붉은 잎자루가 특징이에요. 습도에 민감해요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ph_floridaghost", name:"플로리다고스트 필로덴드론", alias:["플로리다고스트", "Florida Ghost"], sci:"Philodendron 'Florida Ghost'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"새잎이 하얗게 나와 점점 초록이 되는 갈라진 잎 필로예요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ph_paraiso", name:"파라이소베르데 필로덴드론", alias:["파라이소베르데", "Paraiso Verde"], sci:"Philodendron 'Paraiso Verde'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"연두·초록이 얼룩덜룩 섞인 길쭉한 잎이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ph_ringoffire", name:"링오브파이어 필로덴드론", alias:["링오브파이어", "Ring of Fire"], sci:"Philodendron 'Ring of Fire'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"톱니처럼 갈라진 잎에 주황·크림 무늬가 섞여요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"l" },
  { id:"ph_whiteprincess", name:"화이트프린세스 필로덴드론", alias:["화이트프린세스", "White Princess"], sci:"Philodendron erubescens 'White Princess'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"짙은 녹색 잎에 흰 무늬가 들어가는 무늬종이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ph_squamiferum", name:"스쿠아미페룸 필로덴드론", alias:["스쿠아미페룸", "Squamiferum"], sci:"Philodendron squamiferum", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"잎자루에 붉은 털이 나 있고 잎이 다섯 갈래로 갈라져요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"l" },
  { id:"ph_pedatum", name:"페다툼 필로덴드론", alias:["페다툼", "Pedatum"], sci:"Philodendron pedatum", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"깊게 갈라진 참나무 잎 모양 잎이 특징이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"l" },
  { id:"ph_silversword", name:"실버소드 필로덴드론", alias:["실버소드", "하스타툼", "Silver Sword"], sci:"Philodendron hastatum", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"은빛 광택이 도는 칼 모양 잎이 특징이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"l" },
  { id:"ph_burlemarx", name:"벌레막스 필로덴드론", alias:["벌레막스", "Burle Marx"], sci:"Philodendron 'Burle Marx'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"길쭉한 하트 잎이 촘촘히 나는 튼튼한 품종이에요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ph_mamei", name:"마메이 필로덴드론", alias:["마메이", "Mamei"], sci:"Philodendron mamei", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"큰 하트 잎에 은빛 얼룩이 퍼지는 기는형 필로예요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ph_atabapoense", name:"아타바포엔세 필로덴드론", alias:["아타바포엔세", "Atabapoense"], sci:"Philodendron atabapoense", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"길쭉한 잎 뒷면이 짙은 자주색이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"l" },
  { id:"ep_marble", name:"마블퀸 스킨답서스", alias:["마블퀸", "Marble Queen"], sci:"Epipremnum aureum 'Marble Queen'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"초록 잎에 흰 무늬가 대리석처럼 섞여요. 무늬가 많아 일반 스킨보다 천천히 자라요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ep_neon", name:"네온 스킨답서스", alias:["네온포토스", "Neon"], sci:"Epipremnum aureum 'Neon'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"잎 전체가 형광 연두색이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ep_njoy", name:"엔조이 스킨답서스", alias:["엔조이", "N'Joy"], sci:"Epipremnum aureum 'N'Joy'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"작은 잎에 흰 무늬가 또렷하게 나뉘어 들어가요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ep_pearls", name:"펄앤제이드 스킨답서스", alias:["펄앤제이드", "Pearls and Jade"], sci:"Epipremnum aureum 'Pearls and Jade'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"잎 가장자리에 흰 무늬와 초록 점이 섞여요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ep_manjula", name:"만줄라 스킨답서스", alias:["만줄라", "Manjula"], sci:"Epipremnum aureum 'Manjula'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"넓고 물결치는 잎에 흰·연두 무늬가 크게 들어가요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ep_global", name:"글로벌그린 스킨답서스", alias:["글로벌그린", "Global Green"], sci:"Epipremnum aureum 'Global Green'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"짙은 초록 테두리 안에 연두 무늬가 들어가요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"ep_cebu", name:"세부블루 스킨답서스", alias:["세부블루", "Cebu Blue", "피나툼"], sci:"Epipremnum pinnatum 'Cebu Blue'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"은청색 광택이 도는 길쭉한 잎이에요. 크게 자라면 잎이 갈라져요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"sc_exotica", name:"스칸답서스 엑소티카", alias:["엑소티카", "Exotica", "실버스킨"], sci:"Scindapsus pictus 'Exotica'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"짙은 초록 잎에 은빛 얼룩이 크게 들어가요. 잎이 말리면 물 줄 때예요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"sc_argyraeus", name:"스칸답서스 아기래우스", alias:["아기래우스", "Argyraeus", "실버새틴"], sci:"Scindapsus pictus 'Argyraeus'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"작은 하트 잎에 은빛 점이 흩뿌려진 기본 품종이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"sc_silveryann", name:"실버리앤 스칸답서스", alias:["실버리앤", "Silvery Ann"], sci:"Scindapsus pictus 'Silvery Ann'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"잎 대부분이 은빛으로 덮여 있어요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"sc_moonlight", name:"트레우비 문라이트", alias:["문라이트", "트레우비", "Moonlight"], sci:"Scindapsus treubii 'Moonlight'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"두꺼운 잎 전체가 은은한 은빛이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"sc_jade", name:"제이드새틴 스칸답서스", alias:["제이드새틴", "Jade Satin"], sci:"Scindapsus pictus 'Jade Satin'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:10, pet:true, care:"무늬 없는 짙은 초록 벨벳 잎이에요. 겉흙이 마르면 흠뻑 주세요. 늘어뜨리거나 지지대를 타게 키울 수 있고, 무늬종은 밝은 곳에 둬야 무늬가 유지돼요.", size:"m" },
  { id:"al_polly", name:"알로카시아 폴리", alias:["폴리", "아마조니카", "Polly", "Amazonica"], sci:"Alocasia × amazonica 'Polly'", cat:"foliage", light:2, amount:2, days:6, winter:12, temp:"20~28℃", min:15, pet:true, care:"화살 모양 짙은 잎에 흰 잎맥이 선명한 가장 흔한 알로카시아예요. 물 빠짐 좋은 흙에서 겉흙이 마르면 주세요. 추워지면 잎을 다 떨구고 알뿌리로 쉬기도 하니, 그때는 물을 거의 끊고 따뜻하게 두면 봄에 다시 나와요. 응애가 잘 생기니 잎 뒷면을 자주 살펴요.", size:"m" },
  { id:"al_frydek", name:"알로카시아 프라이덱", alias:["프라이덱", "Frydek", "그린벨벳"], sci:"Alocasia micholitziana 'Frydek'", cat:"foliage", light:2, amount:2, days:6, winter:12, temp:"20~28℃", min:15, pet:true, care:"벨벳 같은 짙은 초록 화살 잎에 흰 잎맥이 들어가요. 물 빠짐 좋은 흙에서 겉흙이 마르면 주세요. 추워지면 잎을 다 떨구고 알뿌리로 쉬기도 하니, 그때는 물을 거의 끊고 따뜻하게 두면 봄에 다시 나와요. 응애가 잘 생기니 잎 뒷면을 자주 살펴요.", size:"m" },
  { id:"al_zebrina", name:"알로카시아 제브리나", alias:["제브리나", "Zebrina"], sci:"Alocasia zebrina", cat:"foliage", light:2, amount:2, days:6, winter:12, temp:"20~28℃", min:15, pet:true, care:"잎자루에 얼룩말 무늬가 있어요. 물 빠짐 좋은 흙에서 겉흙이 마르면 주세요. 추워지면 잎을 다 떨구고 알뿌리로 쉬기도 하니, 그때는 물을 거의 끊고 따뜻하게 두면 봄에 다시 나와요. 응애가 잘 생기니 잎 뒷면을 자주 살펴요.", size:"l" },
  { id:"al_blackvelvet", name:"블랙벨벳 알로카시아", alias:["블랙벨벳", "Black Velvet", "레긴눌라"], sci:"Alocasia reginula 'Black Velvet'", cat:"foliage", light:2, amount:2, days:6, winter:12, temp:"20~28℃", min:15, pet:true, care:"거의 검은 벨벳 하트 잎이 작게 자라요. 물 빠짐 좋은 흙에서 겉흙이 마르면 주세요. 추워지면 잎을 다 떨구고 알뿌리로 쉬기도 하니, 그때는 물을 거의 끊고 따뜻하게 두면 봄에 다시 나와요. 응애가 잘 생기니 잎 뒷면을 자주 살펴요.", size:"s" },

  { id:"xanthosoma", name:"잔토소마 라임징거", alias:["라임징거", "Lime Zinger", "잔토소마"], sci:"Xanthosoma 'Lime Zinger'", cat:"foliage", light:2, amount:2, days:6, winter:12, temp:"20~28℃", min:15, pet:true, care:"형광 연두색 큰 하트 잎이에요. 물 빠짐 좋은 흙에서 겉흙이 마르면 주세요. 추워지면 잎을 다 떨구고 알뿌리로 쉬기도 하니, 그때는 물을 거의 끊고 따뜻하게 두면 봄에 다시 나와요. 응애가 잘 생기니 잎 뒷면을 자주 살펴요.", size:"l" },
  { id:"homalomena", name:"호말로메나 셀비", alias:["셀비", "Selby", "호말로메나"], sci:"Homalomena rubescens 'Selby'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:12, pet:true, care:"하트 잎에 연두 얼룩이 퍼지는 튼튼한 품종이에요. 그늘에 강해요. 겉흙이 2~3cm 마르면 흠뻑 주세요. 밝은 간접광이 좋고, 지지대(수태봉)를 세워 주면 잎이 커져요.", size:"m" },
  { id:"ca_orbifolia", name:"칼라데아 오르비폴리아", alias:["오르비폴리아", "Orbifolia"], sci:"Calathea orbifolia", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"둥글고 큰 잎에 은빛 줄무늬가 들어가요. 습도에 아주 민감해요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"m" },

  { id:"ca_freddie", name:"칼라데아 프레디", alias:["프레디", "Freddie"], sci:"Calathea concinna 'Freddie'", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"연두 잎에 짙은 깃털 무늬가 들어가요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"m" },
  { id:"ca_beauty", name:"칼라데아 뷰티스타", alias:["뷰티스타", "Beauty Star"], sci:"Calathea ornata 'Beauty Star'", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"길쭉한 잎에 은빛·분홍 줄이 여러 줄 들어가요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"m" },
  { id:"ca_dottie", name:"칼라데아 도티", alias:["도티", "Dottie"], sci:"Calathea roseopicta 'Dottie'", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"거의 검은 잎에 분홍 테두리 무늬가 들어가요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"m" },
  { id:"stromanthe", name:"스트로만테 트리오스타", alias:["트리오스타", "Triostar", "스트로만테"], sci:"Stromanthe sanguinea 'Triostar'", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"초록·크림·분홍 무늬에 뒷면은 진분홍이에요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"m" },
  { id:"ctenanthe_bm", name:"크테난테 벌레막시", alias:["크테난테", "벌레막시", "Fishbone Prayer Plant"], sci:"Ctenanthe burle-marxii", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"물고기 뼈 같은 무늬가 들어간 작은 잎이에요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"s" },
  { id:"ctenanthe_setosa", name:"크테난테 그레이스타", alias:["그레이스타", "세토사", "Grey Star"], sci:"Ctenanthe setosa 'Grey Star'", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"은회색 잎이 위로 길게 서요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"m" },
  { id:"ma_lemonlime", name:"마란타 레몬라임", alias:["레몬라임 마란타", "Lemon Lime"], sci:"Maranta leuconeura 'Lemon Lime'", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"연두 잎맥이 깃털처럼 선명해요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"s" },
  { id:"ma_red", name:"마란타 레드 (붉은잎맥)", alias:["붉은잎맥 마란타", "에리트로네우라", "Red Prayer Plant"], sci:"Maranta leuconeura var. erythroneura", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"빨간 잎맥이 물고기 뼈처럼 들어가요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"s" },
  { id:"ma_kerch", name:"마란타 케르초베아나", alias:["케르초베아나", "토끼발자국 마란타", "Rabbit's Foot"], sci:"Maranta leuconeura var. kerchoveana", cat:"foliage", light:1, amount:2, days:5, winter:8, temp:"18~27℃", min:15, pet:false, care:"연두 잎에 짙은 반점이 토끼 발자국처럼 찍혀 있어요. 흙이 늘 촉촉하게 유지되도록 주고, 수돗물은 하루 받아 두었다 주세요. 건조하면 잎끝이 타고 말리니 습도를 높여 주세요. 밤에 잎을 세우는 기도하는 식물이에요.", size:"s" },
  { id:"ag_siam", name:"시암오로라 아글라오네마", alias:["시암오로라", "레드아글라오네마", "Siam Aurora"], sci:"Aglaonema 'Siam Aurora'", cat:"foliage", light:1, amount:2, days:8, winter:14, temp:"18~28℃", min:13, pet:true, care:"초록 잎 가운데가 분홍·빨강으로 물든 품종이에요. 겉흙이 2~3cm 마르면 주세요. 그늘에도 강하지만 붉은 품종은 밝아야 색이 진해요. 찬바람에 약해요.", size:"m" },
  { id:"ag_silverbay", name:"실버베이 아글라오네마", alias:["실버베이", "Silver Bay"], sci:"Aglaonema 'Silver Bay'", cat:"foliage", light:1, amount:2, days:8, winter:14, temp:"18~28℃", min:13, pet:true, care:"은빛 잎 가운데에 초록 테두리가 들어가는 튼튼한 품종이에요. 겉흙이 2~3cm 마르면 주세요. 그늘에도 강하지만 붉은 품종은 밝아야 색이 진해요. 찬바람에 약해요.", size:"m" },
  { id:"ag_maria", name:"마리아 아글라오네마", alias:["마리아", "Maria"], sci:"Aglaonema commutatum 'Maria'", cat:"foliage", light:1, amount:2, days:8, winter:14, temp:"18~28℃", min:13, pet:true, care:"짙은 초록에 은회색 무늬가 들어가요. 그늘에 아주 강해요. 겉흙이 2~3cm 마르면 주세요. 그늘에도 강하지만 붉은 품종은 밝아야 색이 진해요. 찬바람에 약해요.", size:"m" },
  { id:"ag_valentine", name:"레이디발렌타인 아글라오네마", alias:["레이디발렌타인", "Lady Valentine", "핑크아글라오네마"], sci:"Aglaonema 'Lady Valentine'", cat:"foliage", light:1, amount:2, days:8, winter:14, temp:"18~28℃", min:13, pet:true, care:"잎 대부분이 분홍색이에요. 겉흙이 2~3cm 마르면 주세요. 그늘에도 강하지만 붉은 품종은 밝아야 색이 진해요. 찬바람에 약해요.", size:"m" },
  { id:"ag_pictum", name:"픽텀트리컬러 아글라오네마", alias:["픽텀트리컬러", "카모플라주", "Pictum Tricolor"], sci:"Aglaonema pictum 'Tricolor'", cat:"foliage", light:1, amount:2, days:8, winter:14, temp:"18~28℃", min:13, pet:true, care:"군복 같은 세 가지 초록 얼룩 무늬가 들어간 희귀 원종이에요. 습도를 좋아해요. 겉흙이 2~3cm 마르면 주세요. 그늘에도 강하지만 붉은 품종은 밝아야 색이 진해요. 찬바람에 약해요.", size:"s" },
  { id:"ag_superwhite", name:"슈퍼화이트 아글라오네마", alias:["슈퍼화이트", "Super White", "스노우화이트"], sci:"Aglaonema 'Super White'", cat:"foliage", light:1, amount:2, days:8, winter:14, temp:"18~28℃", min:13, pet:true, care:"잎이 거의 흰색이에요. 너무 어두우면 초록이 늘어요. 겉흙이 2~3cm 마르면 주세요. 그늘에도 강하지만 붉은 품종은 밝아야 색이 진해요. 찬바람에 약해요.", size:"m" },
  { id:"df_camille", name:"카밀레 디펜바키아", alias:["카밀레", "Camille"], sci:"Dieffenbachia seguine 'Camille'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:13, pet:true, care:"잎 가운데가 크림색인 컴팩트 품종이에요. 겉흙이 마르면 흠뻑 주세요. 수액에 독성이 있어 자를 때 장갑을 끼고, 아이·반려동물 손이 닿지 않게 두세요.", size:"m" },
  { id:"df_tropicsnow", name:"트로픽스노우 디펜바키아", alias:["트로픽스노우", "Tropic Snow"], sci:"Dieffenbachia 'Tropic Snow'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:13, pet:true, care:"큰 잎에 흰 무늬가 붓터치처럼 들어가요. 겉흙이 마르면 흠뻑 주세요. 수액에 독성이 있어 자를 때 장갑을 끼고, 아이·반려동물 손이 닿지 않게 두세요.", size:"l" },
  { id:"df_reflector", name:"리플렉터 디펜바키아", alias:["리플렉터", "Reflector"], sci:"Dieffenbachia 'Reflector'", cat:"foliage", light:2, amount:2, days:7, winter:12, temp:"18~28℃", min:13, pet:true, care:"연두 잎에 크림 무늬, 흰 잎맥이 들어가요. 겉흙이 마르면 흠뻑 주세요. 수액에 독성이 있어 자를 때 장갑을 끼고, 아이·반려동물 손이 닿지 않게 두세요.", size:"m" },
  { id:"pp_watermelon", name:"수박페페", alias:["수박페페", "아르기레이아", "Watermelon Peperomia"], sci:"Peperomia argyreia", cat:"foliage", light:2, amount:1, days:10, winter:14, temp:"18~27℃", min:10, pet:false, care:"둥근 잎에 수박 껍질 같은 은빛 줄무늬가 있어요. 잎과 줄기에 물을 저장해서 흙이 거의 다 마르면 주세요. 과습하면 줄기가 물러요.", size:"s" },
  { id:"pp_caperata", name:"카페라타 페페로미아", alias:["카페라타", "주름페페", "Caperata"], sci:"Peperomia caperata", cat:"foliage", light:2, amount:1, days:10, winter:14, temp:"18~27℃", min:10, pet:false, care:"주름이 깊게 진 작은 하트 잎이에요. 초록·빨강·은빛 품종이 있어요. 잎과 줄기에 물을 저장해서 흙이 거의 다 마르면 주세요. 과습하면 줄기가 물러요.", size:"s" },

  { id:"pp_rotund", name:"로툰디폴리아 페페로미아", alias:["로툰디폴리아", "트레일링 제이드", "Trailing Jade"], sci:"Peperomia rotundifolia", cat:"foliage", light:2, amount:1, days:10, winter:14, temp:"18~27℃", min:10, pet:false, care:"동글동글 작은 잎이 늘어지는 걸이용이에요. 잎과 줄기에 물을 저장해서 흙이 거의 다 마르면 주세요. 과습하면 줄기가 물러요.", size:"s" },
