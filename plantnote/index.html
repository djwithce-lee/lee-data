  { id:"sl_martensii", name:"셀라기넬라 마르텐시", alias:["마르텐시", "셀라기넬라", "Spikemoss"], sci:"Selaginella martensii", cat:"foliage", light:1, amount:3, days:2, winter:4, temp:"18~25℃", min:10, pet:false, care:"이끼처럼 부드러운 잎이 가지를 쳐요. 테라리움에 잘 어울려요. 흙이 절대 마르지 않게 하고 습도가 아주 높아야 해요. 유리병(테라리움)에서 키우면 쉬워요.", size:"s" },
  { id:"sl_uncinata", name:"블루 셀라기넬라", alias:["운키나타", "피콕모스", "Peacock Spikemoss"], sci:"Selaginella uncinata", cat:"foliage", light:1, amount:3, days:2, winter:4, temp:"18~25℃", min:10, pet:false, care:"잎이 공작처럼 푸른 금속빛으로 반짝여요. 흙이 절대 마르지 않게 하고 습도가 아주 높아야 해요. 유리병(테라리움)에서 키우면 쉬워요.", size:"s" },
  { id:"sl_tamarisc", name:"부처손", alias:["부처손", "Resurrection Plant"], sci:"Selaginella tamariscina", cat:"foliage", light:1, amount:3, days:3, winter:7, temp:"5~25℃", min:-15, pet:false, care:"마르면 공처럼 말렸다가 물을 주면 다시 펴지는 우리 자생식물이에요. 바위틈 같은 건조에도 강해요. 반그늘에서 흙이 마르지 않게 주세요. 추위에 강해 바깥 그늘 화단에서 겨울을 나요.", size:"s" },
  { id:"pl_superbum", name:"박쥐란 수페르붐", alias:["수페르붐", "Superbum"], sci:"Platycerium superbum", cat:"foliage", light:2, amount:2, days:7, winter:10, temp:"16~28℃", min:10, pet:false, care:"거대한 방패 잎과 갈라진 잎이 늘어지는 대형 박쥐란이에요. 판이나 수태에 붙여 키우고, 수태가 마르면 물에 10~20분 담가 흠뻑 적셔 주세요. 밑동의 갈색 방패 잎은 떼지 마세요.", size:"l" },
  { id:"pl_grande", name:"박쥐란 그란데", alias:["그란데", "Grande"], sci:"Platycerium grande", cat:"foliage", light:2, amount:2, days:7, winter:10, temp:"16~28℃", min:10, pet:false, care:"수페르붐과 비슷한 대형종으로 필리핀 원산이에요. 판이나 수태에 붙여 키우고, 수태가 마르면 물에 10~20분 담가 흠뻑 적셔 주세요. 밑동의 갈색 방패 잎은 떼지 마세요.", size:"l" },
  { id:"pl_willinckii", name:"박쥐란 윌린키", alias:["윌린키", "Willinckii"], sci:"Platycerium willinckii", cat:"foliage", light:2, amount:2, days:7, winter:10, temp:"16~28℃", min:10, pet:false, care:"은빛 털에 덮인 가늘고 긴 잎이 길게 늘어져요. 판이나 수태에 붙여 키우고, 수태가 마르면 물에 10~20분 담가 흠뻑 적셔 주세요. 밑동의 갈색 방패 잎은 떼지 마세요.", size:"m" },
  { id:"pl_ridleyi", name:"박쥐란 리들레이", alias:["리들레이", "Ridleyi"], sci:"Platycerium ridleyi", cat:"foliage", light:2, amount:2, days:7, winter:10, temp:"16~28℃", min:10, pet:false, care:"방패 잎이 둥글게 감싸고 잎이 위로 서는 희귀종이에요. 습도가 높아야 해요. 판이나 수태에 붙여 키우고, 수태가 마르면 물에 10~20분 담가 흠뻑 적셔 주세요. 밑동의 갈색 방패 잎은 떼지 마세요.", size:"m" },
  { id:"pl_veitchii", name:"박쥐란 베이치", alias:["베이치 박쥐란", "Veitchii"], sci:"Platycerium veitchii", cat:"foliage", light:2, amount:2, days:7, winter:10, temp:"16~28℃", min:10, pet:false, care:"잎이 위로 곧게 서고 은빛 털이 많아 햇빛과 건조에 강해요. 판이나 수태에 붙여 키우고, 수태가 마르면 물에 10~20분 담가 흠뻑 적셔 주세요. 밑동의 갈색 방패 잎은 떼지 마세요.", size:"m" },
  { id:"pl_hillii", name:"박쥐란 힐리", alias:["힐리", "Hillii"], sci:"Platycerium hillii", cat:"foliage", light:2, amount:2, days:7, winter:10, temp:"16~28℃", min:10, pet:false, care:"짧고 넓은 잎이 위로 서는 초록 박쥐란이에요. 판이나 수태에 붙여 키우고, 수태가 마르면 물에 10~20분 담가 흠뻑 적셔 주세요. 밑동의 갈색 방패 잎은 떼지 마세요.", size:"m" },
  { id:"pl_alcicorne", name:"박쥐란 알시코르네", alias:["알시코르네", "Alcicorne"], sci:"Platycerium alcicorne", cat:"foliage", light:2, amount:2, days:7, winter:10, temp:"16~28℃", min:10, pet:false, care:"광택 있는 초록 잎이 위로 서는 아프리카 원산이에요. 판이나 수태에 붙여 키우고, 수태가 마르면 물에 10~20분 담가 흠뻑 적셔 주세요. 밑동의 갈색 방패 잎은 떼지 마세요.", size:"m" },
  // ── 아프리카 식물·괴근식물 ──
  { id:"pp_lamerei", name:"파키포디움 라메리", alias:["라메리", "마다가스카르야자", "Madagascar Palm", "괴근", "괴근식물"], sci:"Pachypodium lamerei", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"가시 돋은 굵은 줄기 위로 잎이 야자처럼 모여 나요. 파키포디움 중 가장 키우기 쉬워요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"마다가스카르 남부의 건조림", size:"l" },
  { id:"pp_geayi", name:"파키포디움 게아이", alias:["게아이", "Geayi", "괴근", "괴근식물"], sci:"Pachypodium geayi", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"라메리와 비슷하지만 잎이 가늘고 은빛 털이 있어요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"마다가스카르 남서부", size:"l" },
  { id:"pp_gracilius", name:"파키포디움 그락실리우스", alias:["그락실리우스", "로술라툼", "Gracilius", "코끼리발", "괴근", "괴근식물"], sci:"Pachypodium rosulatum var. gracilius", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"둥근 항아리 같은 괴근 위에 짧은 가지가 퍼지고 노란 꽃이 피는 인기 괴근식물이에요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"마다가스카르 중남부 고원 바위 지대", size:"s" },
  { id:"pp_densiflorum", name:"파키포디움 덴시플로룸", alias:["덴시플로룸", "Densiflorum", "괴근", "괴근식물"], sci:"Pachypodium densiflorum", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"납작하게 퍼진 괴근에 노란 꽃이 모여 피어요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"마다가스카르 중부 고원", size:"s" },
  { id:"pp_brevicaule", name:"파키포디움 브레비카울레 (에부르네움)", alias:["브레비카울레", "에부르네움", "Brevicaule", "Eburneum", "괴근", "괴근식물"], sci:"Pachypodium brevicaule", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"돌덩이처럼 납작한 괴근에 꽃이 피는 희귀종이에요. 과습에 아주 약해요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"마다가스카르 중부 고원 바위 지대", size:"s" },
  { id:"pp_saundersii", name:"파키포디움 사운데르시", alias:["사운데르시", "Saundersii", "화이트 코끼리발", "괴근", "괴근식물"], sci:"Pachypodium saundersii", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"둥근 괴근에 흰 꽃이 피는 아프리카 본토 파키포디움이에요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"남아프리카 동부·짐바브웨·모잠비크", size:"m" },
  { id:"pp_namaquanum", name:"파키포디움 나마콰눔 (광당)", alias:["광당", "나마콰눔", "Namaquanum", "하프맨", "괴근", "괴근식물"], sci:"Pachypodium namaquanum", cat:"succulent", light:3, amount:1, days:8, winter:10, temp:"10~25℃", min:3, pet:true, care:"기둥 같은 줄기 끝에 잎이 모여 나는 겨울형 희귀종이에요. 가을~봄에 자라고 여름에 잎을 떨구고 쉬는 겨울형 괴근식물이에요. 자라는 동안 흙이 마르면 주고, 여름 휴면기엔 물을 끊고 바람 잘 통하는 그늘에 두세요.", habitat:"남아프리카·나미비아 나마콰랜드 사막", size:"m" },
  { id:"ad_obesum", name:"아데니움 오베숨 (사막의장미)", alias:["사막의장미", "아데니움", "Desert Rose", "괴근", "괴근식물"], sci:"Adenium obesum", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"굵은 밑동과 분홍·빨강 꽃이 아름다운 괴근식물이에요. 수액에 독성이 있어요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"동아프리카·아라비아반도의 건조 지대", size:"m" },
  { id:"ad_arabicum", name:"아데니움 아라비쿰", alias:["아라비쿰", "Arabicum", "괴근", "괴근식물"], sci:"Adenium arabicum", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"밑동이 아주 굵고 넓게 퍼지는 종이에요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"아라비아반도 (예멘·사우디)", size:"m" },

  { id:"beaucarnea", name:"덕구리란 (포니테일팜)", alias:["덕구리란", "포니테일팜", "보카르네아", "Ponytail Palm", "괴근", "괴근식물"], sci:"Beaucarnea recurvata", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:false, care:"코끼리 발 같은 밑동에서 가는 잎이 머리카락처럼 늘어져요. 키우기 아주 쉬워요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"멕시코 동부", size:"l" },
  { id:"jatropha_p", name:"자트로파 포다그리카", alias:["포다그리카", "불두화", "Buddha Belly", "괴근", "괴근식물"], sci:"Jatropha podagrica", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"통처럼 부푼 줄기에 산호색 꽃이 피어요. 수액에 독성이 있어요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"중앙아메리카", size:"m" },
  { id:"jatropha_c", name:"자트로파 카타르티카", alias:["카타르티카", "Cathartica", "괴근", "괴근식물"], sci:"Jatropha cathartica", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"땅속 큰 괴근 위로 잎이 나고 붉은 꽃이 피어요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"미국 텍사스·멕시코", size:"s" },
  { id:"brachychiton", name:"브라키키톤 루페스트리스", alias:["브라키키톤", "퀸즐랜드 병나무", "Bottle Tree", "괴근", "괴근식물"], sci:"Brachychiton rupestris", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:false, care:"줄기가 병처럼 부풀어 오르는 나무예요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"호주 퀸즐랜드", size:"l" },
  { id:"ibervillea", name:"이베르빌레아 린드하이메리", alias:["이베르빌레아", "Ibervillea", "괴근", "괴근식물"], sci:"Ibervillea lindheimeri", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:false, care:"둥근 괴근에서 덩굴이 자라고 빨간 열매가 열려요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"미국 텍사스·멕시코 북부", size:"s" },
  { id:"stephania_e", name:"스테파니아 에렉타", alias:["스테파니아", "에렉타", "Stephania", "괴근", "괴근식물"], sci:"Stephania erecta", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:false, care:"감자 같은 괴근에서 연잎처럼 둥근 잎이 나와요. 다른 괴근보다 물을 조금 더 좋아해요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"태국·캄보디아", size:"s" },
  { id:"stephania_v", name:"스테파니아 베노사", alias:["베노사", "Venosa", "괴근", "괴근식물"], sci:"Stephania venosa", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:false, care:"큰 괴근에서 덩굴이 뻗고 잎맥이 붉어요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"동남아시아", size:"s" },
  { id:"sinningia_l", name:"브라질 에델바이스 (신닝기아)", alias:["브라질에델바이스", "신닝기아", "레우코트리카", "Sinningia", "괴근", "괴근식물"], sci:"Sinningia leucotricha", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:false, care:"은빛 솜털 잎에 주황 꽃이 피는 괴근식물이에요. 다른 괴근보다 반그늘을 좋아해요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"브라질 남동부 바위 지대", size:"s" },
  { id:"zamia", name:"자미아 푸르푸라케아", alias:["자미아", "판지소철", "Cardboard Palm", "괴근", "괴근식물"], sci:"Zamia furfuracea", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"판지처럼 두꺼운 잎의 소철류예요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"멕시코 베라크루스 해안", size:"m" },
  { id:"encephalartos", name:"엔세팔라르토스 (아프리카 소철)", alias:["엔세팔라르토스", "아프리카소철", "Encephalartos", "괴근", "괴근식물"], sci:"Encephalartos horridus", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:true, care:"은청색 가시 잎이 굵은 줄기에서 나오는 아프리카 소철이에요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"남아프리카 이스턴케이프", size:"m" },
  { id:"welwitschia", name:"웰위치아 미라빌리스", alias:["웰위치아", "기상천외", "Welwitschia", "괴근", "괴근식물"], sci:"Welwitschia mirabilis", cat:"succulent", light:3, amount:1, days:10, winter:30, temp:"20~32℃", min:10, pet:false, care:"평생 잎 두 장만 길게 자라는 사막의 살아있는 화석이에요. 깊은 화분이 필요해요. 괴근(굵은 뿌리·줄기)에 물을 저장하는 식물이에요. 봄~가을 성장기에는 흙이 완전히 마르면 흠뻑 주고, 잎이 지는 겨울 휴면기에는 물을 거의 끊어요. 마사·경석 위주의 물 빠짐 좋은 흙에 심고 햇빛을 충분히 보여 주세요.", habitat:"나미비아·앙골라 나미브사막", size:"m" },
  { id:"eu_obesa", name:"유포르비아 오베사", alias:["오베사", "야구공선인장", "Obesa"], sci:"Euphorbia obesa", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"야구공처럼 둥근 몸에 줄무늬가 있어요. 수액에 독성이 있어요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카 이스턴케이프", size:"s" },
  { id:"eu_horrida", name:"유포르비아 호리다", alias:["호리다", "Horrida"], sci:"Euphorbia horrida", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"선인장처럼 가시 돋은 기둥이 모여 자라요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카", size:"m" },
  { id:"eu_trigona", name:"유포르비아 트리고나 (아프리칸 밀크트리)", alias:["트리고나", "아프리칸밀크트리", "Trigona"], sci:"Euphorbia trigona", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"세모난 줄기에 잎이 달린 기둥형이에요. 붉은 품종(루브라)도 있어요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"중앙아프리카", size:"l" },
  { id:"eu_tirucalli", name:"청산호 (유포르비아 티루칼리)", alias:["청산호", "티루칼리", "파이어스틱", "Firesticks"], sci:"Euphorbia tirucalli", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"연필 같은 가지가 산호처럼 퍼져요. 붉은 '파이어스틱' 품종도 있어요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"동아프리카·남아프리카", size:"l" },
  { id:"eu_lactea", name:"유포르비아 락테아", alias:["락테아", "Lactea", "산호유포르비아"], sci:"Euphorbia lactea", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"흰 무늬가 있는 세모 기둥이에요. 닭벼슬 모양 철화종도 인기예요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"인도·스리랑카", size:"l" },
  { id:"eu_ingens", name:"유포르비아 인겐스", alias:["인겐스", "캔들라브라", "Ingens"], sci:"Euphorbia ingens", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"촛대처럼 가지를 치는 대형 기둥형이에요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카·동아프리카", size:"l" },
  { id:"eu_bupleuri", name:"철갑환 (유포르비아 부플레우리폴리아)", alias:["철갑환", "부플레우리폴리아"], sci:"Euphorbia bupleurifolia", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"솔방울 같은 비늘 줄기 위에 잎이 모여 나요. 과습에 약해요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카 이스턴케이프", size:"s" },
  { id:"eu_meloformis", name:"유포르비아 멜로포르미스", alias:["멜로포르미스", "Meloformis"], sci:"Euphorbia meloformis", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"참외처럼 둥근 몸에 줄무늬가 있어요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카 이스턴케이프", size:"s" },
  { id:"eu_decaryi", name:"유포르비아 데카리", alias:["데카리 유포르비아"], sci:"Euphorbia decaryi", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"물결치는 작은 잎이 땅 가까이 퍼지는 미니종이에요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"마다가스카르", size:"s" },
  { id:"eu_stellata", name:"유포르비아 스텔라타", alias:["스텔라타 유포르비아"], sci:"Euphorbia stellata", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"괴근에서 납작한 가지가 별 모양으로 퍼져요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카 이스턴케이프", size:"s" },
  { id:"ceropegia_w", name:"러브체인 (세로페기아 우디)", alias:["러브체인", "하트체인", "세로페기아", "String of Hearts"], sci:"Ceropegia woodii", cat:"succulent", light:2, amount:1, days:12, winter:25, temp:"15~27℃", min:5, pet:false, care:"작은 하트 잎이 실처럼 길게 늘어지고 흙 속에 작은 괴근이 생겨요. 강한 직사광선보다 밝은 반그늘을 좋아해요. 흙이 완전히 마르면 주고, 한여름과 한겨울엔 물을 줄여요.", habitat:"남아프리카·짐바브웨", size:"s" },
  { id:"stapelia", name:"스타펠리아 기간테아", alias:["스타펠리아", "불가사리꽃", "Starfish Flower"], sci:"Stapelia gigantea", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"불가사리 모양의 아주 큰 꽃이 피어요. 꽃에서 고기 냄새가 나요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카·탄자니아", size:"s" },
  { id:"huernia", name:"후에르니아 젭리나", alias:["후에르니아", "라이프세이버", "Lifesaver Plant"], sci:"Huernia zebrina", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"가운데 도넛 모양 고리가 있는 줄무늬 꽃이 피어요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카·보츠와나", size:"s" },

  { id:"aloidendron", name:"퀴버트리 (알로이덴드론 디코토뭄)", alias:["퀴버트리", "디코토마", "Quiver Tree"], sci:"Aloidendron dichotomum", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"나무처럼 가지를 치며 자라는 알로에예요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"나미비아·남아프리카 북서부", size:"l" },
  { id:"aloe_ferox", name:"알로에 페록스", alias:["페록스", "케이프알로에", "Ferox"], sci:"Aloe ferox", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"가시 돋은 큰 잎이 로제트로 퍼지고 주황 꽃대가 서요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카", size:"l" },
  { id:"aloe_juvenna", name:"알로에 주베나", alias:["주베나", "Juvenna", "호랑이이빨알로에"], sci:"Aloe juvenna", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"톱니 잎이 촘촘히 쌓이며 탑처럼 자라는 작은 알로에예요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"케냐", size:"s" },
  { id:"aloe_variegata", name:"알로에 바리에가타 (호랑이알로에)", alias:["호랑이알로에", "바리에가타 알로에", "Tiger Aloe"], sci:"Gonialoe variegata", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"세모 잎에 흰 줄무늬가 들어간 작은 알로에예요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카·나미비아", size:"s" },
  { id:"gasteria", name:"가스테리아", alias:["가스테리아", "소의혀", "Gasteria"], sci:"Gasteria carinata", cat:"succulent", light:2, amount:1, days:12, winter:25, temp:"15~27℃", min:5, pet:false, care:"혀처럼 두꺼운 잎에 흰 점이 있어요. 그늘에도 강해 실내에서 키우기 쉬워요. 강한 직사광선보다 밝은 반그늘을 좋아해요. 흙이 완전히 마르면 주고, 한여름과 한겨울엔 물을 줄여요.", habitat:"남아프리카 웨스턴케이프", size:"s" },

  { id:"haworthia_cooperi", name:"하월시아 오투사 (쿠페리)", alias:["오투사", "쿠페리", "Cooperi"], sci:"Haworthia cooperi", cat:"succulent", light:2, amount:1, days:12, winter:25, temp:"15~27℃", min:5, pet:false, care:"잎끝이 투명한 창처럼 빛을 받아들여요. 강한 직사광선보다 밝은 반그늘을 좋아해요. 흙이 완전히 마르면 주고, 한여름과 한겨울엔 물을 줄여요.", habitat:"남아프리카 이스턴케이프", size:"s" },
  { id:"haworthia_truncata", name:"옥선 (하월시아 트룬카타)", alias:["옥선", "트룬카타", "Truncata"], sci:"Haworthia truncata", cat:"succulent", light:2, amount:1, days:12, winter:25, temp:"15~27℃", min:5, pet:false, care:"잘린 듯한 잎끝의 창이 부채처럼 두 줄로 늘어서요. 강한 직사광선보다 밝은 반그늘을 좋아해요. 흙이 완전히 마르면 주고, 한여름과 한겨울엔 물을 줄여요.", habitat:"남아프리카 웨스턴케이프", size:"s" },

  { id:"portulacaria", name:"은행목 (포르툴라카리아)", alias:["은행목", "코끼리덤불", "포르툴라카리아", "Elephant Bush"], sci:"Portulacaria afra", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"작고 둥근 잎이 붉은 줄기에 달려 분재처럼 키워요. 무늬종(아금)도 있어요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카 이스턴케이프", size:"m" },
  { id:"cotyledon_o", name:"코틸레돈 오르비쿨라타", alias:["오르비쿨라타", "돼지귀", "Pig's Ear"], sci:"Cotyledon orbiculata", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"흰 가루가 덮인 둥근 잎 가장자리가 붉어요. 가루를 만지지 마세요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카·나미비아", size:"m" },

  { id:"crassula_perf", name:"크라술라 페르포라타 (남십자성)", alias:["남십자성", "페르포라타", "String of Buttons"], sci:"Crassula perforata", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"잎이 줄기를 꿰듯 겹겹이 쌓여요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카", size:"s" },
  { id:"crassula_gollum", name:"골룸 (크라술라 오바타 골룸)", alias:["골룸", "우주목", "Gollum"], sci:"Crassula ovata 'Gollum'", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"잎이 대롱처럼 말린 염좌 품종이에요. 끝이 붉어져요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"원예 품종 (원종은 남아프리카)", size:"m" },
  { id:"crassula_musc", name:"크라술라 무스코사 (청솔)", alias:["청솔", "무스코사", "Watch Chain"], sci:"Crassula muscosa", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:false, care:"작은 비늘잎이 끈처럼 촘촘히 붙어 자라요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카·나미비아", size:"s" },
  { id:"kalanchoe_tomentosa", name:"월토이 (칼랑코에 토멘토사)", alias:["월토이", "토끼귀", "Panda Plant"], sci:"Kalanchoe tomentosa", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"솜털 덮인 잎끝에 갈색 점이 있어요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"마다가스카르", size:"s" },
  { id:"kalanchoe_beharensis", name:"칼랑코에 베하렌시스 (코끼리귀)", alias:["베하렌시스", "코끼리귀", "Elephant's Ear Kalanchoe"], sci:"Kalanchoe beharensis", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"벨벳 같은 큰 세모 잎이 나무처럼 자라요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"마다가스카르 남부", size:"l" },
  { id:"kalanchoe_daig", name:"만손초 (칼랑코에 다이그레몬티아나)", alias:["만손초", "천손초", "Mother of Thousands"], sci:"Kalanchoe daigremontiana", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"잎 가장자리에 새끼 포기가 줄지어 생겨 떨어지면 바로 자라요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"마다가스카르", size:"m" },
  { id:"kalanchoe_luciae", name:"칼랑코에 루키아에 (데저트로즈)", alias:["루키아에", "플랩잭", "Flapjack"], sci:"Kalanchoe luciae", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"팬케이크 같은 둥근 잎이 겹쳐 나고 추우면 빨갛게 물들어요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카·보츠와나", size:"s" },
  { id:"aeonium", name:"흑법사 (에오니움 아르보레움 슈바르츠코프)", alias:["흑법사", "에오니움", "Schwarzkopf"], sci:"Aeonium arboreum 'Zwartkop'", cat:"succulent", light:2, amount:1, days:12, winter:25, temp:"15~27℃", min:5, pet:false, care:"검은 장미 같은 로제트가 줄기 끝에 달려요. 여름에 쉬고 가을~봄에 자라요. 강한 직사광선보다 밝은 반그늘을 좋아해요. 흙이 완전히 마르면 주고, 한여름과 한겨울엔 물을 줄여요.", habitat:"카나리아 제도 (원종 기준)", size:"m" },
  { id:"curio_serpens", name:"블루초크스틱 (세네시오 세르펜스)", alias:["블루초크스틱", "세르펜스", "Blue Chalksticks"], sci:"Curio repens", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"손가락 같은 청회색 잎이 위로 서요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카 웨스턴케이프", size:"s" },
  { id:"curio_radicans", name:"바나나 넝쿨 (세네시오 라디칸스)", alias:["바나나넝쿨", "스트링오브바나나", "String of Bananas"], sci:"Curio radicans", cat:"succulent", light:3, amount:1, days:12, winter:25, temp:"15~28℃", min:5, pet:true, care:"바나나 모양 잎이 줄줄이 늘어지는 걸이용이에요. 흙이 완전히 마르면 흠뻑 주고, 겨울엔 물을 크게 줄여요. 햇빛이 부족하면 웃자라니 밝은 창가에 두세요.", habitat:"남아프리카", size:"s" },
  { id:"conophytum", name:"코노피툼", alias:["코노피툼", "Conophytum"], sci:"Conophytum calculus", cat:"succulent", light:3, amount:1, days:14, winter:21, temp:"10~25℃", min:3, pet:false, care:"콩알 같은 작은 몸이 모여 나요. 가을~겨울에 자라고 꽃 피는 겨울형이에요. 메셈류(돌처럼 생긴 다육)예요. 물을 아주 적게 주고, 잎이 쪼글쪼글해질 때만 조금 주세요. 탈피(묵은 잎이 마르는 시기)에는 물을 끊어요. 과습하면 바로 물러요.", habitat:"남아프리카 나마콰랜드", size:"s" },
  { id:"pleiospilos", name:"플레이오스필로스 (제옥)", alias:["제옥", "플레이오스필로스", "Split Rock"], sci:"Pleiospilos nelii", cat:"succulent", light:3, amount:1, days:14, winter:21, temp:"10~25℃", min:3, pet:false, care:"갈라진 돌 같은 두 잎 사이에서 주황·분홍 꽃이 펴요. 메셈류(돌처럼 생긴 다육)예요. 물을 아주 적게 주고, 잎이 쪼글쪼글해질 때만 조금 주세요. 탈피(묵은 잎이 마르는 시기)에는 물을 끊어요. 과습하면 바로 물러요.", habitat:"남아프리카 이스턴케이프", size:"s" },

  { id:"ledebouria", name:"레데보우리아 (실버스퀼)", alias:["레데보우리아", "실버스퀼", "Silver Squill"], sci:"Ledebouria socialis", cat:"succulent", light:3, amount:1, days:10, winter:14, temp:"12~27℃", min:5, pet:false, care:"은빛 잎에 짙은 점무늬가 있고 작은 알뿌리가 모여 나요. 알뿌리에 물을 저장하는 식물이에요. 흙이 마르면 주고, 잎이 시들며 쉬는 시기엔 물을 끊어요. 알뿌리 윗부분은 흙 위로 드러나게 심어요.", habitat:"남아프리카 이스턴케이프", size:"s" },

  { id:"trachyandra", name:"트라키안드라 토르틸리스", alias:["트라키안드라", "Trachyandra"], sci:"Trachyandra tortilis", cat:"succulent", light:3, amount:1, days:10, winter:14, temp:"12~27℃", min:5, pet:false, care:"납작한 잎이 리본처럼 꼬여요. 겨울형이에요. 알뿌리에 물을 저장하는 식물이에요. 흙이 마르면 주고, 잎이 시들며 쉬는 시기엔 물을 끊어요. 알뿌리 윗부분은 흙 위로 드러나게 심어요.", habitat:"남아프리카 나마콰랜드", size:"s" },

  { id:"ne_truncata", name:"네펜데스 트룬카타", alias:["트룬카타", "Truncata", "식충식물"], sci:"Nepenthes truncata", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"20~30℃", min:12, pet:false, care:"하트 모양 큰 잎에 거대한 통이 달려요. 증류수나 빗물로 수태(물이끼)가 늘 촉촉하게 해 주세요. 받침에 물을 고이게 두지는 않아요. 습도가 높아야 벌레잡이 통이 잘 생기고, 밝은 간접광의 걸이화분이 어울려요.", habitat:"필리핀 민다나오", size:"l" },
  { id:"ne_bicalcarata", name:"네펜데스 비칼카라타", alias:["비칼카라타", "송곳니네펜데스", "Fanged Pitcher", "식충식물"], sci:"Nepenthes bicalcarata", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"20~30℃", min:12, pet:false, care:"통 뚜껑 아래 송곳니 같은 돌기 두 개가 있어요. 증류수나 빗물로 수태(물이끼)가 늘 촉촉하게 해 주세요. 받침에 물을 고이게 두지는 않아요. 습도가 높아야 벌레잡이 통이 잘 생기고, 밝은 간접광의 걸이화분이 어울려요.", habitat:"보르네오 저지대 늪", size:"l" },
  { id:"ne_veitchii", name:"네펜데스 베이치", alias:["베이치 네펜데스", "Veitchii", "식충식물"], sci:"Nepenthes veitchii", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"12~25℃", min:5, pet:false, care:"통 입구의 넓은 테두리(주름)가 아름다워요. 고산형이라 낮에는 따뜻하고 밤엔 서늘해야(10~15℃) 통이 잘 생겨요. 증류수나 빗물로 수태를 늘 촉촉하게 하고, 습도를 높게 유지해 주세요. 한여름 더위에 약해요.", habitat:"보르네오 산지", size:"m" },
  { id:"ne_hamata", name:"네펜데스 하마타", alias:["하마타", "Hamata", "식충식물"], sci:"Nepenthes hamata", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"12~25℃", min:5, pet:false, care:"통 입구에 날카로운 가시 이빨이 둘러 있는 고산종이에요. 고산형이라 낮에는 따뜻하고 밤엔 서늘해야(10~15℃) 통이 잘 생겨요. 증류수나 빗물로 수태를 늘 촉촉하게 하고, 습도를 높게 유지해 주세요. 한여름 더위에 약해요.", habitat:"인도네시아 술라웨시 고산", size:"m" },
  { id:"ne_sanguinea", name:"네펜데스 상귀네아", alias:["상귀네아", "Sanguinea", "식충식물"], sci:"Nepenthes sanguinea", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"12~25℃", min:5, pet:false, care:"길고 붉은 통이 달리는 고산형으로 키우기 쉬운 편이에요. 고산형이라 낮에는 따뜻하고 밤엔 서늘해야(10~15℃) 통이 잘 생겨요. 증류수나 빗물로 수태를 늘 촉촉하게 하고, 습도를 높게 유지해 주세요. 한여름 더위에 약해요.", habitat:"말레이반도 고산", size:"m" },
  { id:"ne_maxima", name:"네펜데스 막시마", alias:["막시마", "Maxima", "식충식물"], sci:"Nepenthes maxima", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"12~25℃", min:5, pet:false, care:"나팔처럼 긴 통에 물결 무늬 뚜껑이 있어요. 고산형이라 낮에는 따뜻하고 밤엔 서늘해야(10~15℃) 통이 잘 생겨요. 증류수나 빗물로 수태를 늘 촉촉하게 하고, 습도를 높게 유지해 주세요. 한여름 더위에 약해요.", habitat:"인도네시아 술라웨시·뉴기니 산지", size:"m" },
  { id:"ne_rajah", name:"네펜데스 라자", alias:["라자", "Rajah", "식충식물"], sci:"Nepenthes rajah", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"12~25℃", min:5, pet:false, care:"세계에서 가장 큰 통을 만드는 희귀종이에요. 작은 쥐까지 잡을 수 있어요. 고산형이라 낮에는 따뜻하고 밤엔 서늘해야(10~15℃) 통이 잘 생겨요. 증류수나 빗물로 수태를 늘 촉촉하게 하고, 습도를 높게 유지해 주세요. 한여름 더위에 약해요.", habitat:"보르네오 키나발루산", size:"l" },
  { id:"dr_capensis", name:"끈끈이주걱 카펜시스", alias:["카펜시스", "케이프끈끈이주걱", "Cape Sundew", "식충식물"], sci:"Drosera capensis", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"긴 주걱 잎에 붉은 점액 털이 빽빽해 벌레가 붙으면 잎이 말려요. 가장 키우기 쉬운 끈끈이주걱이에요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"남아프리카 케이프 습지", size:"s" },
  { id:"dr_capensis_alba", name:"카펜시스 알바", alias:["알바", "Capensis Alba", "식충식물"], sci:"Drosera capensis 'Alba'", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"털이 연두색이고 흰 꽃이 피는 품종이에요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"원예 품종 (원종은 남아프리카)", size:"s" },
  { id:"dr_spatulata", name:"끈끈이주걱 스파툴라타", alias:["스파툴라타", "Spatulata", "식충식물"], sci:"Drosera spatulata", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"작은 숟가락 잎이 로제트로 퍼지고 분홍 꽃이 펴요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"동아시아·호주·뉴질랜드 습지", size:"s" },
  { id:"dr_aliciae", name:"끈끈이주걱 알리키아에", alias:["알리키아에", "Aliciae", "식충식물"], sci:"Drosera aliciae", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"붉은 로제트가 땅에 납작하게 퍼져요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"남아프리카 케이프", size:"s" },
  { id:"dr_adelae", name:"끈끈이주걱 아델라에", alias:["아델라에", "Lance-leaf Sundew", "식충식물"], sci:"Drosera adelae", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"길쭉한 창 모양 잎의 열대종으로 반그늘을 좋아해요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"호주 퀸즐랜드 열대우림", size:"s" },
  { id:"dr_binata", name:"끈끈이주걱 비나타 (포크잎)", alias:["비나타", "포크잎끈끈이주걱", "Forked Sundew", "식충식물"], sci:"Drosera binata", cat:"carni", light:3, amount:3, days:2, winter:5, temp:"15~32℃", min:-5, pet:false, care:"잎이 Y자로 갈라지며 길게 자라요. 수돗물의 미네랄에 약해서 증류수·정수기 물·빗물만 줘요. 화분 받침에 물을 1~2cm 늘 채워 두는 저면관수로 키우고, 피트모스+펄라이트처럼 영양 없는 흙에 심어요. 햇빛을 많이 볼수록 색이 진해요. 겨울엔 0~10℃ 서늘한 곳(베란다)에서 휴면해야 다음 해에 튼튼해요.", habitat:"호주 남동부·뉴질랜드", size:"m" },
  { id:"dr_regia", name:"끈끈이주걱 레기아 (왕끈끈이주걱)", alias:["레기아", "킹선듀", "King Sundew", "식충식물"], sci:"Drosera regia", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"잎이 50cm까지 길게 자라는 가장 큰 끈끈이주걱이에요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"남아프리카 케이프 산지", size:"m" },
  { id:"dr_rotund", name:"끈끈이주걱 (자생 로툰디폴리아)", alias:["로툰디폴리아", "끈끈이주걱", "Round-leaved Sundew", "식충식물"], sci:"Drosera rotundifolia", cat:"carni", light:3, amount:3, days:2, winter:5, temp:"15~32℃", min:-5, pet:false, care:"동그란 잎의 우리 자생 끈끈이주걱이에요. 겨울엔 겨울눈으로 쉬어요. 수돗물의 미네랄에 약해서 증류수·정수기 물·빗물만 줘요. 화분 받침에 물을 1~2cm 늘 채워 두는 저면관수로 키우고, 피트모스+펄라이트처럼 영양 없는 흙에 심어요. 햇빛을 많이 볼수록 색이 진해요. 겨울엔 0~10℃ 서늘한 곳(베란다)에서 휴면해야 다음 해에 튼튼해요.", habitat:"북반구 온대 습지 (한국 산지 습지 자생)", size:"s" },
  { id:"dr_burmannii", name:"끈끈이주걱 부르만니", alias:["부르만니", "Burmannii", "식충식물"], sci:"Drosera burmannii", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"잎이 아주 빠르게 접혀 벌레를 잡는 한해살이형이에요. 씨앗이 잘 퍼져요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"아시아·호주 열대", size:"s" },
  { id:"dr_paradoxa", name:"끈끈이주걱 파라독사", alias:["파라독사", "Paradoxa", "식충식물"], sci:"Drosera paradoxa", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"줄기 위에 가는 잎이 별처럼 퍼지는 열대종이에요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"호주 북부", size:"s" },
  { id:"dr_scorpioides", name:"피그미 끈끈이주걱", alias:["피그미끈끈이주걱", "스코르피오이데스", "Pygmy Sundew", "식충식물"], sci:"Drosera scorpioides", cat:"carni", light:3, amount:3, days:2, winter:5, temp:"15~32℃", min:-5, pet:false, care:"1~2cm의 아주 작은 끈끈이주걱으로 겨울에 작은 싹눈(제마)으로 번식해요. 수돗물의 미네랄에 약해서 증류수·정수기 물·빗물만 줘요. 화분 받침에 물을 1~2cm 늘 채워 두는 저면관수로 키우고, 피트모스+펄라이트처럼 영양 없는 흙에 심어요. 햇빛을 많이 볼수록 색이 진해요. 겨울엔 0~10℃ 서늘한 곳(베란다)에서 휴면해야 다음 해에 튼튼해요.", habitat:"호주 서남부", size:"s" },
  { id:"dr_prolifera", name:"끈끈이주걱 프롤리페라", alias:["프롤리페라", "Prolifera", "식충식물"], sci:"Drosera prolifera", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"꽃대 끝에서 새끼 포기가 생겨 퍼지는 그늘형 종이에요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"호주 퀸즐랜드 열대우림", size:"s" },
  { id:"drosophyllum", name:"드로소필룸 (포르투갈 끈끈이)", alias:["드로소필룸", "Dewy Pine", "식충식물"], sci:"Drosophyllum lusitanicum", cat:"carni", light:3, amount:2, days:3, winter:7, temp:"10~28℃", min:0, pet:false, care:"다른 식충식물과 달리 건조한 흙을 좋아하는 특이한 종이에요. 받침에 물을 채우지 마세요. 작은 주전자 모양 통이 귀여운 식충식물이에요. 증류수로 흙을 촉촉하게 하되 너무 질지 않게 하고, 뿌리를 건드리면 약해지니 분갈이는 조심해요. 겨울엔 서늘하게 쉬어요.", habitat:"포르투갈·스페인 남부·모로코의 건조한 언덕", size:"s" },
  { id:"byblis", name:"비블리스 (무지개식물)", alias:["비블리스", "무지개식물", "Rainbow Plant", "식충식물"], sci:"Byblis liniflora", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"가는 잎의 점액 털이 무지개빛으로 반짝여요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"호주 북부·뉴기니", size:"s" },
  { id:"pg_moranensis", name:"벌레잡이제비꽃 모라넨시스", alias:["모라넨시스", "벌레잡이제비꽃", "Butterwort", "식충식물"], sci:"Pinguicula moranensis", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"분홍 꽃이 피는 대표 멕시코 벌레잡이제비꽃이에요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"멕시코 산지 석회암 바위", size:"s" },

  { id:"pg_aphrodite", name:"벌레잡이제비꽃 아프로디테", alias:["아프로디테", "Aphrodite", "식충식물"], sci:"Pinguicula 'Aphrodite'", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"분홍빛 큰 꽃과 붉은 잎이 예쁜 교배종이에요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"원예 교배종 (원종은 멕시코)", size:"s" },

  { id:"pg_sethos", name:"벌레잡이제비꽃 세토스", alias:["세토스", "Sethos", "식충식물"], sci:"Pinguicula 'Sethos'", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"진분홍 꽃이 피는 인기 교배종이에요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"원예 교배종 (원종은 멕시코)", size:"s" },

  { id:"pg_esseriana", name:"벌레잡이제비꽃 에세리아나", alias:["에세리아나", "Esseriana", "식충식물"], sci:"Pinguicula esseriana", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"작은 로제트에 분홍 꽃이 피는 미니종이에요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"멕시코 산루이스포토시", size:"s" },
  { id:"pg_agnata", name:"벌레잡이제비꽃 아그나타", alias:["아그나타", "Agnata", "식충식물"], sci:"Pinguicula agnata", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"흰 바탕에 보라 테두리 꽃이 피어요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"멕시코 이달고", size:"s" },
  { id:"pg_cyclosecta", name:"벌레잡이제비꽃 키클로섹타", alias:["키클로섹타", "Cyclosecta", "식충식물"], sci:"Pinguicula cyclosecta", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"은보라빛 잎에 진보라 꽃이 펴요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"멕시코 누에보레온", size:"s" },
  { id:"pg_emarginata", name:"벌레잡이제비꽃 에마르기나타", alias:["에마르기나타", "Emarginata", "식충식물"], sci:"Pinguicula emarginata", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"흰 꽃에 보라 잎맥이 그물처럼 들어가요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"멕시코 산지", size:"s" },
  { id:"pg_laueana", name:"벌레잡이제비꽃 라우에아나", alias:["라우에아나", "Laueana", "식충식물"], sci:"Pinguicula laueana", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"빨간 꽃이 피는 드문 종이에요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"멕시코 오악사카", size:"s" },
  { id:"pg_gypsicola", name:"벌레잡이제비꽃 깁시콜라", alias:["깁시콜라", "Gypsicola", "식충식물"], sci:"Pinguicula gypsicola", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"여름 잎이 실처럼 가늘고 길어요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"멕시코 석고 바위 지대", size:"s" },
  { id:"pg_ehlersiae", name:"벌레잡이제비꽃 엘레르시아에", alias:["엘레르시아에", "Ehlersiae", "식충식물"], sci:"Pinguicula ehlersiae", cat:"carni", light:2, amount:2, days:3, winter:10, temp:"15~28℃", min:5, pet:false, care:"작은 로제트에 진분홍 꽃이 펴요. 성장기(봄~가을)엔 끈끈한 잎으로 벌레를 잡아요. 증류수로 받침에 물을 얕게 채워 주고, 겨울엔 다육처럼 작은 잎으로 쉬니 흙이 마르면 조금만 주세요. 실내 뿌리파리 잡는 데 탁월해요.", habitat:"멕시코 산루이스포토시", size:"s" },
  { id:"pg_primuliflora", name:"벌레잡이제비꽃 프리물리플로라", alias:["프리물리플로라", "Primuliflora", "식충식물"], sci:"Pinguicula primuliflora", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"18~32℃", min:7, pet:false, care:"잎끝에서 새끼 포기가 생기는 미국 남부종이에요. 물을 좋아해요. 증류수·정수기 물·빗물만 주고 받침에 물을 늘 채워 두세요. 영양 없는 흙(피트모스+펄라이트)에 심고 햇빛을 충분히 보여 주면 잎의 점액이 반짝여요. 휴면이 필요 없어 겨울에도 따뜻한 창가에서 키워요.", habitat:"미국 남동부 습지", size:"s" },
  { id:"pg_lusitanica", name:"벌레잡이제비꽃 루시타니카", alias:["루시타니카", "Lusitanica", "식충식물"], sci:"Pinguicula lusitanica", cat:"carni", light:3, amount:3, days:2, winter:5, temp:"15~32℃", min:-5, pet:false, care:"작고 연한 잎에 연보라 꽃이 피는 유럽 서부종이에요. 수돗물의 미네랄에 약해서 증류수·정수기 물·빗물만 줘요. 화분 받침에 물을 1~2cm 늘 채워 두는 저면관수로 키우고, 피트모스+펄라이트처럼 영양 없는 흙에 심어요. 햇빛을 많이 볼수록 색이 진해요. 겨울엔 0~10℃ 서늘한 곳(베란다)에서 휴면해야 다음 해에 튼튼해요.", habitat:"유럽 서부·북아프리카 습지", size:"s" },
  { id:"pg_vulgaris", name:"벌레잡이제비꽃 (자생 불가리스)", alias:["불가리스", "자생 벌레잡이제비꽃", "Common Butterwort", "식충식물"], sci:"Pinguicula vulgaris", cat:"carni", light:2, amount:3, days:2, winter:10, temp:"5~22℃", min:-15, pet:false, care:"보라 꽃이 피는 북방형으로 우리나라 높은 산 습한 바위에서 자라요. 서늘한 곳을 좋아하는 북방형이에요. 증류수로 흙을 늘 촉촉하게 하고, 겨울엔 잎을 말아 겨울눈으로 휴면하니 차갑게 두세요. 한여름 더위에 약해요.", habitat:"유럽·북아메리카·동아시아 한대 (한국 설악산 등 고산 자생)", size:"s" },
  { id:"pg_grandiflora", name:"벌레잡이제비꽃 그란디플로라", alias:["그란디플로라", "Grandiflora", "식충식물"], sci:"Pinguicula grandiflora", cat:"carni", light:2, amount:3, days:2, winter:10, temp:"5~22℃", min:-15, pet:false, care:"큰 보라 꽃이 피는 유럽 고산형이에요. 서늘한 곳을 좋아하는 북방형이에요. 증류수로 흙을 늘 촉촉하게 하고, 겨울엔 잎을 말아 겨울눈으로 휴면하니 차갑게 두세요. 한여름 더위에 약해요.", habitat:"유럽 서부 (아일랜드·피레네·알프스)", size:"s" },
  { id:"ut_sandersonii", name:"토끼통발 (산데르소니)", alias:["토끼통발", "산데르소니", "Bunny Utricularia", "식충식물"], sci:"Utricularia sandersonii", cat:"carni", light:2, amount:3, days:2, winter:4, temp:"15~28℃", min:8, pet:false, care:"토끼 얼굴 같은 작은 흰 꽃이 1년 내내 펴요. 흙을 늘 물에 젖은 상태로 두고(받침에 물 채우기) 증류수를 주세요. 땅속의 아주 작은 주머니로 미생물을 잡고, 작고 예쁜 꽃이 오래 펴요.", habitat:"남아프리카 동부 습한 바위", size:"s" },
  { id:"ut_livida", name:"통발 리비다", alias:["리비다 통발", "Livida", "식충식물"], sci:"Utricularia livida", cat:"carni", light:2, amount:3, days:2, winter:4, temp:"15~28℃", min:8, pet:false, care:"보라 꽃이 오래 피는 튼튼한 종이에요. 흙을 늘 물에 젖은 상태로 두고(받침에 물 채우기) 증류수를 주세요. 땅속의 아주 작은 주머니로 미생물을 잡고, 작고 예쁜 꽃이 오래 펴요.", habitat:"아프리카·마다가스카르·멕시코", size:"s" },
  { id:"ut_longifolia", name:"통발 롱기폴리아", alias:["롱기폴리아", "Longifolia", "식충식물"], sci:"Utricularia longifolia", cat:"carni", light:2, amount:3, days:2, winter:4, temp:"15~28℃", min:8, pet:false, care:"긴 잎과 큰 연보라 꽃이 아름다워요. 흙을 늘 물에 젖은 상태로 두고(받침에 물 채우기) 증류수를 주세요. 땅속의 아주 작은 주머니로 미생물을 잡고, 작고 예쁜 꽃이 오래 펴요.", habitat:"브라질 남동부", size:"s" },
  { id:"ut_bisquamata", name:"통발 비스쿠아마타", alias:["비스쿠아마타", "Bisquamata", "식충식물"], sci:"Utricularia bisquamata", cat:"carni", light:2, amount:3, days:2, winter:4, temp:"15~28℃", min:8, pet:false, care:"작은 흰·노랑·보라 꽃이 촘촘히 펴요. 흙을 늘 물에 젖은 상태로 두고(받침에 물 채우기) 증류수를 주세요. 땅속의 아주 작은 주머니로 미생물을 잡고, 작고 예쁜 꽃이 오래 펴요.", habitat:"남아프리카", size:"s" },
  { id:"ut_alpina", name:"통발 알피나", alias:["알피나 통발", "Alpina", "식충식물"], sci:"Utricularia alpina", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"20~30℃", min:12, pet:false, care:"난초처럼 나무 위에 사는 종으로 흰 꽃이 커요. 수태에 심어요. 증류수나 빗물로 수태(물이끼)가 늘 촉촉하게 해 주세요. 받침에 물을 고이게 두지는 않아요. 습도가 높아야 벌레잡이 통이 잘 생기고, 밝은 간접광의 걸이화분이 어울려요.", habitat:"카리브해·남아메리카 북부 산지", size:"s" },
  { id:"ut_reniformis", name:"통발 레니포르미스", alias:["레니포르미스", "Reniformis", "식충식물"], sci:"Utricularia reniformis", cat:"carni", light:2, amount:2, days:3, winter:6, temp:"20~30℃", min:12, pet:false, care:"콩팥 모양 큰 잎과 보라 꽃이 피는 대형종이에요. 증류수나 빗물로 수태(물이끼)가 늘 촉촉하게 해 주세요. 받침에 물을 고이게 두지는 않아요. 습도가 높아야 벌레잡이 통이 잘 생기고, 밝은 간접광의 걸이화분이 어울려요.", habitat:"브라질 남동부 산지", size:"m" },
  { id:"ut_graminifolia", name:"통발 그라미니폴리아", alias:["그라미니폴리아", "Graminifolia", "식충식물"], sci:"Utricularia graminifolia", cat:"carni", light:2, amount:3, days:2, winter:4, temp:"15~28℃", min:8, pet:false, care:"풀잎 같은 잎이 퍼지고 수조 바닥에 깔기도 해요. 흙을 늘 물에 젖은 상태로 두고(받침에 물 채우기) 증류수를 주세요. 땅속의 아주 작은 주머니로 미생물을 잡고, 작고 예쁜 꽃이 오래 펴요.", habitat:"인도·동남아시아·중국 남부", size:"s" },
  { id:"ut_japonica", name:"통발 (자생 수생)", alias:["통발", "들통발", "Bladderwort", "식충식물"], sci:"Utricularia japonica", cat:"carni", light:3, amount:3, days:7, winter:14, temp:"15~30℃", min:0, pet:false, care:"물속에 떠서 작은 주머니로 물벼룩을 잡아요. 여름에 노란 꽃이 물 위로 펴요. 물에 떠서 사는 식충식물이에요. 빗물이나 연못 물이 담긴 수조에서 키우고, 이끼가 끼지 않게 물을 가끔 갈아 주세요. 겨울엔 겨울눈이 바닥에 가라앉아 쉬어요.", habitat:"한국·일본·중국의 연못과 논", size:"s" },
  { id:"aldrovanda", name:"벌레먹이말 (알드로반다)", alias:["벌레먹이말", "알드로반다", "Waterwheel Plant", "식충식물"], sci:"Aldrovanda vesiculosa", cat:"carni", light:3, amount:3, days:7, winter:14, temp:"15~30℃", min:0, pet:false, care:"물속의 작은 파리지옥이라 불려요. 아주 희귀하고 까다로워요. 물에 떠서 사는 식충식물이에요. 빗물이나 연못 물이 담긴 수조에서 키우고, 이끼가 끼지 않게 물을 가끔 갈아 주세요. 겨울엔 겨울눈이 바닥에 가라앉아 쉬어요.", habitat:"유럽·아시아·아프리카·호주의 늪 (한국 멸종위기)", size:"s" },
  { id:"cephalotus", name:"세팔로투스 (앨버니 피처플랜트)", alias:["세팔로투스", "Albany Pitcher Plant", "식충식물"], sci:"Cephalotus follicularis", cat:"carni", light:3, amount:2, days:3, winter:7, temp:"10~28℃", min:0, pet:false, care:"털 난 작은 주전자 통이 땅 가까이 모여 나요. 작은 주전자 모양 통이 귀여운 식충식물이에요. 증류수로 흙을 촉촉하게 하되 너무 질지 않게 하고, 뿌리를 건드리면 약해지니 분갈이는 조심해요. 겨울엔 서늘하게 쉬어요.", habitat:"호주 서남부 앨버니 해안 습지", size:"s" },
  { id:"hl_nutans", name:"헬리암포라 누탄스", alias:["헬리암포라", "누탄스", "Sun Pitcher", "식충식물"], sci:"Heliamphora nutans", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"15~25℃", min:5, pet:false, care:"나팔 모양 통 끝에 작은 숟가락 뚜껑이 있어요. 남미 고산의 탁상 산지에서 와서 강한 빛, 높은 습도, 서늘한 밤을 좋아해요. 증류수로 받침에 물을 채워 두고 30℃ 넘는 더위는 피해 주세요.", habitat:"베네수엘라·가이아나 탁상 산지 (로라이마산)", size:"s" },
  { id:"hl_minor", name:"헬리암포라 미노르", alias:["미노르 헬리암포라", "Minor", "식충식물"], sci:"Heliamphora minor", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"15~25℃", min:5, pet:false, care:"작은 통이 촘촘히 모여 나는 입문용 헬리암포라예요. 남미 고산의 탁상 산지에서 와서 강한 빛, 높은 습도, 서늘한 밤을 좋아해요. 증류수로 받침에 물을 채워 두고 30℃ 넘는 더위는 피해 주세요.", habitat:"베네수엘라 아우얀테푸이", size:"s" },
  { id:"hl_heterodoxa", name:"헬리암포라 헤테로독사", alias:["헤테로독사", "Heterodoxa", "식충식물"], sci:"Heliamphora heterodoxa", cat:"carni", light:3, amount:3, days:2, winter:4, temp:"15~25℃", min:5, pet:false, care:"크고 붉은 통이 달리고 비교적 따뜻한 환경도 견뎌요. 남미 고산의 탁상 산지에서 와서 강한 빛, 높은 습도, 서늘한 밤을 좋아해요. 증류수로 받침에 물을 채워 두고 30℃ 넘는 더위는 피해 주세요.", habitat:"베네수엘라 탁상 산지", size:"m" },
  // ── 조경수 ──
  { id:"ls_ipap", name:"이팝나무", alias:["이팝", "Fringe Tree", "조경수"], sci:"Chionanthus retusus", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"5월에 흰 꽃이 나무를 쌀밥처럼 덮어 가로수로 많이 심어요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국 남부·중국·일본·대만" },
  { id:"ls_zelkova", name:"느티나무", alias:["느티", "Zelkova", "조경수"], sci:"Zelkova serrata", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"마을 정자나무로 오래 살며 그늘이 넓어요. 가을에 노랑·주황으로 물들어요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·일본·중국" },
  { id:"ls_ginkgo", name:"은행나무", alias:["은행", "Ginkgo", "조경수"], sci:"Ginkgo biloba", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:true, care:"부채 모양 잎이 가을에 샛노랗게 물들어요. 열매 냄새 때문에 가로수는 수나무를 심어요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"중국 저장성 (살아있는 화석)" },
  { id:"ls_metaseq", name:"메타세쿼이아", alias:["메타세콰이아", "Dawn Redwood", "조경수"], sci:"Metasequoia glyptostroboides", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:14, temp:"5~28℃", min:-25, pet:false, care:"원뿔형으로 곧고 크게 자라고, 가을에 적갈색으로 물든 뒤 잎이 지는 침엽수예요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥에서 나요.", habitat:"중국 후베이·쓰촨 (살아있는 화석)" },
  { id:"ls_tulip", name:"백합나무 (튤립나무)", alias:["튤립나무", "백합나무", "Tulip Tree", "조경수"], sci:"Liriodendron tulipifera", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"튤립 같은 연두·주황 꽃이 피고 아주 빨리 자라요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"북아메리카 동부" },
  { id:"ls_scarletoak", name:"대왕참나무", alias:["대왕참나무", "핀오크", "Pin Oak", "조경수"], sci:"Quercus palustris", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"깊게 갈라진 잎이 가을에 진홍색으로 물드는 가로수예요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"북아메리카 동부" },
  { id:"ls_sangsu", name:"상수리나무", alias:["상수리", "도토리나무", "Sawtooth Oak", "조경수"], sci:"Quercus acutissima", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"도토리가 열리는 우리 산의 대표 참나무예요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·중국·일본" },
  { id:"ls_singal", name:"신갈나무", alias:["신갈", "조경수"], sci:"Quercus mongolica", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"우리 산 높은 곳에 가장 흔한 참나무예요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·중국 동북부·러시아 동부" },
  { id:"ls_dogwood", name:"산딸나무", alias:["산딸", "Kousa Dogwood", "조경수"], sci:"Cornus kousa", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"초여름에 흰 십자 모양 꽃포가 나무를 덮고, 가을에 빨간 열매가 달려요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·일본·중국" },
  { id:"ls_flowerdog", name:"꽃산딸나무 (미국산딸)", alias:["꽃산딸", "미국산딸", "Flowering Dogwood", "조경수"], sci:"Cornus florida", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"봄에 잎보다 먼저 흰·분홍 꽃포가 피어요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"북아메리카 동부" },
  { id:"ls_mountainash", name:"마가목", alias:["마가목", "Rowan", "조경수"], sci:"Sorbus commixta", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"흰 꽃과 가을의 빨간 열매 송이가 예쁜 산의 나무예요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·일본 산지" },
  { id:"ls_pagoda", name:"회화나무", alias:["회화나무", "학자수", "Pagoda Tree", "조경수"], sci:"Styphnolobium japonicum", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"여름에 연노랑 꽃이 피고, 예부터 선비의 나무로 궁궐에 심었어요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"중국" },

  { id:"ls_snowbell", name:"때죽나무", alias:["때죽", "Japanese Snowbell", "조경수"], sci:"Styrax japonicus", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"5월에 종 모양 흰 꽃이 아래로 주렁주렁 매달려요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·일본·중국" },
  { id:"ls_hawthorn", name:"산사나무", alias:["산사", "Hawthorn", "조경수"], sci:"Crataegus pinnatifida", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"흰 꽃과 가을의 빨간 열매(산사)가 달려요. 가시가 있어요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·중국 동북부" },
  { id:"ls_pbae", name:"팥배나무", alias:["팥배", "조경수"], sci:"Sorbus alnifolia", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"흰 꽃과 팥알 같은 붉은 열매가 달려요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·일본·중국" },
  { id:"ls_horsechest", name:"칠엽수 (마로니에)", alias:["마로니에", "칠엽수", "Horse Chestnut", "조경수"], sci:"Aesculus turbinata", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"손바닥처럼 일곱 장 잎과 원뿔 모양 흰 꽃이 피어요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"일본" },

  { id:"ls_himalayan", name:"히말라야시더", alias:["개잎갈나무", "히말라야삼나무", "Deodar Cedar", "조경수"], sci:"Cedrus deodara", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:14, temp:"5~28℃", min:-25, pet:false, care:"가지가 우아하게 늘어지는 큰 침엽수로 가로수와 공원수로 많이 써요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥에서 나요.", habitat:"히말라야 서부" },

  { id:"ls_geumsong", name:"금송", alias:["금송", "Umbrella Pine", "조경수"], sci:"Sciadopitys verticillata", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:14, temp:"5~28℃", min:-25, pet:false, care:"우산살처럼 돌려나는 두꺼운 잎이 특징인 일본 특산 침엽수예요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥에서 나요.", habitat:"일본" },
  { id:"ls_kaizuka", name:"가이즈카향나무", alias:["가이즈카", "나사백", "Kaizuka Juniper", "조경수"], sci:"Juniperus chinensis 'Kaizuka'", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:14, temp:"5~28℃", min:-25, pet:false, care:"가지가 불꽃처럼 꼬이며 자라 울타리와 정원수로 흔해요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥에서 나요.", habitat:"원예 품종 (원종은 동아시아)" },

  { id:"ls_baldcypress", name:"낙우송", alias:["낙우송", "Bald Cypress", "조경수"], sci:"Taxodium distichum", cat:"foliage", tree:true, light:3, amount:3, days:3, winter:14, temp:"10~30℃", min:-25, pet:false, care:"물가에서 무릎 같은 뿌리(기근)를 내미는 낙엽 침엽수예요. 물가를 좋아해 흙이 마르지 않게 자주 주세요. 아주 빨리 자라고 추위에 강해요.", habitat:"미국 남동부 늪" },
  { id:"ls_larch", name:"일본잎갈나무 (낙엽송)", alias:["낙엽송", "Japanese Larch", "조경수"], sci:"Larix kaempferi", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:14, temp:"5~28℃", min:-25, pet:false, care:"가을에 노랗게 물들어 잎이 지는 침엽수예요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥에서 나요.", habitat:"일본 중부 산지" },
