  const ctl = new AbortController();
  sheet(`<h2>"${esc(name)}" 찾는 중</h2><p class="sci" id="ai-status">AI가 식물 정보를 찾고 있어요. 10~30초쯤 걸려요.</p>
    <div class="row" style="margin-top:16px"><button class="ghost" id="ai-stop" data-close>그만두기</button></div>`,
    (s, close) => { s.querySelector("#ai-stop").onclick = () => { ctl.abort(); close(); }; });
  const prompt = `한국에서 집 안이나 베란다에서 키우는 식물 "${name}"의 키우는 법을 알려주세요.
오타, 별명, 품종명일 수 있으니 가장 가능성 높은 식물로 판단하세요. 식물이 아니거나 무엇인지 알 수 없으면 found를 false로 하세요.
다른 글 없이 JSON 객체 하나로만 답하세요. 형식:
{"found": true, "name": "한국에서 흔히 부르는 이름", "alias": ["다른 이름", "..."], "sci": "학명",
 "cat": "foliage|flower|succulent|herb|veg|fruit|carni(식충식물) 중 하나", "tree": true 또는 false (나무나 관목이면 true),
 "light": 1(음지)|2(반음지, 밝은 간접광)|3(양지, 직사광선), "amount": 1(조금)|2(보통)|3(흠뻑),
 "days": 봄~가을 화분 기준 물주기 간격 일수(정수), "winter": 12~2월 실내 물주기 간격 일수(정수),
 "temp": "잘 자라는 온도 범위, 예: 18~27℃", "min": 냉해나 동사 위험이 생기는 최저 온도(정수, ℃),
 "pet": 고양이·개에게 독성이 있으면 true, 안전하면 false, 모르면 null,
 "family": "과의 라틴어 이름, 예: Araceae", "familyKo": "과의 한국어 이름, 예: 천남성과", "habitat": "원래 자라던 곳(자생지)을 한국어로 짧게, 예: 멕시코 남부의 열대우림", "size": "화분에서 다 자랐을 때 크기. s(30cm 이하), m(30cm~1m), l(1m 이상) 중 하나", "propagation": "번식 방법 코드 배열 (잘 되는 순서). 고를 수 있는 값: node, cut, hardwood, leaf, leafstalk, sansleaf, div, pup, bulb, corm, runner, keiki, layer, graft, seed, seedtree, seedpit, spore, regrow",
 "care": "물주기와 관리 핵심을 해요체로 2문장"}`;
  try {
    const res = await sample.json(prompt, { signal: ctl.signal });
    document.querySelector(".scrim")?.remove();
    if (!res || res.found === false) {
      toast(`"${name}"에 대한 정보를 찾지 못했어요. 직접 입력해 주세요.`, 4000);
      openEditor({ name }, "manual");
      return;
    }
    const found = normalizePlant(res, "ai");
    // 검색한 말로도 다음에 찾을 수 있게 별명에 넣어 둬요
    if (!found.alias.includes(name) && found.name !== name) found.alias.unshift(clean(name, 30));
    openEditor(found, "ai");
  } catch (e) {
    if (e?.code === "cancelled") return;
    const st = document.querySelector("#ai-status");
    const msg = {
      not_granted: "AI 사용을 허용하지 않아서 찾을 수 없어요. 직접 입력해 주세요.",
      sampling_disabled: "이 계정에서는 AI를 쓸 수 없어요. 직접 입력해 주세요.",
      rate_limited: "AI를 너무 자주 불렀어요. 잠시 뒤에 다시 해 주세요.",
      invalid_json: "AI 답을 읽지 못했어요. 다시 해 보거나 직접 입력해 주세요.",
    }[e?.code] || "AI가 답하지 못했어요. 잠시 뒤 다시 하거나 직접 입력해 주세요.";
    if (["not_granted", "sampling_disabled"].includes(e?.code)) sample = null;
    if (st) st.textContent = msg; else toast(msg, 4000);
  }
}

const AI_FIELDS = `{"name": "한국에서 흔히 부르는 이름", "alias": ["다른 이름"], "sci": "학명 (품종은 'Cultivar' 형식)",
 "cat": "foliage|flower|succulent|herb|veg|fruit|carni 중 하나", "tree": true 또는 false,
 "light": 1|2|3, "amount": 1|2|3, "days": 물주기 일수, "winter": 겨울 물주기 일수, "temp": "18~27℃ 형식", "min": 최저 온도 정수,
 "pet": true|false|null, "family": "과 라틴어", "familyKo": "과 한국어", "habitat": "자생지 한국어로 짧게",
 "size": "s|m|l", "propagation": ["번식 코드"], "care": "관리 핵심 해요체 2문장"}`;
const sameName = (a, b) => a.replace(/\s/g, "").toLowerCase() === b.replace(/\s/g, "").toLowerCase();
async function findSimilar(plant) {
  if (!sample) return;
  const genus = taxonomy(plant).genus;
  const known = PLANTS.filter(p => genus && taxonomy(p).genus === genus).map(p => p.name).slice(0, 80);
  const prompt = `식물 "${plant.name}"${plant.sci ? ` (${plant.sci})` : ""}와 비슷한 식물을 찾아 주세요.
같은 속의 다른 종이나 한국에서 많이 키우는 인기 품종으로, 실제로 있는 식물만 최대 8개 골라 주세요.
${known.length ? `이미 목록에 있는 것은 빼 주세요: ${known.join(", ")}` : ""}
다른 글 없이 JSON 객체 하나로만 답하세요. 형식: {"plants": [ ${AI_FIELDS} ]}
번식 코드 값: node, cut, hardwood, leaf, leafstalk, sansleaf, div, pup, bulb, corm, runner, keiki, layer, graft, seed, seedtree, seedpit, spore, regrow`;
  try {
    const res = await sample.json(prompt);
    const list = Array.isArray(res?.plants) ? res.plants.slice(0, 8) : [];
    const stamp = Date.now().toString(36);
    let added = 0;
    list.forEach((raw, i) => {
      if (!raw || !clean(raw.name)) return;
      const p = normalizePlant({ ...raw, id: `c_${stamp}_${i}` }, "ai");
      const dup = PLANTS.some(q => sameName(q.name, p.name) || (p.sci && q.sci && sameName(q.sci, p.sci)));
      if (dup) return;
      p.similarTo = clean(plant.name, 30);
      state.custom.push(p); registerCustom(p); added++;
    });
    if (added) { save(); toast(`${plant.name}와(과) 비슷한 식물 ${added}개도 검색 목록에 추가했어요.`, 4000); if (tab === "find") { const y = window.scrollY; renderResults(); window.scrollTo(0, y); } }
  } catch (e) {}
}

// ── 사진 저장 (이 기기의 브라우저 저장소, IndexedDB) ──
const idb = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("plant-photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("p");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("p", mode);
      const req = fn(t.objectStore("p"));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  };
  // IndexedDB가 막힌 환경(일부 앱 안 브라우저)에서는 이 기기의 localStorage에 저장해요
  const LS = "plant-photo:";
  const lsGet = k => { try { return localStorage.getItem(LS + k); } catch (e) { return null; } };
  return {
    get: k => tx("readonly", st => st.get(k)).then(v => v ?? lsGet(k)).catch(() => lsGet(k)),
    put: (k, v) => tx("readwrite", st => st.put(v, k)).catch(() => { localStorage.setItem(LS + k, v); }),
    del: k => { try { localStorage.removeItem(LS + k); } catch (e) {} return tx("readwrite", st => st.delete(k)).catch(() => {}); },
  };
})();
// 사진은 data: 주소(글자)로 저장하고 보여줘요. blob: 주소가 막힌 환경에서도 보이게 하려고요.
const readAsDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
const urlCache = {};
async function photoURL(key) {
  if (!key) return null;
  if (urlCache[key]) return urlCache[key];
  let v = await idb.get(key).catch(() => null);
  if (v && typeof v !== "string") v = await readAsDataURL(v).catch(() => null);  // 예전에 Blob으로 저장한 사진
  return v ? (urlCache[key] = v) : null;
}

// ── 기본 사진 (iNaturalist에서 학명으로 자동으로 불러와요) ──

// Claude 미리보기 링크에서는 다른 사이트 접속이 막혀 있어서, 앱을 인터넷 주소에 올렸을 때만 보여요.
const NO_FLOWER = new Set(["boston","adiantum","platycerium","marimo","cycas","sprouts","araucaria","goldcrest","blueice","juniper","pine","cf_bansong","cf_taxus","cf_emerald","cf_blueangel","buxus","asparagus","muehlenbeckia","eu_polyan","eu_gunnii","eu_blackjack","eu_silverdrop","eu_lemon","eucalyptus"]);
const hasFlower = p => !NO_FLOWER.has(p.id);
const AUTO_KEY = "plant-auto-photos-v1";
const AUTO_TTL = 14 * DAY;
let autoCache = {};
try { autoCache = JSON.parse(localStorage.getItem(AUTO_KEY)) || {}; } catch (e) {}
let autoBlocked = false;
const autoPending = {};
// 학명에서 품종명(따옴표)·괄호·spp. 를 떼고 종 이름만 써요
function searchName(p) {
  let n = (p.sci || "").split("'")[0].replace(/×/g, " ").replace(/\([^)]*\)/g, "").replace(/\bspp?\.?/g, "").replace(/\b(var|subsp|f)\.\s*\S+/g, "").replace(/등$/, "").replace(/\s+/g, " ").trim();
  return n.split(" ").slice(0, 3).join(" ");
}
let inflight = 0; const waiters = [];
async function limited(fn) {
  while (inflight >= 2) await new Promise(r => waiters.push(r));
  inflight++;
  try { return await fn(); } finally { inflight--; waiters.shift()?.(); }
}
const getJSON = url => limited(async () => {
  const r = await fetch(url);
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
});
const medium = u => u ? u.replace(/\/(square|small|thumb)\./, "/medium.") : null;
async function obsPhotos(taxonId, extra) {
  const d = await getJSON(`https://api.inaturalist.org/v1/observations?taxon_id=${taxonId}&photos=true&quality_grade=research&order_by=votes&per_page=6${extra}`);
  return (d.results || []).map(o => medium(o.photos?.[0]?.url)).filter(Boolean);
}
async function fetchAuto(p) {
  const name = searchName(p);
  if (!name || /[가-힣]/.test(name)) return { whole: [], flower: [], leaf: [] };
  const found = await getJSON(`https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(name)}&per_page=1`);
  const t = found.results?.[0];
  if (!t) return { whole: [], flower: [], leaf: [] };
  const detail = await getJSON(`https://api.inaturalist.org/v1/taxa/${t.id}`);
  const tp = (detail.results?.[0]?.taxon_photos || []).map(x => medium(x.photo?.medium_url || x.photo?.url)).filter(Boolean);
  const whole = (tp.length ? tp : [medium(t.default_photo?.medium_url)]).filter(Boolean).slice(0, 2);
  // 꽃: 개화 중(Plant Phenology = Flowering), 잎: 초록 잎(Leaves = Green Leaves)으로 표시된 관찰 사진
  const flower = hasFlower(p) ? (await obsPhotos(t.id, "&term_id=12&term_value_id=13").catch(() => [])).filter(u => !whole.includes(u)).slice(0, 2) : [];
  let leaf = (await obsPhotos(t.id, "&term_id=36&term_value_id=38").catch(() => [])).filter(u => !whole.includes(u) && !flower.includes(u)).slice(0, 2);
  if (leaf.length < 2) leaf = leaf.concat(tp.slice(2).filter(u => !leaf.includes(u))).slice(0, 2);
  return { whole, flower, leaf, taxon: t.name };
}
// GitHub에 올린 버전은 photos/ 폴더에 미리 받아둔 사진을 먼저 써요 (GitHub Actions가 채워요)
let bundled = null;
const bundledReady = fetch("photos/index.json").then(r => r.ok ? r.json() : null).then(j => { bundled = j; }).catch(() => {});
async function autoPhotos(p) {
  await bundledReady;
  const b = bundled?.plants?.[p.id];
  if (b) { const fix = a => (a || []).map(f => "photos/" + f); return { whole: fix(b.whole), flower: fix(b.flower), leaf: fix(b.leaf), taxon: b.taxon }; }
  return remotePhotos(p);
}
function remotePhotos(p) {
  const c = autoCache[p.id];
  if (c && Date.now() - c.t < AUTO_TTL) return Promise.resolve(c);
  if (autoBlocked) return Promise.resolve(null);
  if (!autoPending[p.id]) autoPending[p.id] = fetchAuto(p).then(r => {
    autoCache[p.id] = { ...r, t: Date.now() };
    try { localStorage.setItem(AUTO_KEY, JSON.stringify(autoCache)); } catch (e) {}
    return autoCache[p.id];
  }).catch(e => { if (e instanceof TypeError) autoBlocked = true; delete autoPending[p.id]; return null; });
  return autoPending[p.id];
}
// 화면에 보이는 사진 칸만 불러와요 (숨긴 사진은 크기가 없어서 감싼 칸을 지켜봐요)

// 사진은 긴 변 1000px JPEG로 줄여서 저장해요
async function shrinkImage(file, max = 1000, q = 0.82) {
  const src = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("이미지를 읽지 못했어요")); i.src = src; });
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

  const m = state.mine.find(x => x.uid === uid);
  const old = entryId && m.journal.find(e => e.id === entryId);
  const e = old ? { ...old, photos: [...(old.photos || [])] } : { id: Date.now().toString(36), date: todayStr(), text: "", photos: [] };
  const added = [];   // 이번에 새로 올린 사진 (취소하면 지워요)
  const removed = []; // 이번에 뺀 사진 (저장하면 지워요)
  const MAX = 6;
  const draw = s => {
    s.querySelector("#j-photos").innerHTML = e.photos.map((k, i) => `<div class="slot"><span class="slot-btn"><img data-photo="${k}" hidden alt=""></span><button class="slot-x" data-rm="${i}" aria-label="사진 빼기">✕</button></div>`).join("")
      + (e.photos.length < MAX ? `<div class="slot"><button class="slot-btn" id="j-add"><span>+ 사진</span></button></div>` : "");
    fillPhotos(s);
    s.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { removed.push(...e.photos.splice(+b.dataset.rm, 1)); draw(s); });
    const add = s.querySelector("#j-add");
    if (add) add.onclick = async () => {
      const files = (await pickFile(true)).slice(0, MAX - e.photos.length);
      for (const f of files) {
        try { const k = await savePhoto(`${uid}_j_${e.id}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`, f); e.photos.push(k); added.push(k); }
        catch (err) { toast("사진을 저장하지 못했어요.", 3000); break; }
      }
      draw(s);
    };
  };
  sheet(`<h2>${old ? "일지 고치기" : "일지 쓰기"}</h2><div class="sci">${esc(m.nick || BY_ID[m.plantId].name)}</div>
    <div style="height:12px"></div>
    <div class="field"><label for="j-date">날짜</label><input id="j-date" type="date" value="${e.date}" max="${todayStr()}"></div>
    <div class="field"><label for="j-text">내용</label><textarea id="j-text" rows="5" maxlength="2000" placeholder="예: 새잎이 두 장 나왔어요. 분갈이를 했어요.">${esc(e.text)}</textarea></div>
    <div class="field"><label>사진 (최대 ${MAX}장)</label><div class="photo-row j" id="j-photos"></div></div>
    <div class="row"><button class="ghost" id="j-cancel">취소</button><button class="primary" id="j-save">저장</button></div>
    ${old ? `<button class="danger" id="j-del">이 일지 삭제</button>` : ""}`,
    (s, close) => {
      draw(s);
      const back = () => { close(); openMine(uid); };
      s.querySelector("#j-cancel").onclick = () => { added.forEach(dropPhoto); back(); };
      s.querySelector("#j-save").onclick = () => {
        e.date = s.querySelector("#j-date").value || todayStr();
        e.text = s.querySelector("#j-text").value.trim();
        if (!e.text && !e.photos.length) { toast("내용이나 사진을 넣어 주세요"); return; }
        removed.forEach(dropPhoto);
        m.journal = m.journal.filter(x => x.id !== e.id).concat(e);
        delete m.example; save(); back(); toast("일지를 저장했어요");
      };
      const del = s.querySelector("#j-del");
      if (del) del.onclick = () => {
        if (del.dataset.confirm) { [...(old.photos || []), ...added].forEach(dropPhoto); m.journal = m.journal.filter(x => x.id !== e.id); save(); back(); toast("일지를 삭제했어요"); }
        else { del.dataset.confirm = "1"; del.textContent = "한 번 더 누르면 삭제돼요"; }
      };
    });
}

function renderSettings() {
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  const permText = { granted: "켜져 있어요", denied: "브라우저에서 차단돼 있어요. 브라우저 설정에서 이 사이트의 알림을 허용해 주세요.", default: "아직 허용하지 않았어요", unsupported: "이 화면에서는 시스템 알림을 쓸 수 없어요. 앱을 열면 화면 위쪽에 알려드려요." }[perm];
  $("#view").innerHTML = `
    <div class="setting"><h2>알림 시간</h2><p>물 줄 날이 되면 이 시간에 알려드려요.</p>
      <div class="field"><label for="s-time">매일 확인할 시간</label><input id="s-time" type="time" value="${state.alarmTime}"></div></div>
    <div class="setting"><h2>휴대폰 알림</h2><p>${permText}</p>
      ${perm === "default" ? `<button class="primary" id="s-perm">알림 허용하기</button>` : ""}
      <button class="ghost" id="s-test" style="margin-top:8px">테스트 알림 보내기</button></div>
    <div class="setting"><h2>물 주기 기준</h2><p>12~2월에는 식물이 천천히 자라서 겨울 간격으로 자동으로 늘려요. 식물마다 간격을 직접 바꿀 수도 있어요. 흙을 손가락으로 2~3cm 눌러보고 말랐을 때 주는 게 가장 정확해요.</p></div>
    <div class="setting"><h2>추위 경고</h2><p>11~3월에는 최저 온도가 10℃ 이상인, 추위에 약한 식물을 내 식물 화면 위쪽에서 알려드려요. 최저 온도는 화분에서 키울 때를 기준으로 한 대략적인 값이에요.</p></div>`;
  $("#s-time").onchange = e => { state.alarmTime = e.target.value || "09:00"; state.notified = {}; save(); toast(`매일 ${state.alarmTime}에 확인할게요`); };
  const pb = $("#s-perm");
  if (pb) pb.onclick = async () => { try { await Notification.requestPermission(); } catch (e) {} renderSettings(); };
  $("#s-test").onclick = () => notify("식물노트", "테스트 알림이에요. 물 줄 날이 되면 이렇게 알려드려요.");
}

// ── 알림 ──
async function notify(title, body) {
  let shown = false;
  try {
    if ("Notification" in window && Notification.permission === "granted") {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) await reg.showNotification(title, { body, icon: "icon.svg", tag: "water" });
      else new Notification(title, { body });
      shown = true;
    }
  } catch (e) {}
  if (!shown) toast(body, 5000);
}

function checkAlarm() {
  const t = todayStr();
  const now = new Date();
  const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (hm < state.alarmTime || state.notified[t]) return;
  const due = state.mine.filter(m => daysLeft(m) <= 0);
  state.notified = { [t]: true }; save();
  if (!due.length) return;
  const names = due.map(m => m.nick || BY_ID[m.plantId].name);
  notify("물 줄 시간이에요 💧", `${names.slice(0, 3).join(", ")}${names.length > 3 ? ` 외 ${names.length - 3}개` : ""}에 물을 주세요.`);
}

let toastTimer;
function toast(msg, ms = 2600) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.role = "status"; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), ms);
}

function setTab(t) { tab = t; render(); window.scrollTo(0, 0); }
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#title").textContent = { home: "내 식물", find: "식물 찾기", wish: "위시리스트", settings: "알림 설정" }[tab];
  $("#today").textContent = fmt(todayStr());
  ({ home: renderHome, find: renderFind, wish: renderWish, settings: renderSettings })[tab]();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));

try { if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
render();
checkAlarm();
setInterval(() => { checkAlarm(); if (tab === "home") renderHome(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkAlarm(); render(); } });
</script>
