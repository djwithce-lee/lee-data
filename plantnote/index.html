  { id:"ls_hakuro", name:"무늬개키버들 (삼색버드나무)", alias:["삼색버드나무", "하쿠로니시키", "Hakuro-nishiki", "조경수"], sci:"Salix integra 'Hakuro-nishiki'", cat:"foliage", tree:true, light:3, amount:3, days:3, winter:14, temp:"10~30℃", min:-25, pet:false, care:"새잎이 분홍·흰·초록으로 나오는 관목형 버드나무예요. 봄에 강하게 잘라 주면 새잎이 예뻐요. 물가를 좋아해 흙이 마르지 않게 자주 주세요. 아주 빨리 자라고 추위에 강해요.", habitat:"원예 품종 (원종은 한국·일본)", size:"m" },
  { id:"ls_yonggbeodl", name:"용버들", alias:["용버들", "Dragon Willow", "조경수"], sci:"Salix matsudana 'Tortuosa'", cat:"foliage", tree:true, light:3, amount:3, days:3, winter:14, temp:"10~30℃", min:-25, pet:false, care:"가지가 용처럼 구불구불 꼬여 꽃꽂이 소재로도 써요. 물가를 좋아해 흙이 마르지 않게 자주 주세요. 아주 빨리 자라고 추위에 강해요.", habitat:"원예 품종 (원종은 중국)" },
  { id:"ls_albizia", name:"자귀나무", alias:["자귀나무", "Silk Tree", "조경수"], sci:"Albizia julibrissin", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"여름에 분홍 실 같은 꽃이 피고, 밤엔 잎을 접고 자요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"서아시아~한국·일본" },
  { id:"ls_mogwa", name:"모과나무", alias:["모과", "Chinese Quince", "조경수"], sci:"Pseudocydonia sinensis", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"얼룩무늬 줄기와 향기로운 노란 열매가 달려요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"중국" },
  { id:"ls_byeok", name:"벽오동", alias:["벽오동", "Chinese Parasol Tree", "조경수"], sci:"Firmiana simplex", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"초록 줄기와 큰 잎이 시원한 나무예요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"중국 남부·대만" },
  { id:"ls_hambak", name:"함박꽃나무 (산목련)", alias:["함박꽃나무", "산목련", "Oyama Magnolia", "조경수"], sci:"Magnolia sieboldii", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"초여름에 향기로운 흰 꽃이 아래를 보고 펴요. 북한의 국화예요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국·일본·중국 산지" },
  { id:"ls_nogak", name:"노각나무", alias:["노각나무", "Korean Stewartia", "조경수"], sci:"Stewartia pseudocamellia", cat:"flower", tree:true, light:3, amount:2, days:4, winter:20, temp:"10~30℃", min:-20, pet:false, care:"얼룩덜룩한 매끈한 줄기와 동백 같은 흰 꽃이 예뻐요. 땅에 심으면 뿌리가 자리 잡은 뒤(1~2년)엔 비가 없을 때만 흠뻑 주면 돼요. 화분이면 겉흙이 마르면 흠뻑 주고, 겨울엔 잎이 지고 쉬니 흙이 얼어붙지 않을 만큼만 가끔 줘요. 가지치기는 잎이 진 늦겨울에 해요.", habitat:"한국 남부·일본" },
  { id:"ls_gwang", name:"광나무", alias:["광나무", "Japanese Privet", "조경수"], sci:"Ligustrum japonicum", cat:"flower", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"광택 있는 잎의 상록수로 울타리에 많이 써요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 남부·일본·대만" },
  { id:"ls_hubak", name:"후박나무", alias:["후박나무", "조경수"], sci:"Machilus thunbergii", cat:"foliage", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"두껍고 광택 있는 잎의 큰 상록수예요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 남해안·제주·일본" },
  { id:"ls_noknam", name:"녹나무", alias:["녹나무", "Camphor Tree", "조경수"], sci:"Cinnamomum camphora", cat:"foliage", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"잎을 비비면 장뇌 향이 나는 큰 상록수예요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 제주·일본·중국 남부" },
  { id:"ls_meon", name:"먼나무", alias:["먼나무", "Kurogane Holly", "조경수"], sci:"Ilex rotunda", cat:"flower", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"겨울에 빨간 열매가 나무 가득 달려 제주 가로수로 유명해요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 제주·남해안·일본" },
  { id:"ls_gasi", name:"가시나무", alias:["가시나무", "Bamboo-leaf Oak", "조경수"], sci:"Quercus myrsinifolia", cat:"foliage", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"도토리가 열리는 상록 참나무예요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 남부·일본·중국" },
  { id:"ls_gulgeori", name:"굴거리나무", alias:["굴거리", "조경수"], sci:"Daphniphyllum macropodum", cat:"foliage", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"붉은 잎자루와 큰 잎이 늘어지는 상록수예요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 남부·일본·중국" },
  { id:"ls_awae", name:"아왜나무", alias:["아왜나무", "Sweet Viburnum", "조경수"], sci:"Viburnum odoratissimum var. awabukii", cat:"flower", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"두꺼운 잎이 불에 강해 방화수로 심고 빨간 열매가 달려요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 제주·일본" },
  { id:"ls_dajeong", name:"다정큼나무", alias:["다정큼", "Indian Hawthorn", "조경수"], sci:"Rhaphiolepis indica var. umbellata", cat:"flower", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"둥근 잎과 봄의 흰 꽃, 검은 열매의 작은 상록 관목이에요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 남해안·일본", size:"m" },
  { id:"ls_oleander", name:"협죽도", alias:["협죽도", "유도화", "Oleander", "조경수"], sci:"Nerium oleander", cat:"flower", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:true, care:"여름 내내 분홍·흰 꽃이 피지만 잎·가지 모두 독성이 매우 강해요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"지중해~서아시아" },
  { id:"ls_hwangchil", name:"황칠나무", alias:["황칠나무", "Korean Dendropanax", "조경수"], sci:"Dendropanax morbiferus", cat:"foliage", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"수액으로 황금빛 칠을 만드는 우리 특산 상록수예요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 남해안·제주" },
  { id:"ls_fatsia", name:"팔손이", alias:["팔손이", "Fatsia", "조경수"], sci:"Fatsia japonica", cat:"flower", tree:true, light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:-7, pet:false, care:"손바닥처럼 갈라진 큰 잎의 상록 관목으로 그늘에 강해 실내에서도 키워요. 남부 지방(제주·남해안)에서 정원수로 많이 심는 상록수예요. 중부 지방에서는 화분에 키워 겨울에 베란다로 들이세요. 겉흙이 마르면 흠뻑 줘요.", habitat:"한국 남해안·일본", size:"m" },
  { id:"ls_gaebija", name:"개비자나무", alias:["개비자", "Japanese Plum Yew", "조경수"], sci:"Cephalotaxus harringtonia", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:14, temp:"5~28℃", min:-25, pet:false, care:"그늘에 강한 상록 침엽 관목이에요. 햇빛과 바람이 잘 드는 곳이 좋아요. 겉흙이 마르면 흠뻑 주고, 실내에 오래 두면 속잎이 말라요. 겨울은 바깥에서 나요.", habitat:"한국·일본", size:"m" },
  { id:"ls_sasa", name:"조릿대", alias:["조릿대", "Sasa", "조경수"], sci:"Sasa borealis", cat:"foliage", tree:true, light:2, amount:3, days:3, winter:10, temp:"10~30℃", min:-15, pet:false, care:"키 작은 대나무로 숲 바닥이나 정원 지피용으로 써요. 물을 좋아해서 흙이 마르지 않게 주세요. 땅속줄기로 아주 잘 퍼지니 정원에 심을 땐 뿌리막이를 둘러 주세요.", habitat:"한국·일본", size:"m" },
  { id:"ls_wangdae", name:"왕대 (대나무)", alias:["대나무", "왕대", "Bamboo", "조경수"], sci:"Phyllostachys reticulata", cat:"foliage", tree:true, light:2, amount:3, days:3, winter:10, temp:"10~30℃", min:-15, pet:false, care:"크게 자라는 대표 대나무예요. 물을 좋아해서 흙이 마르지 않게 주세요. 땅속줄기로 아주 잘 퍼지니 정원에 심을 땐 뿌리막이를 둘러 주세요.", habitat:"중국 (한국 남부 재배)" },
  { id:"ls_ojuk", name:"오죽", alias:["오죽", "검은대나무", "Black Bamboo", "조경수"], sci:"Phyllostachys nigra", cat:"foliage", tree:true, light:2, amount:3, days:3, winter:10, temp:"10~30℃", min:-15, pet:false, care:"줄기가 검게 변하는 관상용 대나무예요. 물을 좋아해서 흙이 마르지 않게 주세요. 땅속줄기로 아주 잘 퍼지니 정원에 심을 땐 뿌리막이를 둘러 주세요.", habitat:"중국 (한국 강릉 오죽헌 등 재배)" },
  { id:"ls_hwasal", name:"화살나무", alias:["화살나무", "Burning Bush", "조경수"], sci:"Euonymus alatus", cat:"foliage", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"가지에 화살 깃 같은 날개가 있고 가을에 새빨갛게 물들어요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국·일본·중국", size:"m" },
  { id:"ls_jakssal", name:"좀작살나무", alias:["좀작살", "Beautyberry", "조경수"], sci:"Callicarpa dichotoma", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"가을에 보라색 구슬 열매가 가지마다 달려요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국·일본·중국", size:"m" },
  { id:"ls_naksang", name:"낙상홍", alias:["낙상홍", "Japanese Winterberry", "조경수"], sci:"Ilex serrata", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"잎이 진 겨울에도 빨간 열매가 가득 남아 있어요. 암나무에만 열매가 달려요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"일본·중국", size:"m" },
  { id:"ls_sancheol", name:"산철쭉", alias:["산철쭉", "Korean Azalea", "조경수"], sci:"Rhododendron yedoense f. poukhanense", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"연보라·분홍 꽃이 피는 우리 산 철쭉으로 공원에 무리지어 심어요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국·일본", size:"m" },
  { id:"ls_mokhyuk", name:"목수국 (나무수국)", alias:["목수국", "나무수국", "Pee Gee Hydrangea", "조경수"], sci:"Hydrangea paniculata 'Grandiflora'", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"원뿔형 흰 꽃이 늦여름에 피어 점점 분홍빛으로 변해요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"원예 품종 (원종은 한국·일본·중국)", size:"m" },
  { id:"ls_redbud", name:"박태기나무", alias:["박태기", "Chinese Redbud", "조경수"], sci:"Cercis chinensis", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"이른 봄 잎보다 먼저 진분홍 꽃이 가지에 다닥다닥 붙어 펴요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"중국", size:"m" },
  { id:"ls_myeongja", name:"명자나무 (산당화)", alias:["명자나무", "산당화", "Flowering Quince", "조경수"], sci:"Chaenomeles speciosa", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"이른 봄에 진홍·분홍·흰 꽃이 피고 향기로운 열매가 달려요. 가시가 있어요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"중국", size:"m" },
  { id:"ls_hwangmae", name:"황매화", alias:["황매화", "겹황매화", "Kerria", "조경수"], sci:"Kerria japonica", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"봄에 노란 꽃이 피고 초록 줄기가 겨울에도 예뻐요. 그늘에도 강해요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"중국·일본", size:"m" },
  { id:"ls_byeongkkot", name:"병꽃나무", alias:["병꽃나무", "웨이겔라", "Weigela", "조경수"], sci:"Weigela subsessilis", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"병 모양 꽃이 노랑에서 붉게 변하는 우리 자생 관목이에요. 원예종 웨이겔라도 많아요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국 산지 (한국 특산)", size:"m" },
  { id:"ls_miseon", name:"미선나무", alias:["미선나무", "White Forsythia", "조경수"], sci:"Abeliophyllum distichum", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"이른 봄 개나리처럼 흰 꽃이 피고 향이 좋아요. 세계에 하나뿐인 한국 특산 속이에요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국 충북·전북 (한국 특산)", size:"m" },
  { id:"ls_maeja", name:"매자나무", alias:["매자나무", "자엽매자", "Barberry", "조경수"], sci:"Berberis thunbergii 'Atropurpurea'", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"자주색 잎과 가을의 빨간 열매가 예쁜 가시 관목이에요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"원예 품종 (원종은 일본)", size:"m" },
  { id:"ls_malbaldo", name:"말발도리", alias:["말발도리", "Deutzia", "조경수"], sci:"Deutzia parviflora", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"초여름에 작은 흰 꽃이 소복이 피어요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국·중국 동북부", size:"m" },
  { id:"ls_saenggang", name:"생강나무", alias:["생강나무", "Spicebush", "조경수"], sci:"Lindera obtusiloba", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"이른 봄 노란 꽃이 피고 가지를 꺾으면 생강 냄새가 나요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국·일본·중국", size:"m" },
  { id:"ls_hieori", name:"히어리", alias:["히어리", "Korean Winter Hazel", "조경수"], sci:"Corylopsis coreana", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"이른 봄 연노랑 꽃이 주렁주렁 늘어지는 한국 특산 관목이에요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국 남부·지리산 (한국 특산)", size:"m" },
  { id:"ls_witchhazel", name:"풍년화", alias:["풍년화", "Witch Hazel", "조경수"], sci:"Hamamelis japonica", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"늦겨울에 노란 리본 같은 꽃이 가지마다 피어요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"일본", size:"m" },
  { id:"ls_bulduhwa", name:"불두화", alias:["불두화", "Snowball Bush", "조경수"], sci:"Viburnum opulus f. hydrangeoides", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"부처님 머리처럼 둥근 흰 꽃송이가 5월에 피어요. 열매는 달리지 않아요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"원예 품종 (원종은 한국·동아시아)", size:"m" },
  { id:"ls_baekdang", name:"백당나무", alias:["백당나무", "Guelder Rose", "조경수"], sci:"Viburnum opulus var. calvescens", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"가장자리에 큰 흰 꽃이 둘러 피고 가을에 빨간 열매가 달려요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국·일본·중국", size:"m" },
  { id:"ls_deolkkwong", name:"덜꿩나무", alias:["덜꿩나무", "Viburnum", "조경수"], sci:"Viburnum erosum", cat:"flower", tree:true, light:3, amount:2, days:4, winter:14, temp:"10~30℃", min:-20, pet:false, care:"작은 흰 꽃이 모여 피고 붉은 열매가 달려요. 햇빛이 잘 드는 곳에서 겉흙이 마르면 흠뻑 주세요. 추위에 강해 겨울은 바깥에서 나요. 꽃이 지고 바로 가지치기를 해야 다음 해 꽃눈이 남아요.", habitat:"한국·일본·중국", size:"m" },
  // ── 야생화·정원 꽃 ──
  { id:"wf_natdal", name:"낮달맞이꽃", alias:["낮달맞이", "노랑낮달맞이", "야생화"], sci:"Oenothera fruticosa", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"낮에 노란 꽃이 피는 달맞이꽃으로 화단에 무리 지어 심어요. 번식력이 좋아요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"북아메리카 동부 (한국 화단에 널리 심음)", family:"Onagraceae", familyKo:"바늘꽃과", size:"s", propagation:["div", "seed"] },
  { id:"wf_pinknatdal", name:"분홍낮달맞이꽃", alias:["분홍낮달맞이", "Pink Evening Primrose", "야생화"], sci:"Oenothera speciosa", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"분홍 컵 모양 꽃이 낮에 피고 땅속줄기로 잘 퍼져요. 건조에 강해요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"미국 남부·멕시코 초원", family:"Onagraceae", familyKo:"바늘꽃과", size:"s", propagation:["div", "seed"] },
  { id:"wf_dalmaji", name:"달맞이꽃", alias:["달맞이꽃", "Evening Primrose", "야생화"], sci:"Oenothera biennis", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"저녁에 노란 꽃이 피었다가 아침에 시드는 두해살이 꽃이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"북아메리카 (한국 들판에 귀화)", family:"Onagraceae", familyKo:"바늘꽃과", size:"m", propagation:["seed"] },
  { id:"wf_geumnang", name:"금낭화", alias:["금낭화", "며느리주머니", "Bleeding Heart", "야생화"], sci:"Lamprocapnos spectabilis", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:true, care:"분홍 하트 모양 꽃이 줄기에 주렁주렁 매달려요. 여름이면 잎이 지고 쉬어요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·중국 동북부 산지", family:"Papaveraceae", familyKo:"양귀비과", size:"m", propagation:["div", "seed"] },
  { id:"wf_halmi", name:"할미꽃", alias:["할미꽃", "Korean Pasque Flower", "야생화"], sci:"Pulsatilla koreana", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:true, care:"솜털 덮인 자주 꽃이 고개 숙여 피고, 꽃이 지면 흰 털 열매가 할머니 머리처럼 돼요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"한국 전국 양지바른 무덤가·풀밭", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"s", propagation:["seed"] },
  { id:"wf_donggang", name:"동강할미꽃", alias:["동강할미꽃", "야생화"], sci:"Pulsatilla tongkangensis", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:true, care:"하늘을 보고 피는 연보라 꽃이 아름다운 한국 특산 할미꽃이에요. 석회암 절벽에서 자라요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"한국 강원 동강 석회암 절벽 (한국 특산)", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"s", propagation:["seed"] },
  { id:"wf_maebal", name:"매발톱", alias:["매발톱", "Columbine", "야생화"], sci:"Aquilegia buergeriana var. oxysepala", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:true, care:"꽃 뒤쪽 꿀주머니가 매 발톱처럼 휘어진 꽃이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국 동북부 산지", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"m", propagation:["seed"] },
  { id:"wf_hanulmaebal", name:"하늘매발톱", alias:["하늘매발톱", "Fan Columbine", "야생화"], sci:"Aquilegia flabellata var. pumila", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:true, care:"파란·흰 꽃이 피는 키 작은 고산 매발톱이에요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"한국 북부·일본 고산", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"s", propagation:["seed"] },
  { id:"wf_aengcho", name:"앵초", alias:["앵초", "Primrose", "야생화"], sci:"Primula sieboldii", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"봄에 분홍 꽃이 모여 피는 물가 숲의 야생화예요. 여름엔 잎이 지기도 해요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·일본·중국 동북부 냇가 숲", family:"Primulaceae", familyKo:"앵초과", size:"s", propagation:["div", "seed"] },
  { id:"wf_norugwi", name:"노루귀", alias:["노루귀", "Hepatica", "야생화"], sci:"Hepatica asiatica", cat:"flower", light:2, amount:2, days:3, winter:14, temp:"5~22℃", min:-25, pet:false, care:"눈 녹을 무렵 솜털 꽃대에 흰·분홍·보라 꽃이 펴요. 잎이 노루 귀처럼 털이 나요. 이른 봄에 꽃 피고 초여름이면 잎이 지는 봄 야생화예요. 꽃 필 때는 흙이 마르지 않게, 잎이 진 뒤에도 흙이 완전히 마르지 않게 그늘에 두세요. 겨울 추위를 꼭 겪어야 해요.", habitat:"한국·중국 동북부 숲", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"s", propagation:["div", "seed"] },
  { id:"wf_boksucho", name:"복수초", alias:["복수초", "얼음새꽃", "Amur Adonis", "야생화"], sci:"Adonis amurensis", cat:"flower", light:2, amount:2, days:3, winter:14, temp:"5~22℃", min:-25, pet:true, care:"눈 속에서 노란 꽃이 피는 가장 이른 봄꽃이에요. 이른 봄에 꽃 피고 초여름이면 잎이 지는 봄 야생화예요. 꽃 필 때는 흙이 마르지 않게, 잎이 진 뒤에도 흙이 완전히 마르지 않게 그늘에 두세요. 겨울 추위를 꼭 겪어야 해요.", habitat:"한국·중국 동북부·러시아 동부 숲", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"s", propagation:["div", "seed"] },
  { id:"wf_byeonsan", name:"변산바람꽃", alias:["변산바람꽃", "야생화"], sci:"Eranthis byunsanensis", cat:"flower", light:2, amount:2, days:3, winter:14, temp:"5~22℃", min:-25, pet:true, care:"2~3월에 흰 꽃이 피는 한국 특산 바람꽃이에요. 이른 봄에 꽃 피고 초여름이면 잎이 지는 봄 야생화예요. 꽃 필 때는 흙이 마르지 않게, 잎이 진 뒤에도 흙이 완전히 마르지 않게 그늘에 두세요. 겨울 추위를 꼭 겪어야 해요.", habitat:"한국 변산반도 등 (한국 특산)", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"s", propagation:["seed"] },
  { id:"wf_eolleji", name:"얼레지", alias:["얼레지", "Dogtooth Violet", "야생화"], sci:"Erythronium japonicum", cat:"flower", light:2, amount:2, days:3, winter:14, temp:"5~22℃", min:-25, pet:false, care:"얼룩무늬 잎 사이로 꽃잎이 뒤로 젖혀진 보라 꽃이 펴요. 씨앗에서 꽃까지 7년쯤 걸려요. 이른 봄에 꽃 피고 초여름이면 잎이 지는 봄 야생화예요. 꽃 필 때는 흙이 마르지 않게, 잎이 진 뒤에도 흙이 완전히 마르지 않게 그늘에 두세요. 겨울 추위를 꼭 겪어야 해요.", habitat:"한국·일본·중국 동북부 산지 숲", family:"Liliaceae", familyKo:"백합과", size:"s", propagation:["seed", "bulb"] },
  { id:"wf_kkaengkkaeng", name:"깽깽이풀", alias:["깽깽이풀", "야생화"], sci:"Plagiorhegma dubium", cat:"flower", light:2, amount:2, days:3, winter:14, temp:"5~22℃", min:-25, pet:false, care:"연한 보라 꽃이 잎보다 먼저 피는 귀한 야생화예요. 이른 봄에 꽃 피고 초여름이면 잎이 지는 봄 야생화예요. 꽃 필 때는 흙이 마르지 않게, 잎이 진 뒤에도 흙이 완전히 마르지 않게 그늘에 두세요. 겨울 추위를 꼭 겪어야 해요.", habitat:"한국·중국 동북부 숲", family:"Berberidaceae", familyKo:"매자나무과", size:"s", propagation:["div", "seed"] },
  { id:"wf_eunbang", name:"은방울꽃", alias:["은방울꽃", "Lily of the Valley", "야생화"], sci:"Convallaria majalis var. keiskei", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:true, care:"종 모양 흰 꽃이 향기로워요. 식물 전체에 독성이 강해요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·일본·중국 숲", family:"Asparagaceae", familyKo:"비짜루과", size:"s", propagation:["div", "seed"] },
  { id:"wf_dunggulle", name:"둥굴레", alias:["둥굴레", "Solomon's Seal", "야생화"], sci:"Polygonatum odoratum", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"휘어진 줄기 아래로 흰 종 꽃이 매달리고, 뿌리줄기로 차를 끓여요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·중국·일본 숲", family:"Asparagaceae", familyKo:"비짜루과", size:"m", propagation:["div"] },
  { id:"wf_bibichu", name:"비비추", alias:["비비추", "호스타", "Hosta", "야생화"], sci:"Hosta longipes", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:true, care:"넓은 잎과 연보라 꽃대가 예쁜 그늘 정원의 대표 식물이에요. 무늬 품종이 아주 많아요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·일본 산지", family:"Asparagaceae", familyKo:"비짜루과", size:"m", propagation:["div"] },
  { id:"wf_okjam", name:"옥잠화", alias:["옥잠화", "Fragrant Hosta", "야생화"], sci:"Hosta plantaginea", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:true, care:"저녁에 향기로운 흰 꽃이 피는 비비추 무리예요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"중국", family:"Asparagaceae", familyKo:"비짜루과", size:"m", propagation:["div"] },
  { id:"wf_wonchuri", name:"원추리", alias:["원추리", "Daylily", "야생화"], sci:"Hemerocallis fulva", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:true, care:"주황 나리꽃 같은 꽃이 하루씩 피고 지며 여름 내내 펴요. 아주 튼튼해요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국·일본", family:"Asphodelaceae", familyKo:"아스포델루스과", size:"m", propagation:["div"] },
  { id:"wf_seomchorong", name:"섬초롱꽃", alias:["섬초롱꽃", "Korean Bellflower", "야생화"], sci:"Campanula takesimana", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"종 모양 연보라 꽃이 고개 숙여 피는 울릉도 특산 초롱꽃이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국 울릉도 (한국 특산)", family:"Campanulaceae", familyKo:"초롱꽃과", size:"m", propagation:["div", "seed"] },
  { id:"wf_geumgang", name:"금강초롱꽃", alias:["금강초롱꽃", "야생화"], sci:"Hanabusaya asiatica", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"보라 초롱 같은 꽃이 피는 한국 특산 속의 귀한 꽃이에요. 서늘한 고산을 좋아해요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국 금강산·설악산 등 고산 (한국 특산)", family:"Campanulaceae", familyKo:"초롱꽃과", size:"s", propagation:["seed"] },
  { id:"wf_doraji", name:"도라지", alias:["도라지", "Balloon Flower", "야생화"], sci:"Platycodon grandiflorus", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"풍선 같은 꽃봉오리가 터지며 보라·흰 별꽃이 펴요. 뿌리를 나물로 먹어요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국·일본 산과 들", family:"Campanulaceae", familyKo:"초롱꽃과", size:"m", propagation:["seed"] },
  { id:"wf_butkkot", name:"붓꽃", alias:["붓꽃", "Iris", "야생화"], sci:"Iris sanguinea", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:true, care:"붓 모양 봉오리에서 보라 꽃이 펴요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·일본·중국 동북부 풀밭", family:"Iridaceae", familyKo:"붓꽃과", size:"m", propagation:["div"] },
  { id:"wf_kkotchang", name:"꽃창포", alias:["꽃창포", "Japanese Iris", "야생화"], sci:"Iris ensata", cat:"flower", light:3, amount:3, days:2, winter:10, temp:"10~28℃", min:-20, pet:true, care:"물가에서 크고 화려한 보라 꽃이 펴요. 물가에서 자라는 식물이라 흙이 늘 촉촉해야 해요. 받침에 물을 조금 채워 두어도 좋아요.", habitat:"한국·일본·중국 습지", family:"Iridaceae", familyKo:"붓꽃과", size:"m", propagation:["div"] },
  { id:"wf_yellowiris", name:"노랑꽃창포", alias:["노랑꽃창포", "Yellow Flag", "야생화"], sci:"Iris pseudacorus", cat:"flower", light:3, amount:3, days:2, winter:10, temp:"10~28℃", min:-20, pet:true, care:"노란 꽃이 피는 물가 붓꽃으로 연못에 많이 심어요. 물가에서 자라는 식물이라 흙이 늘 촉촉해야 해요. 받침에 물을 조금 채워 두어도 좋아요.", habitat:"유럽·서아시아 습지", family:"Iridaceae", familyKo:"붓꽃과", size:"m", propagation:["div"] },
  { id:"wf_beombuchae", name:"범부채", alias:["범부채", "Blackberry Lily", "야생화"], sci:"Iris domestica", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:true, care:"주황 꽃에 범 무늬 점이 있고 잎이 부채처럼 퍼져요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국·일본 산지", family:"Iridaceae", familyKo:"붓꽃과", size:"m", propagation:["div", "seed"] },
  { id:"wf_gujeolcho", name:"구절초", alias:["구절초", "야생화"], sci:"Chrysanthemum zawadskii", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"가을에 흰·연분홍 들국화가 펴요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국·러시아 산지", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "cut"] },
  { id:"wf_beolgae", name:"벌개미취", alias:["벌개미취", "Korean Aster", "야생화"], sci:"Aster koraiensis", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"여름~가을에 연보라 들국화가 오래 피는 한국 특산 꽃이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국 (한국 특산)", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "seed"] },
  { id:"wf_ssukbu", name:"쑥부쟁이", alias:["쑥부쟁이", "야생화"], sci:"Aster yomena", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"가을에 연보라 들국화가 피는 들꽃이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·일본·중국", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "seed"] },
  { id:"wf_haeguk", name:"해국", alias:["해국", "Seaside Aster", "야생화"], sci:"Aster spathulifolius", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:false, care:"바닷가 바위에서 늦가을 연보라 꽃이 피고 잎이 두툼해요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"한국·일본 해안 바위", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["cut", "seed"] },
  { id:"wf_sanguk", name:"산국", alias:["산국", "감국", "야생화"], sci:"Chrysanthemum indicum", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"가을에 작은 노란 들국화가 향기롭게 펴요. 꽃차로도 써요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국·일본", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "cut"] },
  { id:"wf_yongdam", name:"용담", alias:["용담", "Gentian", "야생화"], sci:"Gentiana scabra", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"가을에 파란 종 모양 꽃이 펴요. 뿌리는 아주 써서 약재로 써요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·일본·중국 산지 풀밭", family:"Gentianaceae", familyKo:"용담과", size:"s", propagation:["div", "seed"] },
  { id:"wf_tugu", name:"투구꽃", alias:["투구꽃", "Monkshood", "야생화"], sci:"Aconitum jaluense", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:true, care:"투구 모양 보라 꽃이 피지만 식물 전체에 맹독이 있어요. 만진 뒤 손을 씻으세요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·중국 동북부 산지", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"m", propagation:["div", "seed"] },
  { id:"wf_kkwong", name:"금꿩의다리", alias:["금꿩의다리", "Meadow Rue", "야생화"], sci:"Thalictrum rochebrunianum", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:true, care:"보라 꽃잎에 노란 수술이 안개처럼 피는 키 큰 꽃이에요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·일본 산지", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"l", propagation:["div", "seed"] },
  { id:"wf_kkwongbi", name:"큰꿩의비름", alias:["큰꿩의비름", "세덤 스펙타빌레", "Showy Stonecrop", "야생화"], sci:"Hylotelephium spectabile", cat:"flower", light:3, amount:1, days:6, winter:20, temp:"5~30℃", min:-25, pet:false, care:"늦여름 분홍 꽃이 우산처럼 모여 피는 다육질 꽃이에요. 다육질 잎에 물을 저장해 건조에 아주 강해요. 흙이 마르면 주고, 추위에도 강해 바깥에서 겨울을 나요.", habitat:"한국·중국 동북부", family:"Crassulaceae", familyKo:"돌나물과", size:"m", propagation:["cut", "div"] },
  { id:"wf_girincho", name:"기린초", alias:["기린초", "야생화"], sci:"Phedimus kamtschaticus", cat:"flower", light:3, amount:1, days:6, winter:20, temp:"5~30℃", min:-25, pet:false, care:"초여름 노란 별꽃이 피는 다육질 야생화예요. 다육질 잎에 물을 저장해 건조에 아주 강해요. 흙이 마르면 주고, 추위에도 강해 바깥에서 겨울을 나요.", habitat:"한국·중국·러시아 동부 바위", family:"Crassulaceae", familyKo:"돌나물과", size:"s", propagation:["cut", "div"] },
  { id:"wf_dolnamul", name:"돌나물", alias:["돌나물", "Stringy Stonecrop", "야생화"], sci:"Sedum sarmentosum", cat:"flower", light:3, amount:1, days:6, winter:20, temp:"5~30℃", min:-25, pet:false, care:"땅을 기며 퍼지고 노란 별꽃이 펴요. 봄 순을 나물로 먹어요. 다육질 잎에 물을 저장해 건조에 아주 강해요. 흙이 마르면 주고, 추위에도 강해 바깥에서 겨울을 나요.", habitat:"한국·중국·일본", family:"Crassulaceae", familyKo:"돌나물과", size:"s", propagation:["cut", "div"] },
  { id:"wf_bawisol", name:"바위솔", alias:["바위솔", "와송", "Rock Pine", "야생화"], sci:"Orostachys japonica", cat:"flower", light:3, amount:1, days:6, winter:20, temp:"5~30℃", min:-25, pet:false, care:"기와나 바위 위에서 솔방울 같은 로제트로 자라고 꽃대가 올라오면 그 포기는 죽어요. 다육질 잎에 물을 저장해 건조에 아주 강해요. 흙이 마르면 주고, 추위에도 강해 바깥에서 겨울을 나요.", habitat:"한국·일본·중국 바위", family:"Crassulaceae", familyKo:"돌나물과", size:"s", propagation:["pup", "seed"] },
  { id:"wf_somdari", name:"솜다리 (한국 에델바이스)", alias:["솜다리", "에델바이스", "Korean Edelweiss", "야생화"], sci:"Leontopodium coreanum", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:false, care:"흰 솜털 꽃이 피는 고산 식물로 더위에 아주 약해요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"한국 설악산·한라산 고산 바위", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["div", "seed"] },
  { id:"wf_dongja", name:"동자꽃", alias:["동자꽃", "야생화"], sci:"Lychnis cognata", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"주황 꽃잎 가장자리가 갈라진 여름 산꽃이에요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·중국 동북부 산지", family:"Caryophyllaceae", familyKo:"석죽과", size:"m", propagation:["div", "seed"] },
  { id:"wf_paengi", name:"패랭이꽃", alias:["패랭이꽃", "Chinese Pink", "야생화"], sci:"Dianthus chinensis", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:false, care:"분홍 꽃잎 끝이 톱니처럼 갈라진 우리 들꽃이에요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"한국·중국 풀밭", family:"Caryophyllaceae", familyKo:"석죽과", size:"s", propagation:["seed", "cut"] },
  { id:"wf_sulpaeng", name:"술패랭이꽃", alias:["술패랭이", "Fringed Pink", "야생화"], sci:"Dianthus superbus", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"꽃잎이 실처럼 잘게 갈라진 향기로운 패랭이꽃이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"유럽·아시아 산지 풀밭", family:"Caryophyllaceae", familyKo:"석죽과", size:"s", propagation:["seed", "cut"] },
  { id:"wf_teolmeowi", name:"털머위", alias:["털머위", "Leopard Plant", "야생화"], sci:"Farfugium japonicum", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:true, care:"광택 있는 둥근 잎과 늦가을 노란 꽃이 피는 상록 여러해살이예요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국 남해안·제주·일본", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div"] },
  { id:"wf_maekmun", name:"맥문동", alias:["맥문동", "Lilyturf", "야생화"], sci:"Liriope muscari", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"가는 잎이 사철 푸르고 여름에 보라 꽃대가 서요. 그늘 지피식물로 최고예요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·중국·일본 숲", family:"Asparagaceae", familyKo:"비짜루과", size:"s", propagation:["div"] },
  { id:"wf_suhocho", name:"수호초", alias:["수호초", "Japanese Spurge", "야생화"], sci:"Pachysandra terminalis", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"그늘에서 땅을 덮는 상록 지피식물이에요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"일본·중국", family:"Buxaceae", familyKo:"회양목과", size:"s", propagation:["div", "cut"] },
  { id:"wf_sangsa", name:"상사화", alias:["상사화", "Magic Lily", "야생화"], sci:"Lycoris squamigera", cat:"flower", light:3, amount:2, days:3, winter:21, temp:"15~30℃", min:-15, pet:true, care:"봄에 잎이 지고 난 뒤 늦여름 꽃대만 올라와 분홍 꽃이 펴요. 잎과 꽃이 만나지 못해요. 봄에 알뿌리를 심으면 여름~가을에 꽃이 펴요. 자라는 동안 겉흙이 마르면 흠뻑 주고, 잎이 지면 물을 줄여요.", habitat:"중국 (한국 사찰에 오래 재배)", family:"Amaryllidaceae", familyKo:"수선화과", size:"m", propagation:["bulb"] },
  { id:"wf_kkotmureut", name:"꽃무릇 (석산)", alias:["꽃무릇", "석산", "Red Spider Lily", "야생화"], sci:"Lycoris radiata", cat:"flower", light:3, amount:2, days:3, winter:21, temp:"15~30℃", min:-15, pet:true, care:"9월에 빨간 꽃이 불꽃처럼 피고 꽃이 진 뒤 잎이 나와요. 봄에 알뿌리를 심으면 여름~가을에 꽃이 펴요. 자라는 동안 겉흙이 마르면 흠뻑 주고, 잎이 지면 물을 줄여요.", habitat:"중국·일본 (한국 사찰에 재배)", family:"Amaryllidaceae", familyKo:"수선화과", size:"m", propagation:["bulb"] },
  { id:"wf_chamnari", name:"참나리", alias:["참나리", "Tiger Lily", "야생화"], sci:"Lilium lancifolium", cat:"flower", light:3, amount:2, days:3, winter:21, temp:"15~30℃", min:-15, pet:true, care:"주황 꽃에 검은 점이 있고, 잎겨드랑이의 검은 구슬눈(주아)으로 늘어나요. 봄에 알뿌리를 심으면 여름~가을에 꽃이 펴요. 자라는 동안 겉흙이 마르면 흠뻑 주고, 잎이 지면 물을 줄여요.", habitat:"한국·중국·일본", family:"Liliaceae", familyKo:"백합과", size:"m", propagation:["bulb", "pup"] },
  { id:"wf_hanulmal", name:"하늘말나리", alias:["하늘말나리", "야생화"], sci:"Lilium tsingtauense", cat:"flower", light:3, amount:2, days:3, winter:21, temp:"15~30℃", min:-15, pet:true, care:"하늘을 보고 피는 주황 나리꽃이에요. 봄에 알뿌리를 심으면 여름~가을에 꽃이 펴요. 자라는 동안 겉흙이 마르면 흠뻑 주고, 잎이 지면 물을 줄여요.", habitat:"한국·중국 산지", family:"Liliaceae", familyKo:"백합과", size:"m", propagation:["bulb", "seed"] },
  { id:"wf_solnari", name:"솔나리", alias:["솔나리", "야생화"], sci:"Lilium cernuum", cat:"flower", light:3, amount:2, days:3, winter:21, temp:"15~30℃", min:-15, pet:true, care:"솔잎 같은 가는 잎에 분홍 꽃이 고개 숙여 펴요. 봄에 알뿌리를 심으면 여름~가을에 꽃이 펴요. 자라는 동안 겉흙이 마르면 흠뻑 주고, 잎이 지면 물을 줄여요.", habitat:"한국·중국 동북부 고산", family:"Liliaceae", familyKo:"백합과", size:"s", propagation:["bulb", "seed"] },
  { id:"wf_jebi", name:"제비꽃", alias:["제비꽃", "오랑캐꽃", "Violet", "야생화"], sci:"Viola mandshurica", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"봄에 보라 꽃이 피는 가장 친근한 들꽃이에요. 씨앗이 튀어 잘 퍼져요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국·일본", family:"Violaceae", familyKo:"제비꽃과", size:"s", propagation:["seed", "div"] },
  { id:"wf_namsanjebi", name:"남산제비꽃", alias:["남산제비꽃", "야생화"], sci:"Viola albida var. chaerophylloides", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"잘게 갈라진 잎에 향기로운 흰 꽃이 펴요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·중국 동북부", family:"Violaceae", familyKo:"제비꽃과", size:"s", propagation:["seed", "div"] },
  { id:"wf_hinmindeulle", name:"흰민들레", alias:["흰민들레", "토종민들레", "야생화"], sci:"Taraxacum coreanum", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"흰 꽃이 피는 토종 민들레예요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국 (한국 자생)", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["seed"] },
  { id:"wf_eonggeongqui", name:"엉겅퀴", alias:["엉겅퀴", "Thistle", "야생화"], sci:"Cirsium japonicum", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"가시 돋은 잎에 진분홍 꽃이 피어요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·일본·중국", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["seed"] },
  { id:"wf_kkulpul", name:"꿀풀 (하고초)", alias:["꿀풀", "하고초", "Self-heal", "야생화"], sci:"Prunella vulgaris subsp. asiatica", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"보라 꽃 이삭에 꿀이 많아 벌이 좋아해요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국·일본", family:"Lamiaceae", familyKo:"꿀풀과", size:"s", propagation:["div", "seed"] },
  { id:"wf_baecho", name:"배초향 (방아)", alias:["배초향", "방아", "Korean Mint", "야생화"], sci:"Agastache rugosa", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"보라 꽃 이삭이 피고 잎에서 향이 나 매운탕에 넣어요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·중국·일본", family:"Lamiaceae", familyKo:"꿀풀과", size:"m", propagation:["seed", "div"] },
  { id:"wf_noruojum", name:"노루오줌", alias:["노루오줌", "아스틸베", "Astilbe", "야생화"], sci:"Astilbe chinensis", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"분홍 깃털 같은 꽃 이삭이 물가 숲에서 펴요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"한국·중국·일본", family:"Saxifragaceae", familyKo:"범의귀과", size:"m", propagation:["div"] },
  { id:"wf_bucheo", name:"부처꽃", alias:["부처꽃", "Purple Loosestrife", "야생화"], sci:"Lythrum salicaria", cat:"flower", light:3, amount:3, days:2, winter:10, temp:"10~28℃", min:-20, pet:false, care:"물가에서 진분홍 꽃 이삭이 길게 펴요. 물가에서 자라는 식물이라 흙이 늘 촉촉해야 해요. 받침에 물을 조금 채워 두어도 좋아요.", habitat:"유럽·아시아 습지", family:"Lythraceae", familyKo:"부처꽃과", size:"m", propagation:["div", "seed"] },
  { id:"wf_mulbong", name:"물봉선", alias:["물봉선", "Touch-me-not", "야생화"], sci:"Impatiens textorii", cat:"flower", light:3, amount:3, days:2, winter:10, temp:"10~28℃", min:-20, pet:false, care:"물가에서 진분홍 꽃이 매달리고 익은 열매를 만지면 톡 터져요. 물가에서 자라는 식물이라 흙이 늘 촉촉해야 해요. 받침에 물을 조금 채워 두어도 좋아요.", habitat:"한국·일본·중국 냇가", family:"Balsaminaceae", familyKo:"봉선화과", size:"m", propagation:["seed"] },
  { id:"wf_pinamul", name:"피나물", alias:["피나물", "야생화"], sci:"Hylomecon vernalis", cat:"flower", light:2, amount:2, days:3, winter:14, temp:"5~22℃", min:-25, pet:true, care:"봄 숲에 노란 꽃이 무리 지어 펴요. 줄기를 자르면 붉은 즙이 나와요. 이른 봄에 꽃 피고 초여름이면 잎이 지는 봄 야생화예요. 꽃 필 때는 흙이 마르지 않게, 잎이 진 뒤에도 흙이 완전히 마르지 않게 그늘에 두세요. 겨울 추위를 꼭 겪어야 해요.", habitat:"한국·중국 동북부 숲", family:"Papaveraceae", familyKo:"양귀비과", size:"s", propagation:["div", "seed"] },
  { id:"wf_dongui", name:"동의나물", alias:["동의나물", "Marsh Marigold", "야생화"], sci:"Caltha palustris", cat:"flower", light:3, amount:3, days:2, winter:10, temp:"10~28℃", min:-20, pet:true, care:"습지에서 봄에 노란 꽃이 피고 둥근 잎이 윤기 나요. 물가에서 자라는 식물이라 흙이 늘 촉촉해야 해요. 받침에 물을 조금 채워 두어도 좋아요.", habitat:"북반구 온대 습지", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"s", propagation:["div", "seed"] },
  { id:"wf_bokjumeoni", name:"복주머니란 (개불알꽃)", alias:["복주머니란", "개불알꽃", "Lady's Slipper", "야생화"], sci:"Cypripedium macranthos", cat:"flower", light:2, amount:2, days:5, winter:14, temp:"5~28℃", min:-5, pet:false, care:"주머니 모양 분홍 꽃이 피는 귀한 자생 난초예요. 멸종위기종이라 인공 증식 개체만 키워요. 땅에서 자라는 난초예요. 난석·마사 위주의 물 빠짐 좋은 흙에 심고, 겉흙이 마르면 흠뻑 주세요. 반그늘이 좋고 겨울엔 서늘하게(0~10℃) 쉬어야 꽃눈이 생겨요.", habitat:"한국·중국 동북부·일본 산지", family:"Orchidaceae", familyKo:"난초과", size:"s", propagation:["div"] },
  { id:"wf_jaran", name:"자란", alias:["자란", "Chinese Ground Orchid", "야생화"], sci:"Bletilla striata", cat:"flower", light:2, amount:2, days:5, winter:14, temp:"5~28℃", min:-5, pet:false, care:"자주 꽃이 피는 튼튼한 땅난초로 남부 지방은 화단에서도 자라요. 땅에서 자라는 난초예요. 난석·마사 위주의 물 빠짐 좋은 흙에 심고, 겉흙이 마르면 흠뻑 주세요. 반그늘이 좋고 겨울엔 서늘하게(0~10℃) 쉬어야 꽃눈이 생겨요.", habitat:"한국 남부·중국·일본", family:"Orchidaceae", familyKo:"난초과", size:"s", propagation:["div", "bulb"] },
  { id:"wf_saewoo", name:"새우난초", alias:["새우난초", "Calanthe", "야생화"], sci:"Calanthe discolor", cat:"flower", light:2, amount:2, days:5, winter:14, temp:"5~28℃", min:-5, pet:false, care:"뿌리가 새우 등처럼 마디진 땅난초로 봄에 꽃대가 서요. 땅에서 자라는 난초예요. 난석·마사 위주의 물 빠짐 좋은 흙에 심고, 겉흙이 마르면 흠뻑 주세요. 반그늘이 좋고 겨울엔 서늘하게(0~10℃) 쉬어야 꽃눈이 생겨요.", habitat:"한국 남부·일본", family:"Orchidaceae", familyKo:"난초과", size:"s", propagation:["div"] },
  { id:"wf_tarae", name:"타래난초", alias:["타래난초", "Ladies' Tresses", "야생화"], sci:"Spiranthes sinensis", cat:"flower", light:2, amount:2, days:5, winter:14, temp:"5~28℃", min:-5, pet:false, care:"분홍 작은 꽃이 꽈배기처럼 돌며 올라가요. 땅에서 자라는 난초예요. 난석·마사 위주의 물 빠짐 좋은 흙에 심고, 겉흙이 마르면 흠뻑 주세요. 반그늘이 좋고 겨울엔 서늘하게(0~10℃) 쉬어야 꽃눈이 생겨요.", habitat:"아시아·호주 풀밭", family:"Orchidaceae", familyKo:"난초과", size:"s", propagation:["div"] },
  { id:"wf_chunran", name:"춘란", alias:["춘란", "보춘화", "Spring Orchid", "야생화"], sci:"Cymbidium goeringii", cat:"flower", light:2, amount:2, days:5, winter:14, temp:"5~28℃", min:-5, pet:false, care:"이른 봄 은은한 향의 연두 꽃이 피는 한국 대표 난초예요. 잎 무늬·꽃 색 품종이 아주 많아요. 땅에서 자라는 난초예요. 난석·마사 위주의 물 빠짐 좋은 흙에 심고, 겉흙이 마르면 흠뻑 주세요. 반그늘이 좋고 겨울엔 서늘하게(0~10℃) 쉬어야 꽃눈이 생겨요.", habitat:"한국 남부·중국·일본 숲", family:"Orchidaceae", familyKo:"난초과", size:"s", propagation:["div"] },
  { id:"wf_hanran", name:"한란", alias:["한란", "Cold-growing Cymbidium", "야생화"], sci:"Cymbidium kanran", cat:"flower", light:2, amount:2, days:5, winter:14, temp:"5~28℃", min:-5, pet:false, care:"늦가을~겨울에 향기로운 꽃이 피는 제주 자생 난초예요. 땅에서 자라는 난초예요. 난석·마사 위주의 물 빠짐 좋은 흙에 심고, 겉흙이 마르면 흠뻑 주세요. 반그늘이 좋고 겨울엔 서늘하게(0~10℃) 쉬어야 꽃눈이 생겨요.", habitat:"한국 제주·일본·중국 남부", family:"Orchidaceae", familyKo:"난초과", size:"s", propagation:["div"] },
  { id:"wf_pungran", name:"풍란", alias:["풍란", "부귀란", "Neofinetia", "야생화"], sci:"Vanda falcata", cat:"flower", light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:0, pet:false, care:"여름 밤 흰 꽃에서 진한 향이 나는 작은 난초로 나무나 돌에 붙여 키워요. 나무나 바위에 붙어 사는 난초예요. 수태나 나무판에 붙여 키우고, 뿌리가 하얗게 마르면 흠뻑 주세요. 바람이 잘 통해야 해요.", habitat:"한국 남해안 섬·일본", family:"Orchidaceae", familyKo:"난초과", size:"s", propagation:["div"] },
  { id:"wf_seokgok", name:"석곡", alias:["석곡", "Dendrobium Moniliforme", "야생화"], sci:"Dendrobium moniliforme", cat:"flower", light:2, amount:2, days:4, winter:10, temp:"10~30℃", min:0, pet:false, care:"마디진 줄기에 흰·분홍 꽃이 피는 바위 난초예요. 나무나 바위에 붙어 사는 난초예요. 수태나 나무판에 붙여 키우고, 뿌리가 하얗게 마르면 흠뻑 주세요. 바람이 잘 통해야 해요.", habitat:"한국 남해안·일본·중국", family:"Orchidaceae", familyKo:"난초과", size:"s", propagation:["div", "keiki"] },
  { id:"wf_chunggot", name:"층꽃나무", alias:["층꽃나무", "Bluebeard", "야생화"], sci:"Caryopteris incana", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:false, care:"가을에 보라 꽃이 층층이 피는 작은 관목이에요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"한국 남부·일본·중국", family:"Lamiaceae", familyKo:"꿀풀과", size:"m", propagation:["cut", "seed"] },
  { id:"wf_beolnorang", name:"벌노랑이", alias:["벌노랑이", "Bird's-foot Trefoil", "야생화"], sci:"Lotus corniculatus var. japonicus", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"노란 작은 콩꽃이 땅에 붙어 피어요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"한국·일본·중국 풀밭", family:"Fabaceae", familyKo:"콩과", size:"s", propagation:["seed"] },
  { id:"wf_daisy", name:"데이지", alias:["데이지", "잉글리시데이지", "Daisy", "야생화"], sci:"Bellis perennis", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:false, care:"흰·분홍 작은 국화가 이른 봄에 피어요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"유럽 풀밭", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["seed"] },
  { id:"wf_shasta", name:"샤스타데이지", alias:["샤스타데이지", "Shasta Daisy", "야생화"], sci:"Leucanthemum × superbum", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"큼직한 흰 데이지가 초여름에 무리 지어 펴요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"원예 교배종 (원종은 유럽)", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "seed"] },
  { id:"wf_rudbeckia", name:"루드베키아", alias:["루드베키아", "블랙아이드수잔", "Black-eyed Susan", "야생화"], sci:"Rudbeckia hirta", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"노란 꽃잎에 검은 가운데가 있는 여름꽃이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"북아메리카 초원", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "seed"] },
  { id:"wf_echinacea", name:"에키네시아", alias:["에키네시아", "Purple Coneflower", "야생화"], sci:"Echinacea purpurea", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"분홍 꽃잎이 아래로 처지고 가운데가 솟은 여름꽃이에요. 건조에 강해요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"북아메리카 동부 초원", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "seed"] },
  { id:"wf_gaillardia", name:"가일라르디아 (천인국)", alias:["천인국", "가일라르디아", "Blanket Flower", "야생화"], sci:"Gaillardia × grandiflora", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"빨강·노랑 테두리 꽃이 여름 내내 피고 더위·건조에 강해요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"원예 교배종 (원종은 북아메리카 초원)", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["div", "seed"] },
  { id:"wf_coreopsis", name:"큰금계국", alias:["금계국", "큰금계국", "Coreopsis", "야생화"], sci:"Coreopsis lanceolata", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"노란 꽃이 초여름 길가를 덮어요. 번식력이 아주 강해요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"북아메리카 (한국에 귀화)", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "seed"] },
  { id:"wf_achillea", name:"서양톱풀 (아킬레아)", alias:["톱풀", "아킬레아", "Yarrow", "야생화"], sci:"Achillea millefolium", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"깃털 잎에 작은 꽃이 접시처럼 모여 펴요. 색 품종이 많아요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"유럽·아시아·북아메리카 풀밭", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "seed"] },
  { id:"wf_newaster", name:"뉴잉글랜드 아스터", alias:["아스터", "New England Aster", "야생화"], sci:"Symphyotrichum novae-angliae", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"가을에 보라 들국화가 키 크게 무리 지어 펴요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"북아메리카 동부", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["div", "seed"] },
  { id:"wf_cosmos", name:"코스모스", alias:["코스모스", "Cosmos", "야생화"], sci:"Cosmos bipinnatus", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"15~30℃", min:5, pet:false, care:"가을 길가의 분홍·흰 꽃이에요. 거름이 적어야 꽃이 많아요. 한해살이 꽃이에요. 봄(4~5월)에 씨앗을 뿌리거나 모종을 심고, 겉흙이 마르면 흠뻑 주세요. 시든 꽃을 따 주면 꽃이 더 오래 펴요.", habitat:"멕시코 고원", family:"Asteraceae", familyKo:"국화과", size:"l", propagation:["seed"] },
  { id:"wf_sunflower", name:"해바라기", alias:["해바라기", "Sunflower", "야생화"], sci:"Helianthus annuus", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"15~30℃", min:5, pet:false, care:"큰 노란 꽃이 해를 따라가요. 미니 품종도 있어요. 한해살이 꽃이에요. 봄(4~5월)에 씨앗을 뿌리거나 모종을 심고, 겉흙이 마르면 흠뻑 주세요. 시든 꽃을 따 주면 꽃이 더 오래 펴요.", habitat:"북아메리카", family:"Asteraceae", familyKo:"국화과", size:"l", propagation:["seed"] },
  { id:"wf_cornflower", name:"수레국화", alias:["수레국화", "Cornflower", "야생화"], sci:"Centaurea cyanus", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:false, care:"파란 꽃이 들판을 수놓는 유럽 들꽃이에요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"유럽 밀밭", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["seed"] },
  { id:"wf_zinnia", name:"백일홍", alias:["백일홍", "지니아", "Zinnia", "야생화"], sci:"Zinnia elegans", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"15~30℃", min:5, pet:false, care:"여름부터 가을까지 백 일 동안 피는 화려한 꽃이에요. 한해살이 꽃이에요. 봄(4~5월)에 씨앗을 뿌리거나 모종을 심고, 겉흙이 마르면 흠뻑 주세요. 시든 꽃을 따 주면 꽃이 더 오래 펴요.", habitat:"멕시코", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["seed"] },
  { id:"wf_marigold", name:"메리골드", alias:["메리골드", "마리골드", "만수국", "Marigold", "야생화"], sci:"Tagetes patula", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"15~30℃", min:5, pet:false, care:"주황·노랑 꽃이 오래 피고 해충을 쫓는 동반식물로 써요. 한해살이 꽃이에요. 봄(4~5월)에 씨앗을 뿌리거나 모종을 심고, 겉흙이 마르면 흠뻑 주세요. 시든 꽃을 따 주면 꽃이 더 오래 펴요.", habitat:"멕시코·과테말라", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["seed"] },
  { id:"wf_calendula", name:"금잔화 (카렌듈라)", alias:["금잔화", "카렌듈라", "Pot Marigold", "야생화"], sci:"Calendula officinalis", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:false, care:"주황 꽃을 차나 오일로 써요. 서늘할 때 잘 펴요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"지중해 연안", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["seed"] },
  { id:"wf_gerbera", name:"거베라", alias:["거베라", "Gerbera", "야생화"], sci:"Gerbera jamesonii", cat:"flower", light:3, amount:2, days:3, winter:7, temp:"15~28℃", min:5, pet:false, care:"선명한 큰 데이지 꽃이 피는 화분 꽃이에요. 겉흙이 마르면 흠뻑 주고, 시든 꽃은 바로 따 주세요. 추위에 약해 겨울엔 실내 밝은 창가로 들여요.", habitat:"남아프리카", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["div", "seed"] },
  { id:"wf_gwakkot", name:"과꽃", alias:["과꽃", "China Aster", "야생화"], sci:"Callistephus chinensis", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"15~30℃", min:5, pet:false, care:"가을에 보라·분홍·흰 꽃이 피는 옛 정원 꽃이에요. 한해살이 꽃이에요. 봄(4~5월)에 씨앗을 뿌리거나 모종을 심고, 겉흙이 마르면 흠뻑 주세요. 시든 꽃을 따 주면 꽃이 더 오래 펴요.", habitat:"한국 북부·중국", family:"Asteraceae", familyKo:"국화과", size:"m", propagation:["seed"] },
  { id:"wf_poppy", name:"개양귀비 (꽃양귀비)", alias:["개양귀비", "꽃양귀비", "Corn Poppy", "야생화"], sci:"Papaver rhoeas", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:true, care:"얇은 빨간 꽃잎이 바람에 하늘거려요. 옮겨 심기를 싫어해 씨앗을 바로 뿌려요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"유럽·서아시아·북아프리카 밀밭", family:"Papaveraceae", familyKo:"양귀비과", size:"m", propagation:["seed"] },
  { id:"wf_calipoppy", name:"캘리포니아포피", alias:["캘리포니아포피", "금영화", "California Poppy", "야생화"], sci:"Eschscholzia californica", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:false, care:"주황 컵 모양 꽃이 해가 날 때만 펴요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"미국 캘리포니아 초원", family:"Papaveraceae", familyKo:"양귀비과", size:"s", propagation:["seed"] },
  { id:"wf_lupine", name:"루피너스", alias:["루피너스", "Lupine", "야생화"], sci:"Lupinus polyphyllus", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:true, care:"탑 모양 꽃 이삭이 색색으로 피어요. 더위에 약해요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"북아메리카 서부", family:"Fabaceae", familyKo:"콩과", size:"m", propagation:["seed"] },
  { id:"wf_bluebonnet", name:"블루보닛", alias:["블루보닛", "Texas Bluebonnet", "야생화"], sci:"Lupinus texensis", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:true, care:"텍사스 들판을 파랗게 덮는 작은 루피너스예요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"미국 텍사스", family:"Fabaceae", familyKo:"콩과", size:"s", propagation:["seed"] },
  { id:"wf_sweetpea", name:"스위트피", alias:["스위트피", "Sweet Pea", "야생화"], sci:"Lathyrus odoratus", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:true, care:"향기로운 나비 모양 꽃이 덩굴로 펴요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"이탈리아 시칠리아", family:"Fabaceae", familyKo:"콩과", size:"m", propagation:["seed"] },
  { id:"wf_digitalis", name:"디기탈리스", alias:["디기탈리스", "폭스글러브", "Foxglove", "야생화"], sci:"Digitalis purpurea", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:true, care:"종 모양 꽃이 탑처럼 층층이 피지만 독성이 아주 강해요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"유럽 서부", family:"Plantaginaceae", familyKo:"질경이과", size:"l", propagation:["seed"] },
  { id:"wf_veronica", name:"베로니카", alias:["베로니카", "꼬리풀", "Speedwell", "야생화"], sci:"Veronica spicata", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"보라·분홍 꽃 이삭이 꼿꼿하게 서요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"유럽·아시아", family:"Plantaginaceae", familyKo:"질경이과", size:"s", propagation:["div", "seed"] },
  { id:"wf_salvianem", name:"살비아 네모로사", alias:["네모로사", "Woodland Sage", "야생화"], sci:"Salvia nemorosa", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"보라 꽃 이삭이 초여름에 가득 피고, 잘라 주면 다시 펴요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"유럽 중부~서아시아", family:"Lamiaceae", familyKo:"꿀풀과", size:"m", propagation:["div", "seed"] },
  { id:"wf_catmint", name:"캣민트", alias:["캣민트", "네페타", "Catmint", "야생화"], sci:"Nepeta × faassenii", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"회녹색 잎에 연보라 꽃이 구름처럼 펴요. 고양이가 좋아해요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"원예 교배종 (원종은 코카서스)", family:"Lamiaceae", familyKo:"꿀풀과", size:"s", propagation:["div", "seed"] },
  { id:"wf_verbena", name:"버베나 보나리엔시스", alias:["버베나", "숙근버베나", "Purpletop Vervain", "야생화"], sci:"Verbena bonariensis", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"가는 줄기 끝에 보라 꽃이 공중에 떠 있는 듯 펴요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"남아메리카 (브라질·아르헨티나)", family:"Verbenaceae", familyKo:"마편초과", size:"l", propagation:["seed", "cut"] },
  { id:"wf_gaura", name:"가우라 (홍접초)", alias:["가우라", "홍접초", "백접초", "Gaura", "야생화"], sci:"Oenothera lindheimeri", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"나비 같은 흰·분홍 꽃이 긴 꽃대에서 하늘거려요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"미국 텍사스·루이지애나", family:"Onagraceae", familyKo:"바늘꽃과", size:"m", propagation:["div", "seed"] },
  { id:"wf_phlox", name:"플록스", alias:["플록스", "풀협죽도", "Garden Phlox", "야생화"], sci:"Phlox paniculata", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"여름에 향기로운 꽃송이가 피는 화단 꽃이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"북아메리카 동부", family:"Polemoniaceae", familyKo:"꽃고비과", size:"m", propagation:["div", "cut"] },
  { id:"wf_kkotjandi", name:"꽃잔디", alias:["꽃잔디", "지면패랭이", "Moss Phlox", "야생화"], sci:"Phlox subulata", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:false, care:"봄에 분홍·흰·보라 꽃이 땅을 카펫처럼 덮어요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"북아메리카 동부", family:"Polemoniaceae", familyKo:"꽃고비과", size:"s", propagation:["cut", "div"] },
  { id:"wf_columbine", name:"서양매발톱", alias:["서양매발톱", "Columbine", "야생화"], sci:"Aquilegia vulgaris", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:true, care:"색이 다양한 원예 매발톱이에요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"유럽", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"m", propagation:["seed"] },
  { id:"wf_anemone", name:"아네모네", alias:["아네모네", "Anemone", "야생화"], sci:"Anemone coronaria", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:true, care:"빨강·보라·흰 꽃잎에 검은 가운데가 선명해요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"지중해 연안", family:"Ranunculaceae", familyKo:"미나리아재비과", size:"s", propagation:["bulb"] },
  { id:"wf_edelweiss", name:"에델바이스", alias:["알프스 에델바이스", "Edelweiss", "야생화"], sci:"Leontopodium nivale subsp. alpinum", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:false, care:"별 모양 흰 솜털 꽃이 피는 알프스의 꽃이에요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"유럽 알프스 고산", family:"Asteraceae", familyKo:"국화과", size:"s", propagation:["div", "seed"] },
  { id:"wf_alpgentian", name:"알프스 용담", alias:["아카울리스", "Stemless Gentian", "야생화"], sci:"Gentiana acaulis", cat:"flower", light:3, amount:1, days:5, winter:20, temp:"5~25℃", min:-25, pet:false, care:"땅 가까이 진한 파란 나팔꽃이 펴요. 바위틈에서 자라는 식물이라 마사·자갈을 섞은 물 빠짐 좋은 흙에 심고, 흙이 마르면 주세요. 더위와 과습에 약해요.", habitat:"유럽 알프스·피레네 고산", family:"Gentianaceae", familyKo:"용담과", size:"s", propagation:["div", "seed"] },
  { id:"wf_primrose", name:"프림로즈", alias:["프림로즈", "Primrose", "야생화"], sci:"Primula vulgaris", cat:"flower", light:1, amount:2, days:3, winter:14, temp:"8~25℃", min:-20, pet:false, care:"이른 봄 연노랑 꽃이 피는 유럽 앵초예요. 숲 바닥에서 자라는 야생화라 반그늘에 낙엽 섞인 촉촉한 흙을 좋아해요. 겉흙이 마르면 주고, 한여름 땡볕과 더위는 피해 주세요. 겨울은 바깥 추위를 겪어야 봄에 잘 올라와요.", habitat:"유럽 서부 숲", family:"Primulaceae", familyKo:"앵초과", size:"s", propagation:["div", "seed"] },
  { id:"wf_polyanthus", name:"폴리안서스 (서양앵초)", alias:["서양앵초", "폴리안서스", "프리뮬러", "야생화"], sci:"Primula × polyantha", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:false, care:"겨울~봄 화분 꽃으로 색이 아주 다양해요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"원예 교배종 (원종은 유럽)", family:"Primulaceae", familyKo:"앵초과", size:"s", propagation:["div", "seed"] },
  { id:"wf_forgetmenot", name:"물망초", alias:["물망초", "Forget-me-not", "야생화"], sci:"Myosotis sylvatica", cat:"flower", light:3, amount:2, days:2, winter:7, temp:"5~22℃", min:-5, pet:false, care:"작은 하늘색 꽃이 봄에 무리 지어 펴요. 서늘한 날씨를 좋아하는 꽃이에요. 가을이나 이른 봄에 씨앗을 뿌리고, 겉흙이 마르면 주세요. 한여름 더위엔 지쳐요.", habitat:"유럽 숲", family:"Boraginaceae", familyKo:"지치과", size:"s", propagation:["seed"] },
  { id:"wf_bluebell", name:"블루벨", alias:["블루벨", "English Bluebell", "야생화"], sci:"Hyacinthoides non-scripta", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:true, care:"봄 숲 바닥을 파랗게 덮는 종 모양 꽃이에요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"영국·유럽 서부 숲", family:"Asparagaceae", familyKo:"비짜루과", size:"s", propagation:["bulb"] },
  { id:"wf_snowdrop", name:"스노드롭", alias:["스노드롭", "설강화", "Snowdrop", "야생화"], sci:"Galanthus nivalis", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:true, care:"늦겨울 눈 속에서 흰 꽃이 고개 숙여 펴요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"유럽 중남부 숲", family:"Amaryllidaceae", familyKo:"수선화과", size:"s", propagation:["bulb"] },
  { id:"wf_crocus", name:"크로커스", alias:["크로커스", "Crocus", "야생화"], sci:"Crocus vernus", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:true, care:"이른 봄 땅에서 바로 보라·흰·노랑 컵 꽃이 펴요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"유럽 알프스·피레네", family:"Iridaceae", familyKo:"붓꽃과", size:"s", propagation:["bulb"] },
  { id:"wf_muscari", name:"무스카리", alias:["무스카리", "Grape Hyacinth", "야생화"], sci:"Muscari armeniacum", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:true, care:"포도송이 같은 파란 꽃이 봄에 펴요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"터키·코카서스", family:"Asparagaceae", familyKo:"비짜루과", size:"s", propagation:["bulb"] },
  { id:"wf_daffodil", name:"수선화", alias:["수선화", "Daffodil", "야생화"], sci:"Narcissus pseudonarcissus", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:true, care:"봄에 노란 나팔 꽃이 펴요. 알뿌리는 독성이 있어요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"유럽 서부", family:"Amaryllidaceae", familyKo:"수선화과", size:"s", propagation:["bulb"] },
  { id:"wf_tulip", name:"튤립", alias:["튤립", "Tulip", "야생화"], sci:"Tulipa gesneriana", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:true, care:"봄의 대표 알뿌리 꽃으로 색과 모양이 아주 다양해요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"원예종 (원종은 중앙아시아 산지)", family:"Liliaceae", familyKo:"백합과", size:"s", propagation:["bulb"] },
  { id:"wf_hyacinth", name:"히아신스", alias:["히아신스", "Hyacinth", "야생화"], sci:"Hyacinthus orientalis", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:true, care:"향기가 진한 꽃 이삭이 봄에 펴요. 물병에 알뿌리를 올려 수경재배도 해요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"터키·시리아·레바논", family:"Asparagaceae", familyKo:"비짜루과", size:"s", propagation:["bulb"] },
  { id:"wf_freesia", name:"프리지아", alias:["프리지아", "Freesia", "야생화"], sci:"Freesia × hybrida", cat:"flower", light:3, amount:2, days:4, winter:21, temp:"5~22℃", min:-15, pet:false, care:"향기로운 깔때기 꽃이 한쪽으로 늘어서 펴요. 추위에 약해 화분에서 키워요. 가을에 알뿌리를 심어 겨울 추위를 겪게 하면 봄에 꽃이 펴요. 꽃이 지고 잎이 누렇게 될 때까지 잎을 두어야 알뿌리가 살쪄요. 잎이 지면 물을 끊어요.", habitat:"남아프리카 케이프 (원종 기준)", family:"Iridaceae", familyKo:"붓꽃과", size:"s", propagation:["bulb"] },
  { id:"wf_kniphofia", name:"니포피아 (횃불백합)", alias:["니포피아", "레드핫포커", "Red Hot Poker", "야생화"], sci:"Kniphofia uvaria", cat:"flower", light:3, amount:2, days:3, winter:14, temp:"10~28℃", min:-20, pet:false, care:"빨강·노랑 횃불 같은 꽃 이삭이 서요. 화단이나 큰 화분에서 키우는 여러해살이예요. 겉흙이 마르면 흠뻑 주고, 겨울엔 땅 위가 시들어도 뿌리가 살아 있으니 흙이 바싹 마르지 않게만 해 주세요. 바깥 추위를 겪어야 다음 해 꽃이 잘 펴요.", habitat:"남아프리카", family:"Asphodelaceae", familyKo:"아스포델루스과", size:"m", propagation:["div"] },

// ── 날짜 ──
const DAY = 86400000;
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / DAY);
const isWinter = s => [12, 1, 2].includes(parse(s).getMonth() + 1);
const fmt = s => { const d = parse(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`; };

function interval(mine) {
  if (mine.custom) return mine.custom;
  const p = BY_ID[mine.plantId];
  return isWinter(mine.last) ? p.winter : p.days;
}
function nextDate(mine) { return addDays(mine.last, interval(mine)); }
function daysLeft(mine) { return diffDays(todayStr(), nextDate(mine)); }

const clean = (v, max = 200) => String(v ?? "").replace(/[<>&"'`]/g, "").trim().slice(0, max);
const clamp = (v, lo, hi, d) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
function normalizePlant(raw, source) {
  const days = clamp(raw.days, 1, 90, 7);
  return {
    id: raw.id || "c_" + Date.now().toString(36),
    name: clean(raw.name, 30) || "이름 없는 식물",
    alias: (Array.isArray(raw.alias) ? raw.alias : []).map(a => clean(a, 30)).filter(Boolean).slice(0, 6),
    sci: clean(raw.sci, 60),
    cat: CAT_NAME[raw.cat] && raw.cat !== "" && raw.cat !== "tree" ? raw.cat : "foliage",
    tree: raw.tree === true,
    light: clamp(raw.light, 1, 3, 2),
    amount: clamp(raw.amount, 1, 3, 2),
    days,
    winter: clamp(raw.winter, 1, 120, Math.round(days * 1.5)),
    temp: clean(raw.temp, 20),
    min: clamp(raw.min, -30, 25, 10),
    pet: raw.pet === true ? true : raw.pet === false ? false : undefined,
    care: clean(raw.care, 400),
    family: clean(raw.family, 40) || undefined,
    familyKo: clean(raw.familyKo, 20) || undefined,
    habitat: clean(raw.habitat, 80) || undefined,
    size: ["s", "m", "l"].includes(raw.size) ? raw.size : undefined,
    propagation: Array.isArray(raw.propagation) ? raw.propagation.filter(k => typeof k === "string").slice(0, 4) : undefined,
    source,
  };
}

  if (BY_ID[p.id]) return;

    sorted = [...state.mine].sort((a, b) => key(a).localeCompare(key(b), "ko") || label(a).localeCompare(label(b), "ko"));
  }
  else sorted = [...state.mine].sort((a, b) => label(a).localeCompare(label(b), "ko"));
  const due = sorted.filter(m => daysLeft(m) <= 0);
  const rest = sorted.filter(m => daysLeft(m) > 0);
  let html = `<div class="filters sort-bar" role="group" aria-label="정렬">
    ${[["name", "가나다순"], ["due", "물 줄 날순"], ["family", "과"], ["genus", "속"], ["species", "학명(종)"], ["manual", "직접 정렬"]].map(([v, l]) => `<button data-sort="${v}" aria-pressed="${mode === v}">${l}</button>`).join("")}
  </div>`;
  if (state.showExampleNote && state.mine.some(m => m.example)) {
    html += `<div class="note"><span>예시 식물 3개를 넣어뒀어요. 눌러서 삭제하고 내 식물을 추가해 보세요.</span><button id="hide-note">닫기</button></div>`;
  }
  const tender = state.mine.filter(m => BY_ID[m.plantId].min >= 10);
  if (isColdSeason() && tender.length) {
    const names = [...new Set(tender.map(m => m.nick || BY_ID[m.plantId].name))];
    html += `<div class="banner cold" role="note"><span>❄️</span><span><b>${esc(names.slice(0, 3).join(", "))}${names.length > 3 ? ` 외 ${names.length - 3}개` : ""}</b>는 추위에 약해요. 밤에 창가는 10℃ 아래로 떨어질 수 있으니 안쪽으로 옮겨주세요.</span></div>`;
  }
  if (due.length) html += `<div class="banner" role="status"><span>💧</span><span>오늘 물을 줘야 할 식물이 <b>${due.length}개</b> 있어요.</span></div>`;
  if (mode === "family" || mode === "genus" || mode === "species") {
    let last = null, out = "";
    for (const m of sorted) {
      const t = taxonomy(BY_ID[m.plantId]);
      const g = mode === "family" ? `${t.familyKo}${t.family ? " " + t.family : ""}` : mode === "genus" ? (t.genus || "미분류") : null;
      if (g !== null && g !== last) { out += `${last !== null ? "</div>" : ""}<div class="section-label">${esc(g)}</div><div class="list">`; last = g; }
      out += card(m);
    }
    html += mode === "species" ? `<div class="section-label">학명 알파벳순</div><div class="list">${out}</div>` : out + "</div>";
  } else if (mode === "manual") {
    html += `<div class="section-label">위아래 화살표로 순서를 바꿔요</div><div class="list">${sorted.map((m, i) => card(m, i, sorted.length)).join("")}</div>`;
  } else {
    if (due.length) html += `<div class="section-label">물 줄 때가 됐어요</div><div class="list">${due.map(m => card(m)).join("")}</div>`;
    if (rest.length) html += `<div class="section-label">다음 물 주기</div><div class="list">${rest.map(m => card(m)).join("")}</div>`;
  }
  view.innerHTML = html;
  view.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    state.sortMode = b.dataset.sort;
    if (state.sortMode === "manual" && !(state.order || []).length) state.order = sorted.map(m => m.uid);
    save(); renderHome();
  });
  fillPhotos(view);
  view.querySelectorAll("[data-move]").forEach(b => b.onclick = () => movePlant(b.dataset.uid, +b.dataset.move));
  const hn = $("#hide-note"); if (hn) hn.onclick = () => { state.showExampleNote = false; save(); render(); };
  view.querySelectorAll("[data-water]").forEach(b => b.onclick = () => water(b.dataset.water));
  view.querySelectorAll("[data-open]").forEach(b => b.onclick = () => openMine(b.dataset.open));
}

// 직접 정렬: 저장된 순서대로, 새로 추가한 식물은 맨 아래에 붙여요
function manualOrder() {
  const order = state.order || [];
  const byUid = Object.fromEntries(state.mine.map(m => [m.uid, m]));
  const list = order.filter(u => byUid[u]).map(u => byUid[u]);
  state.mine.forEach(m => { if (!order.includes(m.uid)) list.push(m); });
  return list;
}
function movePlant(uid, dir) {
  const ids = manualOrder().map(m => m.uid);
  const i = ids.indexOf(uid), j = i + dir;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  state.order = ids; save();
  const y = window.scrollY; renderHome(); window.scrollTo(0, y);
}

function card(m, idx, total) {
  const p = BY_ID[m.plantId];
  const left = daysLeft(m);
  const mover = idx === undefined ? "" : `<div class="mover">
      <button data-move="-1" data-uid="${m.uid}" aria-label="위로" ${idx === 0 ? "disabled" : ""}>▲</button>
      <button data-move="1" data-uid="${m.uid}" aria-label="아래로" ${idx === total - 1 ? "disabled" : ""}>▼</button>
    </div>`;
  return `<article class="card${mover ? " movable" : ""}">${mover}
    <button class="open name" data-open="${m.uid}">${thumbFor(p, coverPhoto(m))}${esc(m.nick || p.name)}${m.nick ? `<small>${esc(p.name)}</small>` : ""}${m.example ? `<small>예시</small>` : ""}</button>
    ${statusChip(left)}
    <div class="meta"><span class="chip light">${meter(p.light, "sun")}${LIGHT[p.light]}</span><span class="chip water">${interval(m)}일마다 · ${AMOUNT[p.amount]}</span><span class="chip temp">최저 ${p.min}℃</span><span class="chip fert">영양제 · ${fertNow(p)}</span></div>
    <div class="taxline">${taxLine(p)}${habitat(p) ? `<br>자생지 · ${esc(habitat(p))}` : ""}</div>
    <div class="next">다음 물 주는 날 ${fmt(nextDate(m))} · 마지막 ${fmt(m.last)}${m.journal?.length ? ` · 일지 ${m.journal.length}개` : ""}</div>
    <button class="water-btn ${left > 0 ? "light" : ""}" data-water="${m.uid}">물 줬어요</button>
  </article>`;
}

function water(uid) {
  const m = state.mine.find(x => x.uid === uid);
  m.last = todayStr();
  save(); render();
  toast(`${m.nick || BY_ID[m.plantId].name}에 물을 줬어요. 다음은 ${fmt(nextDate(m))}`);
}

function renderFind() {
  const view = $("#view");
  view.innerHTML = `<input class="search" id="q" type="search" placeholder="식물 이름으로 검색 (예: 몬스테라, 블루베리, 바질)" enterkeyhint="search" value="${esc(query)}" autocomplete="off">
    <div class="filters" role="group" aria-label="식물 종류">
      ${CATS.map(([v,l]) => `<button data-c="${v}" aria-pressed="${catFilter===v}">${l}</button>`).join("")}
    </div>
    <div class="filters light-filters" role="group" aria-label="빛 조건">
      ${[[0,"빛 전체"],[1,"음지"],[2,"반음지"],[3,"양지"]].map(([v,l]) => `<button data-f="${v}" aria-pressed="${filter===v}">${l}</button>`).join("")}
    </div>
    <div class="list" id="results" style="margin-top:12px"></div>`;
  const q = $("#q");
  q.oninput = () => { query = q.value; renderResults(); };
  // 키보드의 검색(엔터) 키를 누르거나 결과를 스크롤하면 키보드를 내려요
  q.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); q.blur(); } };
  q.onsearch = () => q.blur();
  $("#results").addEventListener("touchstart", () => q.blur(), { passive: true });
  view.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = +b.dataset.f; renderFind(); });
  view.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { catFilter = b.dataset.c; renderFind(); });
  renderResults();
}

// 띄어쓰기와 "나무" 유무에 상관없이 찾아요. 예: "벤자민 나무", "벤자민나무" → 벤자민고무나무
function matches(p, q) {
  if (!q) return true;
  const names = [p.name, ...p.alias, p.sci].map(s => s.replace(/\s/g, "").toLowerCase());
  const has = t => names.some(n => n.includes(t));
  const full = q.replace(/\s/g, "");
  if (has(full)) return true;
  if (full.length > 2 && full.endsWith("나무") && has(full.slice(0, -2))) return true;
  const words = q.split(/\s+/).filter(Boolean);
  return words.length > 1 && words.every(w => names.some(n => n.includes(w)));
}
// 내가 키우는 식물에 올린 사진이 있으면 검색 결과에도 보여줘요
const myCover = id => { for (const m of state.mine) if (m.plantId === id) { const k = coverPhoto(m); if (k) return k; } return null; };
function renderResults() {
  const q = query.trim().toLowerCase();
  const list = PLANTS.filter(p => (!filter || p.light === filter) &&
    (!catFilter || p.cat === catFilter || (catFilter === "tree" && p.tree)) && matches(p, q));
  const owned = new Set(state.mine.map(m => m.plantId));
  const r = $("#results");
  const helper = q ? `<div class="lookup">
      <div><b>${list.length ? "찾는 식물이 아닌가요?" : `"${esc(query.trim())}"은(는) 목록에 없어요.`}</b>
      <p>${sample ? "AI가 이 식물의 빛, 물주기, 온도를 찾아드려요. 직접 입력해도 돼요." : "이름과 물주기 간격을 직접 입력해서 등록할 수 있어요."}</p></div>
      <div class="row">${sample ? `<button class="primary" id="ai-find">AI로 찾기</button>` : ""}<button class="ghost" id="manual-add">직접 입력</button></div>
    </div>` : "";
  r.innerHTML = list.map(p => `<article class="card${owned.has(p.id) ? " added" : ""}">
    <button class="open name" data-info="${p.id}">${thumbFor(p, myCover(p.id))}${p.name}<small>${p.source ? SOURCE[p.source] : CAT_NAME[p.cat]}${p.tree && p.cat !== "tree" ? " · 나무" : ""}</small></button>
    <div class="acts"><button class="wish-btn" data-wish="${p.id}" aria-pressed="${inWish(p.id)}" aria-label="위시리스트">${inWish(p.id) ? "♥" : "♡"}</button><button class="add-btn" data-add="${p.id}" ${owned.has(p.id) ? "disabled aria-disabled=\"true\"" : ""}>${owned.has(p.id) ? "추가됨" : "추가"}</button></div>
    <div class="meta"><span class="chip light">${meter(p.light, "sun")}${LIGHT[p.light]}</span><span class="chip water">${p.days}일마다 · ${AMOUNT[p.amount]}</span><span class="chip temp">최저 ${p.min}℃</span><span class="chip fert">영양제 · ${fertNow(p)}</span>${p.pet ? `<span class="chip">반려동물 주의</span>` : ""}</div>
    <div class="taxline">${taxLine(p)}</div>
  </article>`).join("") + helper;
  const af = $("#ai-find"); if (af) af.onclick = () => aiLookup(query.trim());
  const ma = $("#manual-add"); if (ma) ma.onclick = () => openEditor({ name: query.trim() }, "manual");
  fillPhotos(r);
  r.querySelectorAll("[data-info]").forEach(b => b.onclick = () => openInfo(b.dataset.info));
  r.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openAdd(b.dataset.add));
  r.querySelectorAll("[data-wish]").forEach(b => b.onclick = () => {
    const on = toggleWish(b.dataset.wish);
    b.setAttribute("aria-pressed", on); b.textContent = on ? "♥" : "♡";
  });
}

// ── 위시리스트: 키우고 싶은 식물을 모아 두고, 키우게 되면 내 식물로 옮겨요 ──
const inWish = id => state.wish.some(w => w.plantId === id);
function toggleWish(id) {
  const on = !inWish(id);
  if (on) state.wish.push({ plantId: id, added: todayStr() });
  else state.wish = state.wish.filter(w => w.plantId !== id);
  save();
  toast(on ? `${BY_ID[id].name}을(를) 위시리스트에 담았어요.` : `${BY_ID[id].name}을(를) 위시리스트에서 뺐어요.`);
  return on;
}
function renderWish() {
  const view = $("#view");
  const list = state.wish.filter(w => BY_ID[w.plantId]);
  if (!list.length) {
    view.innerHTML = `<div class="empty"><h2>위시리스트가 비어 있어요</h2><p>식물 찾기에서 ♡를 누르면 키우고 싶은 식물을 담아 둘 수 있어요.</p><button class="primary" id="go-find">식물 찾기</button></div>`;
    $("#go-find").onclick = () => setTab("find");
    return;
  }
  view.innerHTML = `<p class="sub" style="color:var(--muted);margin:0 0 10px">${list.length}개 · "키우게 됐어요"를 누르면 내 식물로 옮겨져요.</p><div class="list">` +
    list.map(w => { const p = BY_ID[w.plantId]; return `<article class="card">
      <button class="open name" data-info="${p.id}">${thumbFor(p, myCover(p.id))}${p.name}<small>${CAT_NAME[p.cat]} · ${fmt(w.added)} 담음</small></button>
      <div class="meta"><span class="chip light">${meter(p.light, "sun")}${LIGHT[p.light]}</span><span class="chip water">${p.days}일마다 · ${AMOUNT[p.amount]}</span><span class="chip temp">최저 ${p.min}℃</span></div>
      <div class="taxline">${taxLine(p)}${habitat(p) ? `<br>자생지 · ${esc(habitat(p))}` : ""}</div>
      <div class="wish-acts"><button class="primary" data-grow="${p.id}">🌱 키우게 됐어요</button><button class="ghost" data-unwish="${p.id}">빼기</button></div>
    </article>`; }).join("") + `</div>`;
  fillPhotos(view);
  view.querySelectorAll("[data-info]").forEach(b => b.onclick = () => openInfo(b.dataset.info));
  view.querySelectorAll("[data-grow]").forEach(b => b.onclick = () => openAdd(b.dataset.grow));
  view.querySelectorAll("[data-unwish]").forEach(b => b.onclick = () => { const y = window.scrollY; toggleWish(b.dataset.unwish); renderWish(); window.scrollTo(0, y); });
}

// 학명에서 속·종을 나눠요. 품종명(따옴표)은 따로 보여줘요.
function taxonomy(p) {
  const sci = p.sci || "";
  const cultivar = (sci.match(/'([^']+)'/) || [])[1] || "";
  const base = sci.split("'")[0].replace(/\([^)]*\)/g, "").replace(/×/g, "× ").replace(/\s+/g, " ").trim();
  const words = base.split(" ").filter(w => /^[A-Za-z×.-]+$/.test(w));
  const genus = /^[A-Z]/.test(words[0] || "") ? words[0] : "";
  let species = words.slice(1).filter(w => !/^spp?\.?$/.test(w)).join(" ");
  const fam = p.family ? [p.family, p.familyKo || p.family] : GENUS_FAMILY[genus] || null;
  return {
    family: fam ? fam[0] : "", familyKo: fam ? fam[1] : "미분류",
    genus, species: genus && species ? species : "", cultivar,
    sci: genus ? base.replace(/ spp?\.$/, "") + (cultivar ? ` '${cultivar}'` : "") : sci,
  };
}
const taxLine = p => { const t = taxonomy(p); return `${t.familyKo}${t.genus ? ` · <i>${esc(t.sci)}</i>` : ""}`; };

const FERT_ID = {

function fertGroup(p) {
  if (p.cat === "carni") return "carni";
  for (const [g, ids] of Object.entries(FERT_ID)) if (ids.includes(p.id)) return g;
  if (p.cat === "hoya") return "hoya";
  if (p.id.startsWith("av_") || p.id === "minivoilet") return "violet";
  if (p.cat === "succulent") return "succulent";
  if (p.cat === "herb") return "herb";
  if (p.cat === "veg") return "veg";
  if (p.cat === "fruit") return "fruit";
  if (p.cat === "flower") return p.tree && p.min <= -5 ? "tree" : "flower";
  if (p.tree && p.min <= -10) return "tree";
  return "foliage";
}
const fertNow = p => FERT[fertGroup(p)][seasonNow()][0];
function fertSection(p) {
  const f = FERT[fertGroup(p)], now = seasonNow();
  return `<div class="fert-box"><h3>계절별 영양제</h3><p class="sci">${f.kind}</p>
    ${SEASONS.map(([k, l, months]) => `<div class="fert-row${k === now ? " now" : ""}"><b>${l} <small>${months}</small>${k === now ? `<span class="now-tag">지금</span>` : ""}</b><span>${f[k][1]}</span></div>`).join("")}

}
